# MI adapter declaration (§13.A shape per seam §21.1 field groups).
# NOTE: no Rust loader consumes this file yet (adapters are config artifacts +
# the four extensions per §21.1; no per-state loader module exists in
# subsystems/crawler/modules). Values below are recon-evidenced for Phase 5.
# Every field: `# from:` cite or `null # [uncertain: ...]`.

identity_axes:
  adapter_id: MI  # from: Phase 3.5 sibling-state extraction scope (MI pilot assignment)
  adapter_version: null  # [uncertain: no version in recon]
  target: MI  # from: mi/REPORT.md (single feed https://jobs.mitalent.org/job-search/ + results postback)
  phase_slots: [A]  # from: mi/REPORT.md §Module Design Notes (results grid carries all fields except full body; details robots-disallowed)
  bootstrap_requirement: form_prime_postback  # from: mi/scripts/probe_t1_replay.py (GET form -> POST search -> GET results)
  session_requirement: single_cookie_jar_plus_viewstate  # from: mi/REPORT.md §Module Design Notes (jar + latest __VIEWSTATE + startIndexNum)
  truncation_model: hard_page_cap_25  # from: mi/samples/t1replay_pagesize_top100_* (PageSize=100 still yields 25)
  ordering_model: null  # [uncertain: stability verdict owned by separate DeepSeek task; observations only — 0/25 page-1 overlap in 14/15 pairs, 1 pair shares 2]
  state_mutation_surface: session_search_state  # from: mi/REPORT.md §Feed Discovery (R2 stores criteria server-side in ASP.NET_SessionId)
  request_estimate_per_crawl: 2449  # from: mi/REPORT.md §Enumeration (3 priming + ceil(61152/25)-1 page postbacks)
  byte_estimate_per_crawl: null  # [uncertain: pages 174-183KB observed; no crawl total measured]
  phase_a_sufficient: true  # from: mi/REPORT.md §Module Design Notes (grid has id/title/employer/city/snippet; only full body text missing)
  phase_b_value: full_description_robots_disallowed  # from: mi/samples/t0_robots_20261026.txt (Disallow: /job-seeker/job-details/)
  classification_surface: [webforms_postback, html_grid, session_stateful, cookie_bootstrapped_details]  # from: mi/REPORT.md

transport:
  bootstrap_mode: get_form_then_post_search  # from: mi/scripts/probe_t1_replay.py steps 1-2
  pagination_mode: webforms_eventtarget_postback  # from: mi/REPORT.md §Request Contract R4
  endpoints:  # from: mi/REPORT.md §Request Contract
    - {method: GET, path: /job-search/, purpose: form_prime}
    - {method: POST, path: /job-search/, purpose: execute_search, params: [job_keywords, job_title, job_company, job_city, job_state, job_zip, job_radius, job_time_range, job_rate_amount, job_rate_time, job_exclude1, job_exclude3, IncludeStateWideJobs, chlCharacteristics, chlEducationLevel, chlPositionLevel, UcONetOccp]}
    - {method: GET, path: /job-seeker/jobsearch-results/, purpose: read_page_1}
    - {method: POST, path: /job-seeker/jobsearch-results/, purpose: paging_sort_pagesize, params: [__EVENTTARGET, PageSizeTop, PageSizeBtm, PageSortTop, PageSortBtm, startIndexNum]}
    - {method: GET, path: "/job-seeker/job-details/JobCode/{id}", purpose: detail_html_robots_disallowed}
    - {method: GET, path: /robots.txt, purpose: policy}
  endpoint_transport_overrides: null  # [uncertain: single transport observed for all endpoints]
  profile_ref: null  # [uncertain: no named profile in recon]
  response_schema_ref: reconnaissance/MI/extraction.json  # from: Phase 3.5 extraction
  render_readiness_predicates: ["status == 200", "txtJobCount_present", "cards_present"]  # from: mi/scripts/probe_t1_replay.py (count_jobs + title checks per step)
  session_lapse_predicates: ["status == 302", "location endswith /job-search/"]  # from: mi/REPORT.md §Module Design Notes (302 = session lost)
  nav_timeout_ms: 30000  # from: mi/scripts/*.py (timeout=30 throughout)
  nav_max_iter: null  # [uncertain: not measured]
  bootstrap_timeout_ms: null  # [uncertain: no bootstrap timing isolated]
  bootstrap_retry_limit: null  # [uncertain: no retry policy evidenced; re-prime + restart assumed]
  solver_names: []  # from: recon (no solver needed; T1 wins, no JS challenge)
  other_mechanism: null  # [uncertain: none observed]
  unsolvable_policy: null  # [uncertain: no blocking observed on the crawl path; one bare detail attempt hit Cloudflare block]
  max_response_bytes: 183704  # from: mi/samples/t3_after_submit_20261026T191204Z.html (largest observed page)
  io_buffer_bytes: null  # [uncertain: deployment declaration]
  max_rows_per_response: 25  # from: mi/samples/t1replay_* (every results page carries exactly 25 cards)

sessions:
  shard_topology: single  # from: recon (one host, one session model)
  shard_count: 1  # from: recon
  worker_count: 1  # from: mi/REPORT.md §Module Design Notes (safe concurrency 1; viewstate chains responses)
  max_inflight_per_session: 1  # from: mi/REPORT.md §Enumeration (strictly sequential; parallel viewstate use 500s)
  initial_bootstrap_cost_class: cheap_3_requests  # from: mi/REPORT.md §Enumeration (GET form + POST search + GET page 1)
  absolute_lifetime: null  # [uncertain: ~20 min idle hinted by lblSecconds/IdleTimeForUser, unmeasured]
  idle_lifetime: null  # [uncertain: not measured]
  rebootstrap_buffer: null  # [uncertain: not measured]
  keepalive_request: null  # [uncertain: none evidenced; sequential 1.5 s spacing kept sessions alive over short walks]
  handoff_max_age_seconds: null  # [uncertain: no handoff observed]
  engine_session_domain: jobs.mitalent.org  # from: mi/mi_cookies.txt (cookie jar domains)
  control_reserve_slots: null  # [uncertain: deployment declaration]
  saturation_grace: null  # [uncertain: no throttling observed to calibrate]
  resume_watermark: startIndexNum_plus_session  # from: mi/REPORT.md §Enumeration (persist session + viewstate + startIndexNum; session IS the cursor)
  worker_detection_bounds: null  # [uncertain: deployment declaration]
  worker_restart_bounds: null  # [uncertain: deployment declaration]

warmth:
  warm_pool_size: 0  # from: seam §18 (HttpClient, warm pool zero)
  preconnect: true  # from: seam §18 (preconnect enabled)
  preconnect_origins: ["https://jobs.mitalent.org"]  # from: recon (single app host; asset/CDN hosts unneeded for crawl)
  max_connections_per_slot: null  # [uncertain: deployment declaration]
  connection_idle_timeout: null  # [uncertain: not measured]
  page_reset_timeout: null  # [uncertain: not measured]

coverage:
  partition_keys: [job_time_range, keyword, occupation]  # from: mi/REPORT.md §Request Contract R2 filter fields (§Enumeration recommends time_range partitioning)
  domain_extractor: none_total_only  # from: recon (no facet/count endpoint; only single p#txtJobCount total)
  split_limit: null  # [uncertain: no partition walk demonstrated]
  total_source: html_p_txtJobCount  # from: mi/samples/t1replay_results_page1_* (<p id="txtJobCount">61152 Job(s)...</p>)
  total_extractor: p#txtJobCount ^([\d,]+) Job\(s\)  # from: mi/scripts/mi_parse.py total_count()
  total_unit: matches_live_drifting  # from: recon (61154->61149 over ~45 min; real churn, not static)
  floor_flag: false  # from: recon (no window cap observed; total is the live match count)
  session_minimum: null  # [uncertain: multi-session union suggested but unmeasured]
  row_cap: null  # [uncertain: no per-query cap observed beyond the 25/page shape]
  page_size: 25  # from: mi/samples/t1replay_pagesize* (hard server cap)
  saturation_patterns: ["page returns 0 cards", "page job codes subset of held codes", "page * 25 >= txtJobCount"]  # from: mi/REPORT.md §Enumeration stop rule
  tail_threshold: null  # [uncertain: MI clamps page size, no tail signal distinct from end]
  noop_threshold: null  # [uncertain: not measured]
  overflow_banners: []  # from: recon (no overflow/cap banner observed)
  posted_date_extractor: div.result-place "- Posted MM/DD/YYYY"  # from: mi/scripts/mi_parse.py parse_cards()
  coverage_capability: single_sequential_walk_unverified_deep  # from: mi/REPORT.md §Risks.1 (2-page coherence proven; 2,447-page walk unverified)

ordering_dedup:
  cursor_kind: webforms_session_viewstate  # from: mi/REPORT.md §Enumeration (session + viewstate + startIndexNum is the cursor)
  cursor_status: session_bound_not_url_addressable  # from: mi/samples/t1replay_fresh_results_* (fresh GET 302s; query strings ignored)
  coverage_scope: per_session  # from: recon (each session sees its own result set/order)
  duplicate_baseline: null  # [uncertain: p1/p2 disjoint in one session; deep-walk dupe rate unmeasured]
  overfetch_factors: null  # [uncertain: not measured]
  reconciliation_limit: null  # [uncertain: deployment declaration]
  dedupe_location: job_code  # from: mi/REPORT.md §Module Design Notes (75/75 distinct in probe.sqlite)
  reset_policy: reprime_restart_fresh_pass  # from: mi/REPORT.md §Enumeration (session death => restart, never mid-walk resume)
  excluded_headers: null  # [uncertain: none observed]
  representation_headers: []  # from: recon (no Accept-driven representations; HTML only)
  volatile_selectors: [attribute_quote_style]  # from: mi/scripts/mi_parse.py (quotes flip " wire vs ' DOM; parser accepts both)
  replay_capture_mode: cookie_jar_plus_viewstate_chain  # from: mi/scripts/probe_t1_replay.py

slm:
  shadow_mode: null  # [uncertain: no SLM in recon]
  shadow_revision: null  # [uncertain: no SLM in recon]
  bypass: null  # [uncertain: no SLM in recon]
  model: null  # [uncertain: no SLM in recon]
