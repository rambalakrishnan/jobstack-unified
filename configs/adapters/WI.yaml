# WI-A adapter declaration (§13.A shape per seam §21.1 field groups).
# NOTE: no Rust loader consumes this file yet (adapters are config artifacts +
# the four extensions per §21.1; no per-state loader module exists in
# subsystems/crawler/modules). Values below are recon-evidenced for Phase 5.
# Every field: `# from:` cite or `null # [uncertain: ...]`.

identity_axes:
  adapter_id: WI-A  # from: seam §17.5 target allocations (WI-A/WI-B)
  adapter_version: null  # [uncertain: no version in recon]
  target: WI-A  # from: wi/REPORT.md (single feed https://jobcenterofwisconsin.com/Presentation/JobSeekers/JobOrderList.aspx)
  phase_slots: [A, B]  # from: DETAILS.md §5 (headlines + details)
  bootstrap_requirement: none_stateless  # from: wi/REPORT.md §Tier Ladder (T0 bare-GET page 1, no cookies)
  session_requirement: optional_none_list_login_details  # from: wi/REPORT.md §Transport (cookies unused for list/paging) + Addendum (login jar replays for details)
  truncation_model: hard_row_cap_500_plus_banner  # from: wi/REPORT.md §Feed Discovery (500+ label + TooManyResults banner)
  ordering_model: ApproxIdDescending  # from: wi/REPORT.md §Feed Discovery (page1 00407xxxx -> p11 004065xxx -> p12 004063xxx; NOT Date Posted)
  state_mutation_surface: none  # from: recon (list/paging postbacks + detail GETs are reads; login is bootstrap, not crawl-path mutation)
  request_estimate_per_crawl: 275  # from: wi/REPORT.md §Enumeration (~150-400 for full list sweep)
  byte_estimate_per_crawl: 23000000  # from: wi/REPORT.md §Enumeration (~82-85KB/page x ~275 requests list sweep; detail pass ~38MB per DETAILS.md §2)
  phase_a_sufficient: true  # from: DETAILS.md §4 (headlines carry id/title/employer/city/posted/pay-hint)
  phase_b_value: full_description_pay_apply_after_login  # from: wi/samples/auth2_detail_004073143_20261026T234903Z.html (DutiesText 2,576 chars, PayValue, aplitrak URL)
  classification_surface: [webforms_postback_chain, GridView_html, login_gated_details]  # from: wi/REPORT.md

transport:
  bootstrap_mode: none_list_headed_browser_login_details  # from: wi/REPORT.md Addendum + DETAILS.md §3 (headed Thorium under Xvfb, reCAPTCHA)
  pagination_mode: viewstate_postback_chain  # from: wi/REPORT.md §Request Contract Endpoint 3 + wi/scripts/10_chained_paging.py
  endpoints:  # from: wi/REPORT.md §Request Contract + Addendum
    - {method: GET, path: /Presentation/JobSeekers/JobOrderList.aspx, purpose: list_html, params: [kwords, onet, loctyp, wd, Appr]}
    - {method: POST, path: /Presentation/JobSeekers/JobOrderList.aspx, purpose: paging_postback, params: [__EVENTTARGET_GridViewJobs, __EVENTARGUMENT_PageN]}
    - {method: GET, path: /Presentation/JobSeekers/EnhancedJobs-det.aspx, purpose: detail_html, params: [OrderNumber]}
    - {method: GET, path: /Presentation/JobSeekers/JobSearch.aspx, purpose: form_optional_url_minter}
    - {method: POST, path: /Presentation/JobSeekers/JobSearch.aspx, purpose: search_submit_optional}
    - {method: POST, path: /Login.aspx, purpose: login_bootstrap_headed_browser}
    - {method: GET, path: /robots.txt, purpose: policy}
  endpoint_transport_overrides: null  # [uncertain: single transport observed for all endpoints]
  profile_ref: null  # [uncertain: no named profile in recon]
  response_schema_ref: reconnaissance/WI/extraction.json  # from: Phase 3.5 extraction
  render_readiness_predicates: ["status == 200", "grid_present", "no System Error body"]  # from: wi/REPORT.md §Module Design Notes (System Error returns HTTP 200)
  session_lapse_predicates: ["detail fetch 302 to /Login.aspx"]  # from: wi/REPORT.md Addendum (re-login signal, not data error)
  nav_timeout_ms: 30000  # from: wi/scripts/*.py (timeout=30 list/paging, 40 details)
  nav_max_iter: null  # [uncertain: not measured]
  bootstrap_timeout_ms: null  # [uncertain: headed-browser login timing unmeasured]
  bootstrap_retry_limit: null  # [uncertain: no retry policy evidenced]
  solver_names: []  # from: recon (no solver; headed browser passes reCAPTCHA natively)
  other_mechanism: headed_thorium_xvfb  # from: wi/REPORT.md Addendum + DETAILS.md §3
  unsolvable_policy: degrade_to_headlines  # from: DETAILS.md §5 (WI detail_available true only with creds; degrade rather than throw)
  max_response_bytes: 89320  # from: wi/samples/t1_onet29_wd2_check.html (largest list capture; detail fixture 82,284 B)
  io_buffer_bytes: null  # [uncertain: deployment declaration]
  max_rows_per_response: 20  # from: wi/REPORT.md §Feed Discovery (fixed page size)

sessions:
  shard_topology: single  # from: recon (one host, one session model)
  shard_count: 1  # from: recon
  worker_count: 3  # from: wi/REPORT.md §Module Design Notes (sequential per partition, 2-3 across partitions)
  max_inflight_per_session: 1  # from: seam §18 stateful-session rule; paging chain is strictly sequential per partition
  initial_bootstrap_cost_class: trivial_list_browser_login_details  # from: recon (list needs zero requests; details need one headed login)
  absolute_lifetime: null  # [uncertain: expires "due to inactivity"; unmeasured]
  idle_lifetime: null  # [uncertain: not measured]
  rebootstrap_buffer: null  # [uncertain: not measured]
  keepalive_request: null  # from: recon (none evidenced; re-login on 302 instead)
  handoff_max_age_seconds: null  # [uncertain: no handoff observed]
  engine_session_domain: jobcenterofwisconsin.com  # from: wi/scripts/* (single app host)
  control_reserve_slots: null  # [uncertain: deployment declaration]
  saturation_grace: null  # [uncertain: no throttling observed to calibrate]
  resume_watermark: job_number  # from: wi/REPORT.md §Feed Discovery (dedupe by job number; never offset/total)
  worker_detection_bounds: null  # [uncertain: deployment declaration]
  worker_restart_bounds: null  # [uncertain: deployment declaration]

warmth:
  warm_pool_size: 0  # from: seam §18 (HttpClient, warm pool zero)
  preconnect: true  # from: seam §18 (preconnect enabled)
  preconnect_origins: ["https://jobcenterofwisconsin.com"]  # from: recon (single app host)
  max_connections_per_slot: null  # [uncertain: deployment declaration]
  connection_idle_timeout: null  # [uncertain: not measured]
  page_reset_timeout: null  # [uncertain: not measured]

coverage:
  partition_keys: [onet, wd, loctyp, Appr]  # from: wi/REPORT.md §Enumeration (ordered split ladder; onet x wd first)
  domain_extractor: form_select_options  # from: wi/samples/t1_form_inventory_* (onet 23 SOC majors + wd/loctyp values from JobSearch.aspx controls)
  split_limit: null  # [uncertain: cross-product coverage unproven; depth unbounded in evidence]
  total_source: label_rowcount  # from: wi/REPORT.md (§Feed Discovery Label_RowCount "N Jobs Found. (M openings)")
  total_extractor: "#ctl00_ContentPlaceHolder_MainBase_Label_RowCount"  # from: wi/scripts/13_parse_rows.py
  total_unit: jobs_capped_500_plus_openings  # from: wi/REPORT.md (floor, not total; openings != jobs)
  floor_flag: true  # from: recon (500+ floor forces partitioning)
  session_minimum: null  # [uncertain: single-session evidence only]
  row_cap: 500  # from: wi/REPORT.md (hard display cap, 25 pages x 20 rows)
  page_size: 20  # from: wi/REPORT.md §Feed Discovery (fixed; no page-size control)
  saturation_patterns: ["500+ Jobs Found label", "Label_TooManyResults non-empty"]  # from: wi/REPORT.md §Enumeration cap handling
  tail_threshold: 500  # from: recon (cap edge)
  noop_threshold: null  # [uncertain: WI errors via System Error body, no no-op signal distinct from failure]
  overflow_banners: ["More than 500 jobs were found that match your search criteria.  Please refine your search."]  # from: wi/samples/t0_page1_verified_* (Label_TooManyResults)
  posted_date_extractor: span[id$='lblDatePosted']  # from: wi/scripts/13_parse_rows.py
  coverage_capability: plausible_partitioned_walk  # from: wi/REPORT.md §Enumeration (per-axis proven, cross-product unproven)

ordering_dedup:
  cursor_kind: chained_viewstate_postback  # from: wi/scripts/10_chained_paging.py (Page$N + previous viewstate; factual mechanism only, no continuation verdict)
  cursor_status: null  # [uncertain: cursor-continuation verdict owned by separate assessment task; not decided here]
  coverage_scope: per_run  # from: seam §17.5
  duplicate_baseline: null  # [uncertain: SOC-overlap dupes noted, rate unmeasured]
  overfetch_factors: null  # [uncertain: not measured]
  reconciliation_limit: null  # [uncertain: deployment declaration]
  dedupe_location: job_number  # from: wi/REPORT.md §Feed Discovery
  reset_policy: null  # [uncertain: not evidenced]
  excluded_headers: null  # [uncertain: none observed]
  representation_headers: []  # from: recon (no content negotiation; HTML only, no JSON variant)
  volatile_selectors: [WebResource_axd_t_timestamp]  # from: extraction-time diff of t1_page2_session vs t1_page2_stateless (only byte difference)
  replay_capture_mode: login_jar_replay  # from: wi/scripts/22_replay_details.py (harvested cookies over plain httpx)

