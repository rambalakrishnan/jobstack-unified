# IL-A adapter declaration (§13.A shape per seam §21.1 field groups).
# NOTE: no Rust loader consumes this file yet (adapters are config artifacts +
# the four extensions per §21.1; no per-state loader module exists in
# subsystems/crawler/modules). Values below are recon-evidenced for Phase 5.
# Every field: `# from:` cite or `null # [uncertain: ...]`.

identity_axes:
  adapter_id: IL-A  # from: seam §17.5 target allocations (IL-A/IL-B)
  adapter_version: null  # [uncertain: no version in recon]
  target: IL-A  # from: il/REPORT.md (single feed https://ijl.illinois.gov/search/jobs)
  phase_slots: [A, B]  # from: DETAILS.md §5 (headlines + details)
  bootstrap_requirement: synthetic_cookie  # from: il/scripts/t1_dummy_cookie.py (any _session_id)
  session_requirement: single_cookie_jar  # from: il/REPORT.md §Module Design Notes
  truncation_model: silent_tail_clamp  # from: il/samples/p5_* (pages past window repeat tail)
  ordering_model: Deterministic  # from: il/samples/p4_json_page2_repeat_* (identical id sequence)
  state_mutation_surface: none  # from: recon (GET-only crawl path; apply endpoint out of scope)
  request_estimate_per_crawl: 1700  # from: il/REPORT.md §Enumeration (~1,600-1,800)
  byte_estimate_per_crawl: null  # [uncertain: page bytes vary 82-159KB; no crawl total measured]
  phase_a_sufficient: true  # from: DETAILS.md §4 (headlines carry id/title/employer/city/snippet)
  phase_b_value: full_description_identical_to_json  # from: il/samples/p1_detail_job_* (description == JSON field)
  classification_surface: [rails_waf_bypass, json_feed, html_facets]  # from: il/REPORT.md

transport:
  bootstrap_mode: synthetic_32hex_session  # from: il/scripts/t1_dummy_cookie.py
  pagination_mode: offset_page_per_page  # from: il/REPORT.md §Feed Discovery
  endpoints:  # from: il/REPORT.md §Request Contract
    - {method: GET, path: /search/jobs, purpose: list_html, params: [page, per_page, search_job_search_filters]}
    - {method: GET, path: /search/jobs, purpose: list_json, headers: {Accept: application/json}}
    - {method: GET, path: /search/jobs.json, purpose: list_json_suffix}
    - {method: GET, path: "/jobs/{id}", purpose: detail_html}
    - {method: GET, path: /, purpose: session_prime_optional}
    - {method: GET, path: /robots.txt, purpose: policy}
  endpoint_transport_overrides: null  # [uncertain: single transport observed for all endpoints]
  profile_ref: null  # [uncertain: no named profile in recon]
  response_schema_ref: reconnaissance/IL/extraction.json  # from: Phase 3.5 extraction
  render_readiness_predicates: ["status == 200", "cards_present or jobs_key_present"]  # from: il/scripts/t1_dummy_cookie.py (card count + json keys checks)
  session_lapse_predicates: ["status == 202", "x-amzn-waf-action == challenge"]  # from: il/REPORT.md §Transport
  nav_timeout_ms: 25000  # from: il/scripts/*.py (timeout=25 throughout)
  nav_max_iter: null  # [uncertain: not measured]
  bootstrap_timeout_ms: null  # [uncertain: dummy cookie is instant; no bootstrap timing]
  bootstrap_retry_limit: 1  # from: il/REPORT.md §Module Design Notes (one 202 retry, then browser fallback)
  solver_names: []  # from: recon (no solver needed; T1 wins)
  other_mechanism: null  # [uncertain: none observed]
  unsolvable_policy: browser_harvest_fallback  # from: il/scripts/t3_browser_probe.py (1.19s self-solve, replay proven)
  max_response_bytes: 158800  # from: il/samples/t1_dummy_session_pp50_* (largest observed page)
  io_buffer_bytes: null  # [uncertain: deployment declaration]
  max_rows_per_response: 50  # from: il/samples/p1_perpage50_* (per_page=100 still yields 50)

sessions:
  shard_topology: single  # from: recon (one host, one session model)
  shard_count: 1  # from: recon
  worker_count: 3  # from: il/REPORT.md §Module Design Notes (concurrency 2-3)
  max_inflight_per_session: 1  # from: seam §18 stateful-session rule; recon used sequential probes
  initial_bootstrap_cost_class: trivial  # from: recon (static cookie, zero requests to bootstrap)
  absolute_lifetime: null  # [uncertain: single ~15-min session; one 4-day token expiry observed]
  idle_lifetime: null  # [uncertain: not measured]
  rebootstrap_buffer: null  # [uncertain: not measured]
  keepalive_request: null  # from: recon (none needed; static cookie)
  handoff_max_age_seconds: null  # [uncertain: no handoff observed]
  engine_session_domain: ijl.illinois.gov  # from: il/scripts/* (cookie domain .ijl.illinois.gov)
  control_reserve_slots: null  # [uncertain: deployment declaration]
  saturation_grace: null  # [uncertain: no throttling observed to calibrate]
  resume_watermark: job_id  # from: il/REPORT.md §Enumeration (dedupe/keyed resume on id)
  worker_detection_bounds: null  # [uncertain: deployment declaration]
  worker_restart_bounds: null  # [uncertain: deployment declaration]

warmth:
  warm_pool_size: 0  # from: seam §18 (HttpClient, warm pool zero)
  preconnect: true  # from: seam §18 (preconnect enabled)
  preconnect_origins: ["https://ijl.illinois.gov"]  # from: recon (single app host; asset host unneeded for crawl)
  max_connections_per_slot: null  # [uncertain: deployment declaration]
  connection_idle_timeout: null  # [uncertain: not measured]
  page_reset_timeout: null  # [uncertain: not measured]

coverage:
  partition_keys: [job_location_state, county, work_type, source, date_posted]  # from: il/REPORT.md §Enumeration (ordered split ladder)
  domain_extractor: facet_sidebar_counts  # from: il/samples/p1_perpage50_* (exact-count facets)
  split_limit: null  # [uncertain: depth unbounded in evidence; 3 passes demonstrated]
  total_source: json_total_or_html_header  # from: il/REPORT.md (total field + "of N matches")
  total_extractor: $.total  # from: il/samples/t1_random_session_json_* ({jobs,pages,total})
  total_unit: matches_capped_10000  # from: il/REPORT.md (total is window-capped, not corpus)
  floor_flag: true  # from: recon (10,000 floor forces partitioning)
  session_minimum: null  # [uncertain: single-session evidence only]
  row_cap: 10000  # from: il/samples/p5_* (clamp proofs)
  page_size: 50  # from: il/samples/p1_perpage50_* (HTML); JSON fixed 10
  saturation_patterns: ["header start offset stops advancing", "page returns <50 cards"]  # from: il/REPORT.md §Enumeration stop rule
  tail_threshold: 10000  # from: recon (window edge)
  noop_threshold: null  # [uncertain: IL clamps, no no-op signal distinct from tail]
  overflow_banners: ["of 78,528 total active jobs"]  # from: il/samples/t1_dummy_session_pp50_* (true total beside capped window)
  posted_date_extractor: p.card-metdata--job-posted-on  # from: il/REPORT.md §B (sic "metdata")
  coverage_capability: proven_partitioned_walk  # from: il/REPORT.md §Enumeration (AND-splits measured)

ordering_dedup:
  cursor_kind: positional_offset  # from: recon (page/per_page; NOT a continuation)
  cursor_status: allowed_per_run_deterministic  # from: seam §17.5 (deterministic per-run offsets allowed)
  coverage_scope: per_run  # from: seam §17.5
  duplicate_baseline: null  # [uncertain: boundary-shift dupes noted, rate unmeasured]
  overfetch_factors: null  # [uncertain: not measured]
  reconciliation_limit: null  # [uncertain: deployment declaration]
  dedupe_location: job_id  # from: il/REPORT.md §Enumeration
  reset_policy: null  # [uncertain: not evidenced]
  excluded_headers: null  # [uncertain: none observed]
  representation_headers: [Accept]  # from: recon (Accept switches HTML/JSON representation)
  volatile_selectors: []  # from: recon (stable card DOM ids observed; none flagged volatile)
  replay_capture_mode: static_cookie  # from: il/scripts/t2_cookie_replay.py

slm:
  shadow_mode: null  # [uncertain: no SLM in recon]
  shadow_revision: null  # [uncertain: no SLM in recon]
  bypass: null  # [uncertain: no SLM in recon]
  model: null  # [uncertain: no SLM in recon]
  version: null  # [uncertain: no SLM in recon]
  artifact: null  # [uncertain: no SLM in recon]
  digests: null  # [uncertain: no SLM in recon]
  parameters: null  # [uncertain: no SLM in recon]
  quantization: null  # [uncertain: no SLM in recon]
  input_token_limit: null  # [uncertain: no SLM in recon]
  batch_token_limit: null  # [uncertain: no SLM in recon]
  item_limit: null  # [uncertain: no SLM in recon]
  inference_timeout: null  # [uncertain: no SLM in recon]
  batch_dwell: null  # [uncertain: no SLM in recon]
  result_ttl: null  # [uncertain: no SLM in recon]
  load_timeout: null  # [uncertain: no SLM in recon]
  isolation_reservation: null  # [uncertain: no SLM in recon]

queue_storage:
  lease_ttl: null  # [uncertain: deployment declaration]
  lease_overrides: null  # [uncertain: deployment declaration]
  retry_limit: 1  # from: il/REPORT.md §Module Design Notes (single 202 retry)
  retry_overrides: null  # [uncertain: deployment declaration]
  sweeper_interval: null  # [uncertain: deployment declaration]
  row_capacity: 78528  # from: il/REPORT.md (corpus size at capture; drifts live)
  byte_capacity: null  # [uncertain: 82-159KB/page observed; no capacity declared]
  staging_budget: null  # [uncertain: deployment declaration]
  transaction_microbatch_limit: null  # [uncertain: deployment declaration]
  projection_lag_target: null  # [uncertain: deployment declaration]
  publication_metadata_bound: null  # [uncertain: deployment declaration]

memory_content_telemetry:
  memory_targets: null  # [uncertain: deployment declaration (crawler defaults 200MB)]
  overshoot_percent: null  # [uncertain: deployment declaration]
  overshoot_amount: null  # [uncertain: deployment declaration]
  overshoot_justification: null  # [uncertain: deployment declaration]
  content_declarations: [il_extractor_v3_shape]  # from: Phase 4 crawler_acquisition tests (decl_entry extractor name; recon has no extractor versioning)
  failure_extensions: [challenge_202, window_clamp, duplicate_boundary_ids]  # from: il/REPORT.md §Module Design Notes failure modes
  sink_threshold: null  # [uncertain: deployment declaration]
  telemetry_record_bound: null  # [uncertain: deployment declaration]
  diagnostic_byte_bound: null  # [uncertain: deployment declaration]
