[project]
name = "connector_transport"
version = "0.1.0"
description = "Module implementing connector_transport at tier 3"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["connector_transport"]
package-dir = {"connector_transport" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
