[project]
name = "provider_effects"
version = "0.1.0"
description = "Module implementing provider_effects at tier 3"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["provider_effects"]
package-dir = {"provider_effects" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
