[project]
name = "origin_receipts"
version = "0.1.0"
description = "Module implementing origin_receipts at tier 6"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["origin_receipts"]
package-dir = {"origin_receipts" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
