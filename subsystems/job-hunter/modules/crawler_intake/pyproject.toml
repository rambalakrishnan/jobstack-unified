[project]
name = "crawler_intake"
version = "0.1.0"
description = "Module implementing crawler_intake at tier 6"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crawler_intake"]
package-dir = {"crawler_intake" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
