[project]
name = "artifact_store"
version = "0.1.0"
description = "Module implementing artifact_store at tier 1"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["artifact_store"]
package-dir = {"artifact_store" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
