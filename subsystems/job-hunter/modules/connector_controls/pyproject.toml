[project]
name = "connector_controls"
version = "0.1.0"
description = "Module implementing connector_controls at tier 6"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["connector_controls"]
package-dir = {"connector_controls" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
