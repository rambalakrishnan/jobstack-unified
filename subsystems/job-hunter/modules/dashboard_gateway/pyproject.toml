[project]
name = "dashboard_gateway"
version = "0.1.0"
description = "Module implementing dashboard_gateway at tier 5"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dashboard_gateway"]
package-dir = {"dashboard_gateway" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
