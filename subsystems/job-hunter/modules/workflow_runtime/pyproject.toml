[project]
name = "workflow_runtime"
version = "0.1.0"
description = "Module implementing workflow_runtime at tier 9"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["workflow_runtime"]
package-dir = {"workflow_runtime" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
