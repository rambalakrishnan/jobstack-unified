[project]
name = "evidence_journal"
version = "0.1.0"
description = "Module implementing evidence_journal at tier 2"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evidence_journal"]
package-dir = {"evidence_journal" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
