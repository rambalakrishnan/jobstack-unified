[project]
name = "contract_codec"
version = "0.1.0"
description = "Module implementing contract_codec at tier 0"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contract_codec"]
package-dir = {"contract_codec" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
