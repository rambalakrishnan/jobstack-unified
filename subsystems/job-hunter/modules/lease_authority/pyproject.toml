[project]
name = "lease_authority"
version = "0.1.0"
description = "Module implementing lease_authority at tier 3"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lease_authority"]
package-dir = {"lease_authority" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
