[package]
name = "crawler_browser"
version = "0.1.0"
edition = "2021"

[dependencies]
crawler_schema = { path = "../crawler_schema" }
crawler_readonly = { path = "../crawler_readonly" }
crawler_admission = { path = "../crawler_admission" }
crawler_capabilities = { path = "../crawler_capabilities" }
browser_oxide = "0.1.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
crawler_authority = { path = "../crawler_authority" }
crawler_hashing = { path = "../crawler_hashing" }
crawler_store = { path = "../crawler_store" }
crawler_time = { path = "../crawler_time" }
serde_json = "1"
static_assertions = "1"
tokio = { version = "1", features = ["rt", "time"] }
