$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:job-application:contracts:application-attempt-lifecycle:0.1.0
title: Application attempt lifecycle
description: >-
  Review draft for commissioning, observing, and reconciling one application
  attempt without collapsing dispatch, observation, execution claims, origin
  facts, and reporting into a single status. Supports manual production work
  without requiring an automation subject or laboratory.
x-status: proposed
x-source: "1-handoff-brief.txt, Parts VI and VIII–IX."

x-source-index:
  handoff: &h "1-handoff-brief.txt, Parts VI and VIII–X"
  scope: &s "1-handoff-brief.txt, Parts III and V"
  storage: &o "2-state-bank-crawler-blueprint.json, §11 and Decision 8"
  diagnostic: &d "3-hellscape-blueprint.md, §§4–5 and 10"
  fixture: &f "3-hellscape-blueprint.md, §§6.1, 9, and 12"
  native: &n "4-circus-tent-arch.md, §§5.6 and 5.8"
  qualification: &q "5-browser-qualification.md, Evidence discipline"
  product: &j "6-get-a-job.xml.txt, docs/contracts/firestore-collections.md and job_search_queries.txt"
  kernel: &k "contracts/00-evidence-kernel.yaml, evidence-kernel/0.1.0"
  wire: &w >-
    Proposed wire design implementing the handoff's five-owner lifecycle.
    New state names, record discriminators, guards, and publication mechanics
    are contract proposals, not claims about an existing native deployment.

x-contract:
  name: application-attempt-lifecycle
  version: 0.1.0
  maturity: review_draft
  owner: contracts
  consumers: [job-hunter, Circus Tent, Ringmaster, Hellscape]
  conformance_suite: conformance/01-application-attempt-lifecycle.md
  corpus:
    - qualification_evidence_discipline
    - cancellation_and_late_commitment_cases
    - synthetic_connector_lifecycle_cases
    - manual_practice_and_production_recording
  purpose: >-
    Track the candidate's attempts through honest outcomes, including unresolved
    outcomes, and retain the evidence needed to improve execution. A successful
    practice attempt cannot commission or certify a production application.
  x-status: inferred
  x-source: "1-handoff-brief.txt Parts III, VI, VIII–IX; 3-hellscape-blueprint.md §§4–5."

x-kernel-compatibility:
  version: evidence-kernel/0.1.0
  reference_policy: >-
    All schema references are local. The common definitions below preserve the
    kernel's wire meanings; this file does not introduce alternative null,
    timing, digest, provenance, or evidence-reference conventions.
  mirrored_types:
    - Identifier
    - Revision
    - PositiveInteger
    - Digest
    - Missing
    - EvidenceRef
    - JournalPrefix
    - ArtifactReference
    - VersionPin
    - TimePoint
    - Measurement
    - MeasurementEvidence
    - SubjectIdentity
    - AssistanceRecord
    - AttemptContext
  application_restriction: >-
    ExecutionDescriptor is restricted to manual or subject for an application
    attempt. The kernel's service mode remains valid for discovery and other
    non-application work.
  validation_gate: >-
    Structural validation and all LIFE rules are required. Validate evidence
    references, identities, ownership, publication revisions, and measurements
    against retained kernel evidence; a structurally valid source_checks object
    is not itself proof that its checks occurred.
  x-status: proposed
  x-source: *k

x-ownership:
  commissioning:
    authority: commissioner
    scope: >-
      Immutable candidate, job, task, permission, execution configuration,
      lineage, and owner bindings. This is metadata, not a sixth outcome axis.
    x-status: inferred
    x-source: *h
  dispatch:
    authority: connector
    scope: Intended delivery, local handle, delivery uncertainty, and native acceptance evidence.
    x-status: extracted
    x-source: *h
  observation:
    authority: connector
    scope: >-
      Observation window, local deadlines, connection closure, bounded drain,
      cleanup observations, and the immutable close-time knowledge snapshot.
    x-status: inferred
    x-source: *d
  execution:
    authority: subject
    scope: >-
      Subject-authored claims only. An authenticated adapter may faithfully
      publish them for the bound subject; it may not invent or strengthen them.
    x-status: inferred
    x-source: *h
  application:
    authority: origin
    scope: >-
      Origin facts only. Hellscape's reducer supplies practice facts; a
      production receipt gateway records verified facts from the bound employer
      origin without becoming the origin or the reconciler.
    x-status: proposed
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§3.2, 4.6, 11.1."
  report:
    authority: reconciler
    scope: >-
      Comparisons and limitations over pinned source revisions. It writes no
      dispatch, observation, execution, or application field.
    x-status: extracted
    x-source: *h
  manual_recording:
    rule: >-
      A local recorder occupies the observation role without invoking an
      automation connector. Dispatch and execution remain explicitly
      inapplicable. Manual actions are observations, not fabricated subject
      claims; employer receipt evidence can still establish an application fact.
    x-status: proposed
    x-source: "1-handoff-brief.txt Part IX; 3-hellscape-blueprint.md §§3.1, 4.4, 11.1."

x-reconciliation:
  - decision: >-
      Firestore tracker.status and crawler semantic_state are not imported as
      this attempt's authoritative outcome. Product projections may retain their
      own workflow fields, but must cite these independently owned axes.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 2-state-bank-crawler-blueprint.json §11.14; 6-get-a-job.xml.txt docs/contracts/firestore-collections.md."
  - decision: >-
      Native /run completed maps initially to an execution-lifecycle claim, not
      application commitment. Primitive success, acknowledgement, and None
      never acquire stronger semantics merely through normalization.
    x-status: extracted
    x-source: "3-hellscape-blueprint.md §4.6; 5-browser-qualification.md."
  - decision: >-
      Execution and application domains retain cumulative immutable claim/fact
      histories. Receipt order is not assumed to be occurrence order, and a
      later callback cannot silently replace an earlier conflicting response.
    x-status: proposed
    x-source: *d
  - decision: >-
      Report.state has only reconciled and contradicted as decided verdicts.
      Missing with reason represents no decidable or applicable verdict; it is
      not a third success state. Reconciled means the declared comparisons were
      accounted for, not that the application succeeded or every native claim
      was independently proved.
    x-status: proposed
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§4.4–4.6."
  - decision: >-
      A production origin need not implement this portfolio's connector or
      journal API. Its designated fact recorder may normalize verified origin
      receipts under a pinned policy. A human note or subject claim alone is
      insufficient; the receipt's original provenance and correlation evidence
      remain visible.
    x-status: proposed
    x-source: "1-handoff-brief.txt Parts VI and IX; 3-hellscape-blueprint.md §§3.2, 11.1."
  - decision: >-
      Local idempotency and native checkpoint ledgers do not promise exactly-once
      employer commitment. Ambiguous delivery is preserved and is not repaired
      by generating a new idempotency key or switching executors.
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §10.6; 4-circus-tent-arch.md §5.6."
  - decision: >-
      No handoff amendment is introduced. The mechanisms here operationalize
      its invariants without claiming current native capability or selecting
      orchestrator storage, language, or browser packaging.
    x-status: proposed
    x-source: *w

x-invariants:
  - id: LIFE-COMMISSION
    classification: invariant
    rule: >-
      Commission before an authorized automated dispatch. Freeze attempt identity,
      kind, candidate, job snapshot, target, task, execution configuration, owner
      bindings, and permissions. The commission must agree with the admitted
      manifest and be journaled before Start can cause a native request.
      Changing the subject version, target, kind, or task creates a new attempt.
    derivation: "A later outcome cannot determine retroactively what was commissioned."
    x-status: inferred
    x-source: *h

  - id: LIFE-AXES
    classification: invariant
    rule: >-
      Exactly one authority role owns each of the five axes. Each applicable
      axis has exactly one bound publication writer. A writer may publish only
      its axis and must preserve the identity of its authoritative source.
      A report writer must not hold execution/application write authority.
      No whole-attempt status or multi-axis update command is defined here.
    consequence: >-
      Missing source evidence is not permission for another owner to fill the
      axis. An inapplicable manual execution axis has no invented subject or
      active subject writer.
    derivation: "A single status cannot represent connection closure, unknown execution, and later commitment."
    x-status: extracted
    x-source: *h

  - id: LIFE-PUBLICATION
    classification: invariant
    rule: >-
      Axis revisions are complete immutable publications. The key is
      (attempt_id, kind, axis, revision); a different value under the same key
      is an integrity conflict. Each next revision is previous_revision + 1.
      Only the owner-local revision check and journal commit are atomic.
      Publication to readers is asynchronous and cannot require another
      owner's transaction, acknowledgement, or payload serialization.
    consequence: >-
      A snapshot pins one complete publication per axis, or revision zero for
      no publication. Readers see old-or-new publications, never partial bodies.
      A snapshot seal records the locally available version vector, not global
      synchronous linearizability.
    derivation: "Stage1's independent write domains must survive composition of the attempt record."
    x-status: inferred
    x-source: *o

  - id: LIFE-EVIDENCE
    classification: invariant
    rule: >-
      The journal is the source of truth. Every publication cites its supporting
      prefix and source evidence; it is itself registered after its bytes exist.
      Do not put the publication's own registration event or digest inside its
      derivation inputs. Imported evidence must be registered locally with its
      original scope and trust, not promoted by the act of import.
    consequence: >-
      Readers verify commission digests, owner identity, evidence references,
      artifact availability, and prefix bounds before using a publication.
      Synthetic and historical-unscored records cannot count as real production
      applications.
    derivation: "Anything added outside the journal could otherwise become retroactive evidence."
    x-status: inferred
    x-source: *h

  - id: LIFE-DISPATCH
    classification: invariant
    rule: >-
      Prepare is non-executing. Before the first native delivery, durably allocate
      the connector-local handle and record the intended request digest,
      idempotency key, and dispatching transition. A native run ID is attached
      only when actually received and correlated. Local Start acknowledgement
      is not native acceptance; native acceptance is not execution completion.
    consequence: >-
      A crash or lost response around delivery yields uncertain unless stronger
      evidence establishes acceptance or non-acceptance. A local prerequisite or
      translation failure is not a fabricated subject execution failure.
    derivation: "Acknowledgement, execution, and semantic success have different evidence boundaries."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§5.2–5.4 and 10.6; 5-browser-qualification.md."

  - id: LIFE-IDEMPOTENCY
    classification: invariant
    rule: >-
      The commissioning idempotency key is scoped to the commissioning principal
      and immutable attempt request. Same key and request returns the same local
      attempt/handle; changed content under the key is rejected. Repeated Start
      does not launch a second logical execution.
    consequence: >-
      Native resend/resume requires an evidenced native idempotency or checkpoint
      contract, matching request identity, and a journaled recovery authorization.
      It remains the same logical delivery and cannot re-execute a completed
      side-effecting step. Without those guarantees, preserve uncertainty and
      require reconciliation or explicit duplicate-risk review before a new try.
      A local lease expiry does not establish safe resubmission.
    derivation: "A local ledger cannot roll back an employer write whose acknowledgement was lost."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §10.6; 4-circus-tent-arch.md §5.6."

  - id: LIFE-CLOSE
    classification: invariant
    rule: >-
      Active observation, transport connection, native execution, application
      mutation authority, and native context lifetime are distinct. On the local
      active deadline or end request, stop issuing workflow commands, record
      native-cancel availability and any attempt, record transport closure, and
      drain effects/evidence only within the commissioned bound.
    consequence: >-
      Close the observation window even if the subject continues. Freeze the
      close-time knowledge snapshot and version pins. Later evidence may append
      and revise the report but cannot reopen that window, rewrite close-time
      knowledge, or silently resume workflow commands.
    derivation: "The observed post-disconnect continuation makes close equivalent to cancel unsound."
    x-status: extracted
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §5.5."

  - id: LIFE-CONTROLS
    classification: invariant
    rule: >-
      RequestNativeCancel, CloseObservationConnection, ReleaseNativeContext, and
      Contain are separately evidenced operations. A request is not an
      acknowledgement; acknowledgement is not an observed effect. A stop claim
      is retained as a subject claim, not upgraded to a no-commit fact.
    consequence: >-
      Unsupported or uncertain cancellation does not prevent local finalization.
      Containment needs explicit authority and records its affected scope.
      Killing a process, releasing a context, quarantining a slot, or sealing a
      fixture does not demonstrate subject-native bounded cancellation or undo
      committed application work.
    derivation: "Forced termination is not cooperative cancellation, and application transactions can outlive a client."
    x-status: extracted
    x-source: "3-hellscape-blueprint.md §§4.1, 5.5, 13; 5-browser-qualification.md."

  - id: LIFE-CLAIMS
    classification: invariant
    rule: >-
      Execution publications contain only faithfully mapped, source-attributed
      claims from the commissioned subject/version. Preserve raw responses,
      mapping versions, declared scope, original times when available, and
      receipt times. An absent state is Missing, not an invented subject claim
      of unknown. Explicit unknown remains a valid subject claim.
    consequence: >-
      Append conflicting authenticated responses/callbacks without last-write-wins
      replacement. A terminal-looking claim does not prohibit recording later
      conflicting evidence. Primitive or lifecycle scope is not silently widened
      to application commitment.
    derivation: "The reconciler must compare the original claim, not a corrected copy of it."
    x-status: inferred
    x-source: *d

  - id: LIFE-ORIGIN
    classification: invariant
    rule: >-
      An application fact must identify the commissioned origin, candidate, job,
      and attempt, and cite verified source and correlation evidence under the
      pinned origin policy. A local fixture fact cites its transaction; a
      production fact cites an actual verified origin receipt. HTTP 200, a submit
      click, a subject result, or an operator assertion alone is insufficient.
    consequence: >-
      No accepted fact means unknown knowledge, not not_committed. An as-of
      absence permits later commitment. Final absence requires an origin-owned
      guarantee covering the attempt, not expiration of the observer's timer.
      A valid commitment remains historical evidence even after withdrawal,
      employer rejection, job closure, or lost confirmation rendering.
    derivation: "Execution is a subject claim; application commitment is an origin fact."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§4.6, 9.3, 11.1."

  - id: LIFE-SOURCE-CHECKS
    classification: invariant
    rule: >-
      Verify source identity and attempt correlation independently. Preserve trace
      mismatch separately from authentication. An authenticated but uncorrelated
      message remains evidence of receipt, not an accepted claim/fact for an
      arbitrary attempt. Strong alternate correlation may establish the attempt
      despite a trace defect, but must be explicit and evidenced.
    consequence: >-
      Normalization metadata is assigned by the authenticated ingestion/verification
      path, never accepted merely because the sender serialized verified or
      matched. Native receipt IDs and versions are never invented.
    derivation: "A valid signature and a matching trace describe different properties."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§1.3 and 5.3."

  - id: LIFE-RECONCILE
    classification: invariant
    rule: >-
      The reconciler reads pinned execution claims and origin facts and writes
      only report. Compare propositions at their actual scope and knowledge
      boundary. A stopped claim alone does not assert that an already dispatched
      origin transaction cannot commit.
    consequence: >-
      Close-time outcome_unknown is compatible with a later commitment. A claim
      that no commitment occurred anywhere in the attempt is contradicted by a
      valid commitment for that attempt. A claim limited to an earlier boundary
      is not contradicted merely because a receipt arrived later.
    derivation: "The cancellation corpus distinguishes honest uncertainty from a definite false cancellation guarantee."
    x-status: extracted
    x-source: *h

  - id: LIFE-REPORT-COVERAGE
    classification: proposed_mechanism
    rule: >-
      Every claim and application assertion in the pinned execution publication
      is accounted for by a comparison or an explicit scope/uncertainty limitation.
      Any proved contradiction makes report.state contradicted, even if other
      comparisons remain incomplete. With no contradiction, complete comparisons
      yield reconciled; unresolved comparisons yield Missing with reason.
      No applicable subject claims yield not_applicable coverage, not a fabricated
      successful comparison.
    consequence: >-
      not_comparable can be a complete scope determination, such as execution
      completion making no application claim. It is not proof of the claim's
      truth. Consumers must display coverage and limitations with the verdict.
    rationale: "A binary decided verdict must not turn undecidable evidence into a pass."
    flip_condition: >-
      Revise the representation only if corpus cases cannot distinguish a decided
      comparison from incomplete or inapplicable comparison without another
      explicitly versioned field; never weaken the claim/fact separation.
    x-status: proposed
    x-source: *w

  - id: LIFE-LATE-EVIDENCE
    classification: invariant
    rule: >-
      Evidence received after observation closure is appended at the current
      journal head. Publish new owner revisions and a new report over new input
      pins; preserve every prior seal, publication, and diagnostic. A current
      snapshot may legitimately contain newer facts than its latest report used.
    consequence: >-
      Report freshness is determined by comparing its input pins with the
      snapshot's source pins. A stale report is not silently applied to newer
      facts, and publication does not wait for synchronous reconciliation.
    derivation: "Asynchronous publication and immutable close-time knowledge must both remain true."
    x-status: inferred
    x-source: "2-state-bank-crawler-blueprint.json Decision 8; 3-hellscape-blueprint.md §§5.5 and 10.7."

  - id: LIFE-LINEAGE
    classification: invariant
    rule: >-
      kind is immutable. Laboratory fixtures are practice and held_in; employer
      origins are held_out and production requires an employer origin.
      derived_from is same-kind and acyclic. rehearsal_of points from practice
      to an already commissioned production identity; performance_of points
      from production to an already commissioned practice identity.
    consequence: >-
      Empty arrays are valid. Reciprocal mutation of an earlier commission is
      not required: readers can derive incoming links. Links establish lineage,
      not inherited commitment, native capability, or origin representativeness.
      Practice success never triggers production dispatch automatically.
    derivation: "Practice-as-production reproduces the laboratory overfitting failure."
    x-status: inferred
    x-source: *s

  - id: LIFE-MANUAL
    classification: invariant
    rule: >-
      Manual mode requires no automation subject, native run ID, connector
      version, or native binding version. Its dispatch and execution slots stay
      at revision zero with not_applicable. The recorder owns observation and
      journals human actions with manual provenance.
    consequence: >-
      The origin fact recorder can accept a separately verified employer receipt.
      The reconciler does not manufacture a subject claim to compare with it.
      A real application with pending confirmation remains a tracked attempt;
      absence of infrastructure is not a reason to lose its evidence.
    derivation: "Human assistance is not unattended completion, but manual work must serve the portfolio from day one."
    x-status: inferred
    x-source: "1-handoff-brief.txt Parts VII–IX; 3-hellscape-blueprint.md §4.4; 5-browser-qualification.md."

  - id: LIFE-TIME
    classification: invariant
    rule: >-
      All measured durations use Measurement with clock_id, boot_id, origin,
      discriminated estimate, and censoring. Endpoint subtraction requires one
      registered clock/boot/origin and ordered endpoints; exact zero is valid.
      UTC annotations and receipt order cannot establish cross-clock occurrence
      order. Opaque origin revisions are not lexically ordered as timestamps.
    consequence: >-
      A restart interrupts the old observation epoch; do not reconstruct elapsed
      downtime by subtracting new-boot offsets or UTC. Configured DurationLimit
      values are declarations, not measurements or native capability evidence.
    derivation: "The zero-duration defect and restart ambiguity require explicit timing provenance."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; contracts/00-evidence-kernel.yaml."

x-transition-rules:
  dispatch:
    states: [not_started, prepared, dispatching, accepted, rejected, uncertain]
    allowed:
      - {from: unpublished, to: [not_started, prepared, rejected]}
      - {from: not_started, to: [prepared, rejected]}
      - {from: prepared, to: [dispatching, rejected]}
      - {from: dispatching, to: [accepted, rejected, uncertain]}
      - {from: uncertain, to: [uncertain, accepted, rejected]}
      - {from: accepted, to: [accepted]}
      - {from: rejected, to: [rejected]}
    guards:
      - "dispatching requires durable local handle, request identity, and dispatch intent before wire delivery."
      - "accepted requires correlated native acceptance/result evidence, not merely local Start acknowledgement."
      - "rejected after possible delivery requires evidence of native non-acceptance; a lost response is uncertain."
      - "Same-state revisions may add evidence but cannot authorize a new logical execution."
      - "Authorized same-key native resume preserves accepted as the logical dispatch state and journals every additional delivery."
      - "Manual dispatch has no state transition; its slot is explicitly inapplicable."
    x-status: proposed
    x-source: *w

  observation:
    states: [not_opened, open, draining, closed]
    allowed:
      - {from: unpublished, to: [not_opened, open, closed]}
      - {from: not_opened, to: [open, closed]}
      - {from: open, to: [open, draining, closed]}
      - {from: draining, to: [draining, closed]}
      - {from: closed, to: [closed]}
    guards:
      - "A closed-first publication is allowed for translation, launch, or infrastructure failure."
      - "Transport closure can occur while the observation window is open or draining."
      - "closed requires a journaled closure boundary and a close-time knowledge snapshot."
      - "closed-to-closed may append late observations or cleanup evidence but preserves the original closure fields."
      - "Active/drain/cleanup waiting must remain within the commissioned local bounds."
    x-status: proposed
    x-source: *w

  execution:
    rule: >-
      Append authenticated, correlated claims. Do not impose a truth-state
      machine on what a subject is allowed to claim: a contradictory claim is
      evidence to retain, not a reason to replace or suppress the previous claim.
      Existing claim IDs and contents cannot change.
    x-status: inferred
    x-source: *d

  application:
    rule: >-
      Append accepted, correlated origin facts; existing fact IDs and contents
      cannot change. An as-of absence and later commitment can both be valid.
      Apparently conflicting final facts or multiple origin commitments require
      explicit report issues and preserved evidence, never latest-value erasure.
    x-status: proposed
    x-source: *w

  report:
    rule: >-
      Publish new immutable assessments. Input revision pins must not regress
      relative to this report domain's previous publication. Historical replay
      may reproduce old reports as artifacts without replacing the current
      report domain. New facts may make a prior report stale or a prior
      reconciled verdict contradicted; prior bytes remain intact.
    x-status: proposed
    x-source: *w

x-reconciler-algorithm:
  steps:
    - >-
      Verify the commission, source owner publications, source checks, all input
      pins, and their journal support. Retain unresolved source conflicts as
      issues; do not repair an input axis.
    - >-
      Enumerate the subject claims and each explicit application assertion from
      the pinned execution revision. A primitive or lifecycle claim without an
      application assertion receives not_comparable with its narrow scope stated.
    - >-
      Match application facts only to the same attempt, kind, target, candidate,
      and job. Establish temporal relation using a common clock, evidenced
      causality, or a documented origin sequence; otherwise record unknown.
    - >-
      Compare explicit outcome_unknown with known facts as compatible uncertainty,
      not a prediction of no future commitment. Later commitment alone never
      contradicts it. If no relevant fact is available, preserve indeterminacy.
    - >-
      Compare committed with a matching positive fact or an authoritative absence
      covering the claimed interval. An earlier as-of absence cannot disprove
      later commitment, and absence of a receipt cannot prove non-commitment.
    - >-
      Compare not_committed over entire_attempt against any verified commitment
      for that attempt. For at_boundary or after_boundary, require temporal
      evidence covering that boundary; a later receipt timestamp alone is
      insufficient. Verification of a future no-commit guarantee requires
      origin-owned finality, not local observation closure.
    - >-
      Produce comparisons, coverage, issues, and the decided or reasoned-missing
      report state. Publish only the report domain and any separately derived
      diagnostic artifact, preserving all source records.
  x-status: proposed
  x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§4.5–4.6."

x-open-evidence:
  - missing: >-
      The sources do not provide current per-origin production receipt,
      authentication, correlation, or final-absence mappings.
    resolution: >-
      Pin each admitted origin's mapping from documented semantics and retained,
      operator-authorized receipt observations. Until established, retain raw
      observations and leave application knowledge unresolved; do not require
      this reconnaissance for unrelated jobs or manual recording.
    x-status: uncertain
    x-source: "3-hellscape-blueprint.md §§4.6 and 11.1; 6-get-a-job.xml.txt docs/external/README.md."
  - missing: >-
      Raw historical cancellation artifacts and a current-version native
      cancellation/cleanup contract are not supplied.
    resolution: >-
      Preserve historical descriptions as unscored documentary evidence, and
      test lifecycle behavior with synthetic backends. A new subject version
      starts unknown until its own capability evidence is collected.
    x-status: uncertain
    x-source: "3-hellscape-blueprint.md §§1.3, 4.3, 5.3."

oneOf:
  - $ref: "#/$defs/AttemptCommission"
  - $ref: "#/$defs/AxisRevision"
  - $ref: "#/$defs/AttemptSnapshot"

$defs:
  SchemaVersion:
    const: application-attempt-lifecycle/0.1.0
    x-status: proposed
    x-source: *w

  Identifier:
    type: string
    minLength: 1
    x-status: extracted
    x-source: *k

  Revision:
    type: integer
    minimum: 0
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  PositiveInteger:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  Digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    x-status: extracted
    x-source: *k

  Missing:
    type: object
    additionalProperties: false
    required: [value, reason]
    properties:
      value: {type: "null", x-status: extracted, x-source: *k}
      reason:
        enum: [not_enabled, not_applicable, not_observed, observation_lost, unsupported_by_subject, manual_override]
        x-status: extracted
        x-source: *h
      detail: {type: string, minLength: 1, x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  Inapplicable:
    allOf:
      - $ref: "#/$defs/Missing"
      - properties: {reason: {const: not_applicable}}
    x-status: extracted
    x-source: *k

  MaybeString:
    oneOf:
