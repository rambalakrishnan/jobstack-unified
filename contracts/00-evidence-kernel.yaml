oneOf:
  - $ref: "#/$defs/Manifest"
  - $ref: "#/$defs/JournalEnvelope"
  - $ref: "#/$defs/DiagnosticDocument"
  - $ref: "#/$defs/ReplayReceipt"
  - $ref: "#/$defs/LeaseRecord"
  - $ref: "#/$defs/CapabilityDescriptor"

$defs:
  SchemaVersion:
    const: evidence-kernel/0.1.0
    x-status: proposed
    x-source: *w

  Identifier:
    type: string
    minLength: 1
    description: Opaque identifier; no identity, authority, or ordering is inferred from its spelling.
    x-status: inferred
    x-source: *s

  Revision:
    type: integer
    minimum: 0
    maximum: 9007199254740991
    x-status: proposed
    x-source: *w

  PositiveInteger:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    x-status: proposed
    x-source: *w

  NonNegativeNumber:
    type: number
    minimum: 0
    x-status: extracted
    x-source: *h

  Digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    x-status: proposed
    x-source: *w

  NullReason:
    type: string
    enum:
      - not_enabled
      - not_applicable
      - not_observed
      - observation_lost
      - unsupported_by_subject
      - manual_override
    x-status: extracted
    x-source: *h
    x-meanings:
      not_enabled: The facility or analysis was deliberately disabled.
      not_applicable: The field has no meaning in this declared scope.
      not_observed: The value was not established by observation.
      observation_lost: An expected or previously available observation is unavailable through loss.
      unsupported_by_subject: The subject lacks the scoped native facility needed to supply this value.
      manual_override: An authenticated operator explicitly withheld or superseded the value.

  Missing:
    type: object
    additionalProperties: false
    required: [value, reason]
    properties:
      value: {type: "null", x-status: proposed, x-source: *w}
      reason: {$ref: "#/$defs/NullReason", x-status: extracted, x-source: *h}
      detail: {type: string, minLength: 1, x-status: proposed, x-source: *w}
    x-status: proposed
    x-source: *w

  Inapplicable:
    allOf:
      - $ref: "#/$defs/Missing"
      - properties:
          reason: {const: not_applicable, x-status: extracted, x-source: *h}
    x-status: proposed
    x-source: *w

  MaybeString:
    oneOf:
      - $ref: "#/$defs/Identifier"
      - $ref: "#/$defs/Missing"
    x-status: proposed
    x-source: *w

  MaybeDigest:
    oneOf:
      - $ref: "#/$defs/Digest"
      - $ref: "#/$defs/Missing"
    x-status: proposed
    x-source: *w

  MaybeNumber:
    oneOf:
      - type: number
      - $ref: "#/$defs/Missing"
    x-status: proposed
    x-source: *w

  MaybeNonNegative:
    oneOf:
      - $ref: "#/$defs/NonNegativeNumber"
      - $ref: "#/$defs/Missing"
    x-status: proposed
    x-source: *w

  MaybeBoolean:
    oneOf:
      - type: boolean
      - $ref: "#/$defs/Missing"
    x-status: proposed
    x-source: *w

  EvidenceValue:
    anyOf:
      - type: string
      - type: number
      - type: boolean
      - $ref: "#/$defs/Missing"
      - type: array
        items: {$ref: "#/$defs/EvidenceValue"}
      - $ref: "#/$defs/EvidenceMap"
    description: JSON evidence values with reasoned nulls at every nesting depth.
    x-status: proposed
    x-source: *w

  EvidenceMap:
    type: object
    additionalProperties: {$ref: "#/$defs/EvidenceValue"}
    x-status: proposed
    x-source: *w

  Scope:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind:
