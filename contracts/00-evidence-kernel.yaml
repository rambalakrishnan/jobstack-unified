$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:job-application:contracts:evidence-kernel:0.1.0
title: Shared evidence kernel
description: >-
  Review draft for recording discovery, practice, and production work without
  turning declarations, transport acknowledgements, or missing observations into
  success. This schema defines six durable record types. All references to
  schema definitions are local to this file.
x-status: proposed
x-source: "1-handoff-brief.txt, Parts VI and VIII: versioned shared evidence contract."

x-source-index:
  handoff: &h "1-handoff-brief.txt, Parts VI and VIII–X"
  boundary: &b "1-handoff-brief.txt, Parts III–V"
  storage: &s "2-state-bank-crawler-blueprint.json, §11 and Decision 8"
  lease: &l "2-state-bank-crawler-blueprint.json, §11.15"
  diagnostic: &d "3-hellscape-blueprint.md, §§4 and 10"
  fixture: &f "3-hellscape-blueprint.md, §§6.5, 9, 10, and 12"
  qualification: &q "5-browser-qualification.md, Evidence discipline"
  native: &n "4-circus-tent-arch.md, §§5.6–5.8"
  product: &j "6-get-a-job.xml.txt, capability_profile.txt and job_search_queries.txt"
  wire: &w >-
    Proposed wire design implementing 1-handoff-brief.txt Parts VI and VIII;
    identifiers, discriminators, encodings, and local type names are contract
    proposals, not claims about existing implementations.

x-contract:
  name: evidence-kernel
  version: 0.1.0
  maturity: review_draft
  owner: contracts
  consumers: [crawler, Circus Tent, Ringmaster, Hellscape, job-hunter]
  conformance_suite: conformance/00-evidence-kernel.md
  validation_gate: structural_validation_and_semantic_rules
  reference_implementation:
    product: Hellscape
    milestone: M1
    implementation_status: planned_not_certified
    x-status: extracted
    x-source: *h
  purpose: >-
    Permit a real manually executed application to be commissioned, evidenced,
    and tracked before any browser executor or laboratory is available.
    Laboratory results improve execution; they do not replace production work.
  x-status: inferred
  x-source: "Governing task; 1-handoff-brief.txt Parts VII–X; 6-get-a-job.xml.txt capability_profile.txt."

x-ownership:
  x-status: inferred
  x-source: *h
  records:
    manifest: >-
      The run commissioner authors the input; the admitting kernel authenticates
      and freezes it. Later changes require a new manifest, not an in-place edit.
    journal_event: >-
      Exactly one journal authority assigns ordering, ingestion provenance,
      event identities, and hashes. Producers author only their authorized
      content. Journal authority is not authority over every business fact.
    diagnostic: >-
      The diagnostic analyzer writes immutable derived revisions. It may assess
      claims against facts but may not overwrite either.
    replay_receipt: >-
      The replay worker writes an immutable receipt about an offline replay.
      It has no authority to repeat a production action.
    lease_record: >-
      The resource owner's lease authority writes the lease domain and its
      journal atomically. Workers request changes; they do not self-issue leases.
    capability_descriptor: >-
      The authenticated subject connector or native binding declares a scoped
      descriptor. Consumers assess evidence independently. Declaration is not
      self-certification.

x-validation:
  x-status: proposed
  x-source: *w
  requirements:
    - >-
      Decode YAML into JSON-compatible values before validation. Reject duplicate
      mapping keys, non-finite numbers, and values outside declared numeric bounds.
      YAML anchors in this schema are annotation abbreviations, not wire features.
    - >-
      Enforce JSON Schema 2020-12, including date-time format assertions.
      Reject unknown record versions and unknown properties on closed objects.
      Never insert success, zero, false, or an empty object as a missing-value default.
    - >-
      A JSON Schema pass establishes structural validity only. Full conformance
      also requires every applicable EK rule below: authorization, hash checking,
      reference resolution, cross-field arithmetic, and transition fencing.
    - >-
      The only accepted serialized null is Missing.value. Raw native bytes may
      contain literal nulls, but must remain in an artifact until explicitly
      normalized. Omitting a required field is not an alternative to Missing.
    - >-
      Event-specific business data uses EvidenceMap. Its interpretation is owned
      by the registered event kind and version, not by a generic success heuristic.
      Observed numeric metrics and durations belong in Measurement, not hidden
      untyped timing fields in data.

x-canonicalization:
  profile: kernel-jcs-sha256/1
  x-status: proposed
  x-source: *w
  rationale: >-
    One specified byte representation is needed for independent Go, Rust, Python,
    and TypeScript implementations to agree on evidence identities.
  rules:
    encoding: UTF-8
    structured_bytes: RFC8785_JSON_Canonicalization_Scheme
    digest: "sha256:<64 lowercase hexadecimal digits>"
    artifact_digest: SHA-256_of_exact_stored_bytes
    manifest_digest: SHA-256_of_canonical_complete_manifest
    event_digest: SHA-256_of_canonical_event_with_only_event_hash_removed
    diagnostic_digest: SHA-256_of_canonical_complete_diagnostic
    journal_prefix_digest: event_hash_at_last_sequence
    ordering: Preserve_array_order_and_string_contents
    exclusions: >-
      Do not silently redact, normalize Unicode, reorder arrays, or omit null
      envelopes while hashing. A redacted export is a different artifact with
      a journaled derivation, not the original bytes under the original digest.
  flip_condition: >-
    Change the profile only through a versioned contract revision if cross-language
    conformance exposes an ambiguity or an unsupported numeric representation.
    Existing receipts continue to name their original profile.

x-source-reconciliation:
  - decision: >-
      The handoff's capability, opportunity, and result enums are authoritative.
      Hellscape's extra blocked and not_applicable result values are not retained.
      A legacy blocked result becomes opportunity=blocked plus not_exercised or
      indeterminate according to the evidence. Inapplicability is recorded in
      capability/scope and rationale, with result=not_exercised.
    x-status: extracted
    x-source: "1-handoff-brief.txt Part VI overrides 3-hellscape-blueprint.md §4.4."
  - decision: >-
      Hellscape's nullable fields become typed Missing envelopes with exactly the
      handoff's six reasons. manual_fixture_validation is a rationale, not a
      seventh null reason.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§4.2–4.5."
  - decision: >-
      Hellscape's flat timing fields become a discriminated estimate. A native
      zero remains an exact subject-reported zero; it is neither discarded nor
      substituted for an unavailable independently measured interval.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§1.3, 4.5, 10.4."
  - decision: >-
      Stage1's authoritative lease time is retained, but A5's assumed clock skew
      and its default lease duration are not portfolio guarantees. Lease
      comparisons use one authority clock epoch; restart fencing is explicit.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 2-state-bank-crawler-blueprint.json A5 and §11.15."
  - decision: >-
      A native completed response remains an execution claim unless its documented
      semantics establish something narrower or stronger. Firestore tracker
      status and a native response status cannot become a portfolio-wide outcome.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §4.6; 6-get-a-job.xml.txt docs/contracts/firestore-collections.md."
  - decision: >-
      Replay receipts are separate immutable records. Publishing a replay result
      does not mutate the diagnostic it compared or introduce a self-referential
      diagnostic hash.
    x-status: proposed
    x-source: *d
  - decision: >-
      Qualification's evidence discipline is retained. Its standalone product,
      exit-code gate, and particular live-workflow restrictions do not become
      prerequisites for commissioning a job application.
    x-status: inferred
    x-source: "1-handoff-brief.txt Parts I, V, VII–IX; 5-browser-qualification.md."
  - decision: >-
      No governing handoff invariant or provisional is amended by this file.
      Wire-format proposals below make the handoff implementable without
      certifying any current native deployment.
    x-status: proposed
    x-source: *w

x-semantic-rules:
  - id: EK-JOURNAL
    classification: invariant
    rule: >-
      An acknowledged event is durably appended. Sequences are contiguous and
      strictly increasing within a journal, beginning at 1. The first event is
      manifest_admitted and pins the complete immutable manifest. All subsequent
      events name the same run, journal, and manifest digest. Events are never
      edited, deleted, resequenced, or backdated into an earlier prefix.
    consequence: >-
      A diagnostic may cite only events in its named prefix, including locally
      journaled imports. Materialized state, logs, screenshots, and memory not
      registered in that prefix are not independent evidence for that diagnostic.
    derivation: >-
      Retroactively adding evidence would make a previously published diagnostic
      impossible to reproduce.
    x-status: extracted
    x-source: *h

  - id: EK-ATOMICITY
    classification: invariant
    rule: >-
      A locally authoritative operation commits its admitted input, idempotency
      record, authoritative effects, journal events, and replayable response as
      one owner-local durable effect before acknowledgement. Install referenced
      artifact bytes durably before that commit. Cross-owner publication remains
      asynchronous; this rule does not authorize a shared transaction across owners.
    consequence: >-
      A remote employer's action cannot be atomically committed with this journal.
      Persist intent before dispatch and retain uncertain delivery or outcome
      when acknowledgement evidence is missing. Never replay the external write
      merely to repair the local journal.
    derivation: >-
      Separate log and effect commits can claim an effect that did not occur or
      lose evidence of an effect that did.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 2-state-bank-crawler-blueprint.json Decision 8; 3-hellscape-blueprint.md §§10.1, 10.6."

  - id: EK-HASHES
    classification: proposed_mechanism
    rule: >-
      Verify all content digests. At sequence 1, previous_event_hash is
      Missing(not_applicable). At sequence n>1 it equals event_hash at n-1.
      JournalPrefix.head_hash equals the event hash at last_sequence.
      Resolve an EvidenceRef by journal, sequence, event ID, hash, and JSON pointer;
      all must agree. A hash chain detects changed content but is not authentication.
    x-status: proposed
    x-source: *w

  - id: EK-PROVENANCE
    classification: invariant
    rule: >-
      The ingestion authority assigns producer identity, provenance, owner_domain,
      role, assertion_kind, event ID, sequence, receipt time, and hashes using
      authenticated producer registration and the manifest's event registry.
      Untrusted callers submit EventSubmission, never JournalEnvelope.
      Reject submitted server/provenance/authority fields rather than trusting them.
    consequence: >-
      Verify the producer's allowed kind, version, role, and owner domain before
      append. Only application_origin producers may emit authoritative application
      effects. Fixture telemetry, subjects, connectors, importers, and manual
      observers cannot manufacture submission commitment or identity verification.
      The server provenance label alone does not establish an application fact.
    derivation: "An HTTP 200, an accepted telemetry packet, and authentication are different facts."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§3.3, 5.3, 10.3."

  - id: EK-OBSERVATION
    classification: invariant
    rule: >-
      Producer IDs identify one sequence lifetime. Deduplicate identical
      (producer_id, producer_sequence) deliveries without duplicating effects.
      Conflicting content under that key is an integrity incident, not last-write-wins.
      Journal gaps, overflow, loss, flush receipts, and producer closure.
      A closed HTTP connection is not producer completeness or execution termination.
    consequence: >-
      A complete producer assessment requires an evidenced terminal sequence and
      no unresolved gap. Late evidence appends at the current head and produces
      a new diagnostic revision, never a silent repair of the old revision.
    derivation: "Silence cannot distinguish successful termination from lost observation."
    x-status: inferred
    x-source: *d

  - id: EK-NULL
    classification: invariant
    rule: >-
      Every null is Missing(value=null, reason=<one of the six reasons>).
      Empty arrays mean an established empty collection, not unknown contents.
      Unknown semantic states remain explicit enums; false and zero are never
      missing-value sentinels. manual_override requires an authenticated journaled
      operator decision and preserves the superseded observation.
    derivation: "Ambiguous missingness becomes an integration bug."
    x-status: extracted
    x-source: *h

  - id: EK-TIME
    classification: invariant
    rule: >-
      Every Measurement and TimePoint identifies its origin, clock, and boot.
      Register clocks in the manifest or a clock_registered event. Persist
      monotonic offsets relative to that boot. A clock_registered event may
      atomically introduce the clock used for its own receipt timestamp.
      Never subtract across clock IDs or boots. UTC is annotation only.
    consequence: >-
      For endpoint_difference, both endpoints must match the measurement's clock,
      boot, and origin; end must be at least start, and estimate.value must equal
      end minus start. A bounded estimate has at least one numeric bound and
      lower_bound <= upper_bound when both exist. Duration values and bounds
      are nonnegative. Exact zero is valid.
    derivation: "The diagnosed circus-tent _elapsed() zero defect demonstrates the failure."
    x-status: extracted
    x-source: *h

  - id: EK-TIMING-INTERPRETATION
    classification: invariant
    rule: >-
      Exact describes the recorded value at its declared origin, not its truth
      across origins. Preserve subject reports unchanged. Assign an opaque
      report clock when native clock coordinates are unavailable; do not invent
      native endpoints. Compare independently derived durations only for matching
      semantic boundaries or an evidenced bound. A comparability_group name alone
      is insufficient. Never divide aggregate runtime into invented step durations.
    consequence: >-
      Harness deadlines, native timeouts, browser elapsed time, server elapsed
      time, and manual stopwatch references remain separate observations.
      Observation loss yields bounds or unavailable, not an exact truncated duration.
    derivation: "A harness timeout is not a native timeout; unlike intervals cannot establish a timing lie."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §4.5; 5-browser-qualification.md."

  - id: EK-CAPABILITY
    classification: invariant
    rule: >-
      A descriptor applies to exactly one subject_id, subject_version, configured
      mode, and interface surface. Its catalog must enumerate every capability
      for that scope. Every new subject version starts unknown until its own
      evidence establishes another availability. Omission and predecessor
      descriptors do not imply inheritance, presence, or absence.
    consequence: >-
      Scope every cited capability to the assessed version. A non-unknown
      availability requires journaled evidence and limitations. Documentation
      may support a declaration but not a run-success finding. A harness watchdog
      cannot establish native cancellation; fixture namespacing cannot establish
      browser isolation; unsupported connector mapping is not native absence.
    derivation: "Version inheritance converts a prior finding into an untested assumption."
    x-status: extracted
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §4.3."

  - id: EK-ASSESSMENT
    classification: invariant
    rule: >-
      Capability, opportunity, and result are independent fields. satisfied or
      violated requires a valid exposed opportunity, applicable controls, and
      supporting evidence. native_absence requires a required, evidenced absent
      native capability in the exact scope, not mere failure to reach a step.
      Unexposed work is not_exercised; blocked or invalidly controlled work is
      not_exercised or indeterminate according to what was actually observed.
    consequence: >-
      A capability may be absent while its unexercised facet remains not_exercised.
      Invalid isolation write controls cannot establish non-isolation.
      A missing dependency is an infrastructure/prerequisite finding, not a driver
      failure. A skipped required step is not a pass.
    derivation: "A single availability/outcome enum cannot represent these cases without losing evidence."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§1.3, 4; 5-browser-qualification.md."

  - id: EK-CLAIMS
    classification: invariant
    rule: >-
      Preserve claim source, semantic scope, receipt time, and knowledge boundary.
      None, protocol acknowledgement, HTTP success, and execution completion
      do not establish application commitment. Authentication and correlation
      are independent checks. A valid signature with a trace mismatch remains
      authenticated but not reliably correlated to the claimed attempt.
    consequence: >-
      The analyzer compares claims with authoritative postconditions without
      rewriting either. Close-time outcome-unknown is not contradicted by later
      commitment. A definite no-commit/cancel claim may be contradicted by later
      correlated commitment. Forced termination and fixture sealing are not
      native cancellation or rollback.
    derivation: "The cancellation observations require distinct claim, effect, close, and reconciliation facts."
    x-status: extracted
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§4.6, 5.3–5.5."

  - id: EK-ATTEMPT-SCOPE
    classification: invariant
    rule: >-
      An application attempt has immutable kind at commissioning. A laboratory
      fixture is practice and held_in. An employer origin is held_out; production
      requires an employer origin. derived_from references only the same kind.
      rehearsal_of links practice to production; performance_of links production
      to practice. These are lineage links, never evidence promotion.
    consequence: >-
      Production postconditions may not cite practice commitment as proof of
      production commitment. Imported historical qualification material is
      historical_unscored. Real job content used in a fixture does not make
      fixture forms origin-representative.
    derivation: "Tuning against Hellscape cannot qualify an executor for an untested employer form."
    x-status: extracted
    x-source: *b

  - id: EK-MANUAL
    classification: invariant
    rule: >-
      Manual execution has no automation subject, connector version, or binding
      version. It may produce genuine production observations and origin receipts.
      Human actions and notes retain manual provenance and disclosed assistance.
      An operator note alone cannot set an authoritative business predicate.
    consequence: >-
      In manual fixture validation, subject requirement facets are not_exercised,
      with rationale manual_fixture_validation. Do not fabricate a subject
      capability descriptor or credit a browser framework with human completion.
      No automation or laboratory dependency is required to admit the manual run.
    derivation: "Human assistance is not unattended completion; the system must produce applications before its infrastructure is finished."
    x-status: inferred
    x-source: "1-handoff-brief.txt Parts VII–IX; 3-hellscape-blueprint.md §§4.4, 11.1, 12; 5-browser-qualification.md."

  - id: EK-DIAGNOSTIC
    classification: invariant
    rule: >-
      A diagnostic is a deterministic function of its immutable manifest, named
      journal prefix, and pinned classifier bundle. The bundle includes requirement
      and optional fix registries. It uses no current wall time, unrecorded network
      lookups, or mutable application rows as additional evidence.
    consequence: >-
      Its prefix ends at its analysis_requested event, which pins diagnostic ID,
      analysis revision, and analysis versions. All copied observations and
      evidence references must be supported by that prefix. Corrections, late
      evidence, or classifier changes create a new request and immutable revision.
      Readable reports render this same object.
    derivation: "Replay must be re-derivation, not reproduction of an edited report."
    x-status: inferred
    x-source: *d

  - id: EK-REPLAY
    classification: invariant
    rule: >-
      Exact fixture replay consumes recorded external inputs and lifecycle
      observations, recomputes derived outputs, and compares semantic events,
      final state, and the diagnostic. It must not feed recorded derived outputs
      back as authoritative inputs. Diagnostic-only replay may re-derive a
      production diagnostic, but cannot replay an employer mutation.
    consequence: >-
      Replay invokes no browser, subject, or external write. Recorded timing is
      input; replay does not sleep to simulate it. matched requires every
      mode-required comparison to be available and equal. Missing inputs cannot
      yield matched. Live reproduction is a new attempt, not an exact replay.
    derivation: "Identical fixture inputs can reproduce fixture semantics, not unknown live browser behavior."
    x-status: extracted
    x-source: *f

  - id: EK-LEASE
    classification: invariant
    rule: >-
      Claim atomically checks eligible resource state and absence of an unexpired
      lease, assigns a unique fencing lease_id and owner epoch, advances the entity
      revision, clears last_failure_reason, and appends evidence without changing
      resource_state. Completion checks lease ID, unexpired authority-clock
      deadline, entity/input revisions, and applicable owner/session epochs.
      A rejected stale completion has no effect.
    consequence: >-
      Release, expiry, and confirmed-death recovery clear ownership atomically.
      A failed claim generation increments its entity retry_count at most once.
      If retries remain, preserve the pending state; otherwise apply the owner's
      terminal route and dead-letter occurrence with its reason or retry_exhausted.
      A successful completion is not a failed retry.
    derivation: "Lease ownership is orthogonal to queue state; duplicated reclamation must not consume retries twice."
    x-status: extracted
    x-source: *l

  - id: EK-LEASE-RESTART
    classification: proposed_mechanism
    rule: >-
      leased_at and lease_expires_at use one registered lease-authority clock and
      boot; expiry must be later than issue. Renewal requires a still-current
      token and epoch. On authority restart, durably fence the old authority epoch
      before reclaiming its leases. Never compare old offsets with the new boot,
      and never infer elapsed downtime from UTC.
    consequence: >-
      Reclamation revokes local commit authority, not proof that a worker or
      external application stopped. Recovery of a side-effecting attempt must
      retain outcome uncertainty until separately reconciled.
    rationale: "This preserves monotonic timing without relying on Stage1 A5's unverified skew bound."
    flip_condition: >-
      Replace epoch invalidation with a durable external lease clock only after
      that authority's persistence and comparison semantics pass the same fencing
      and restart corpus.
    x-status: proposed
    x-source: "1-handoff-brief.txt Part VI; 2-state-bank-crawler-blueprint.json A5 and §11.15."

  - id: EK-ARTIFACTS
    classification: invariant
    rule: >-
      Citable artifacts are immutable, content-addressed, access-classified, and
      registered by journal events. Retain bytes while a retained manifest,
      journal prefix, diagnostic, replay bundle, or archive depends on them.
      Do not substitute a locator or hash alone for promised archived content.
    consequence: >-
      Credentials and session secrets do not enter ordinary journal payloads.
      Restricted native bodies and personal application receipts use controlled
      artifact storage. If bytes are lost, preserve their known identity and
      append observation_lost; never silently replace them or claim exact replay.
    derivation: "A durable evidence reference to absent or mutable bytes is not durable evidence."
    x-status: inferred
    x-source: "2-state-bank-crawler-blueprint.json §11 and Decision 8; 3-hellscape-blueprint.md §§10.1–10.2; 6-get-a-job.xml.txt AGENTS.md."

