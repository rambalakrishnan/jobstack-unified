x-boundary:
  rule: >-
    Circus Tent and Ringmaster share the external connector and evidence
    discipline, not an internal driver API. No conversion between CFTargetRef
    and a BrowserOxide DOM reference exists. The Python controller owns
    learn-run-heal, selector tiers, extraction policy, and application planning;
    the native binding performs only explicitly requested primitives.
  target_architecture: >-
    A Firefox extension exposes a richer browser-resident observation/action
    surface to Python, bypassing Playwright and Juggler for page operations.
    Its protocol, permissions, and actual API coverage must be established for
    a pinned implementation. This is the proposed native path, not an assertion
    of current capability or a transplanted Chromium ModCDP implementation.
  compatibility_scope: >-
    The documented Python-to-Playwright-to-Juggler-to-Camoufox path remains
    identifiable for maintenance and honest execution evidence. Passing its
    compatibility cases does not certify extension bypass or full-strength
    native-surface access. A compatibility route cannot silently become the
    fallback beneath an extension-native claim.
  x-status: inferred
  x-source: "Governing task, Products; 1-handoff-brief.txt Parts III and V."

x-representation:
  rule: >-
    The schema describes synchronous Python-facing primitive calls and their
    retained transcripts. An extension may transport request/reply messages
    internally, and the existing driver may await its protocol internally.
    Neither exposes a task handle or a shared browser abstraction to its caller.
    Each call returns a native observation or an explicit bounded uncertainty.
  tokens: >-
    CFTabRef, CFDocumentRef, and CFTargetRef identify Firefox browsing contexts,
    document lifetimes, and binding-local target registrations. They are not
    Playwright ElementHandle objects, transferable DOM objects, durable
    selectors, or bearer capabilities. Only the matching native binding can
    resolve a live token.
  validation: >-
    Validate this document independently using JSON Schema 2020-12 and all CF
    rules. All schema references are local. Reject duplicate mapping keys,
    non-finite numbers, unknown versions, unknown fields, and bare normalized
    nulls. Enforce date-time/URI formats and kernel evidence/hash semantics.
  x-status: proposed
  x-source: *w

x-source-reconciliation:
  - decision: >-
      The architecture's async Playwright implementation is historical
      implementation guidance, not permission to define an async task-shaped
      internal binding. The handoff's synchronous primitive boundary wins;
      awaiting a Firefox-specific transport internally does not change it.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 4-circus-tent-arch.md §§3–5."
  - decision: >-
      Browser-resident DOM reduction, semantic attributes, explicit open-root
      traversal, frame accounting, localized capture, and profile-safe recycling
      survive the architectural revision. Their implementation is Firefox-specific.
    x-status: extracted
    x-source: *n
  - decision: >-
      The documented page.evaluate, page.frames, page.set_input_files, and
      DataTransfer-based upload paths are compatibility mapping evidence only.
      They do not establish an extension API, closed-root access, native input
      trust, or performance for a new version.
    x-status: inferred
    x-source: "4-circus-tent-arch.md §§5.4–5.6; governing task, Products."
  - decision: >-
      Network-idle and DOM-quiet heuristics are not universal readiness or
      application-success predicates. The binding exposes an explicit scoped
      wait; task-specific readiness and validation semantics belong above it.
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§6.3 and 9.2 overrides universal interpretation of 4-circus-tent-arch.md §5.4."
  - decision: >-
      Historical tab caps, recycling thresholds, crop padding, reduction budgets,
      and model choices are not portfolio constants. Bindings publish actual
      configured bounds and mappings; the contract specifies their semantics.
    x-status: inferred
    x-source: "1-handoff-brief.txt Parts VI–VIII; 4-circus-tent-arch.md §§5–7."
  - decision: >-
      No handoff amendment is introduced. The extension direction comes from
      the governing task; its unresolved implementation is not filled with an
      invented endpoint, permission grant, or native primitive.
    x-status: proposed
    x-source: *t

x-native-catalog:
  required_capability_ids:
    - cf.extension_page_surface
    - cf.page_script_evaluation
    - cf.frame_observation
    - cf.open_shadow_observation
    - cf.closed_shadow_observation
    - cf.native_input
    - cf.synthetic_drag_drop
    - cf.native_file_input
    - cf.localized_capture
    - cf.profile_persistence
    - cf.fingerprint_persistence
    - cf.browser_context_isolation
    - cf.native_wait_termination
    - cf.profile_safe_shutdown
  rule: >-
    Enumerate every capability exactly once for this subject/version/mode/route.
    Unknown is the initial value for a new version. Route and mapping declarations
    are separate from capability availability and consumer assessment.
  flip_condition: >-
    Revise this proposed Camoufox catalog when implemented Firefox-native APIs
    and their conformance evidence justify a different native cut. Never require
    a corresponding BrowserOxide operation or hide a capability loss behind a
    cross-browser facade.
  x-status: proposed
  x-source: *w

x-rules:
  - id: CF-ROUTE
    classification: invariant
    rule: >-
      Pin the actual page-operation route in the binding descriptor and every
      transcript. For extension_native, all mapped page operations execute
      through the pinned Firefox extension surface, with no Playwright/Juggler
      page-operation hop. Profile launch/exit may use a declared native
      controller lifecycle mapping.
    consequence: >-
      Route changes require a new scoped binding/subject configuration and
      invalidate old tokens. They cannot occur silently inside an already
      commissioned execution. The legacy route remains labeled compatibility,
      not a passed extension-bypass claim.
    derivation: "Otherwise the proposed native surface would conceal the same bridge limitation it exists to remove."
    x-status: inferred
    x-source: *t

  - id: CF-SYNC
    classification: invariant
    rule: >-
      Each primitive is synchronous at the Python binding boundary. Serialize
      context-affecting operations within the relevant tab/profile lifetime.
      Return a value or typed error/uncertainty; do not return a workflow handle
      or perform undisclosed online planning, healing, retries, or alternate
      selector actions.
    consequence: >-
      A local waiting deadline may end the call without proving that a remote
      Firefox operation stopped. Mark that uncertainty, fence dependent actions
      until safe, and leave containment to its separately authorized operation.
      Do not deadlock the event loop responsible for servicing the reply.
    derivation: "The external asynchronous task contract and native primitive contract are different boundaries."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §5.5."

  - id: CF-PROFILE
    classification: invariant
    rule: >-
      A domain-family profile has one owning browser process at a time.
      Its fingerprint manifest is immutable. Launch-option or fingerprint
      changes require an explicit full reset and authentication handoff, not
      reuse of existing session material under a new identity.
    consequence: >-
      Before reuse of a profile directory after shutdown, preserve session state,
      close the old browser, and obtain actual process-exit/reaping evidence.
      A close acknowledgement or elapsed grace period is insufficient.
      Recycling does not rotate fingerprints or copy a live Firefox profile.
    derivation: "Overlapping Firefox writers risk profile corruption; identity drift invalidates persistent authentication."
    x-status: extracted
    x-source: "4-circus-tent-arch.md §§5.2–5.3 and 6."

  - id: CF-STATE
    classification: invariant
    rule: >-
      Profile persistence, tab creation, browser-context isolation, and learning
      state are distinct. A new tab in a persistent profile is not automatically
      a fresh or isolated browser context. A fresh browser does not erase
      selector/coordinate caches or framework learning.
    consequence: >-
      Bind every document and target token to its tab, document epoch, profile
      process generation, and binding route. Navigation or node replacement
      invalidates affected tokens. Reject stale tokens before input; do not
      silently resolve a different element.
    derivation: "The historical invalid isolation control cannot establish isolation or leakage."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§1.3 and 3.4; 4-circus-tent-arch.md §5."

  - id: CF-STRUCTURE
    classification: invariant
    rule: >-
      Reduce DOM inside the browser before transferring large page content.
      Preserve role, aria-label, title, alt, useful text, and meaningful icon
      semantics under the selected reduction profile. Traverse open roots
      explicitly; ordinary cloning/query selection does not expose their contents.
    consequence: >-
      Keep frame/root boundaries and document epochs in the reduced representation.
      Readable nested frames contribute scoped content; unreadable frames and
      roots contribute explicit boundary records/markers. Closed-root access is
      reported only when the exact configured native route establishes it.
      Truncation or redaction is visible, never represented as complete absence.
    derivation: "Flattening without scope and silent omission make later target resolution and diagnosis unsound."
    x-status: inferred
    x-source: "4-circus-tent-arch.md §5.4; 3-hellscape-blueprint.md §§3.3 and 4."

  - id: CF-INPUT
    classification: invariant
    rule: >-
      Preserve the requested native-input versus DOM-property/event mechanism.
      Record actual event semantics where observed. Synthetic DataTransfer
      drag/drop is labeled synthetic; assigning files is not evidence that the
      server accepted an upload. None and protocol acknowledgement are not
      successful form postconditions.
    consequence: >-
      Ambiguous target resolution returns all bounded matches; it never silently
      clicks the first. A side-effecting primitive is not automatically retried
      after uncertain delivery. A submit click cannot write the application axis.
    derivation: "The qualification discipline and claim/origin separation prohibit semantic-success inflation."
    x-status: inferred
    x-source: "5-browser-qualification.md; 3-hellscape-blueprint.md §4.6; 4-circus-tent-arch.md §5.6."

  - id: CF-IMAGE
    classification: invariant
    rule: >-
      Capture records the document epoch, requested crop, actual coordinate-space
      measurements, and image identity. A controller must verify the viewport,
      scale, frame offset, and layout validity before using coordinates.
    consequence: >-
      A perceptual-hash hit alone does not prove that a cached coordinate still
      identifies the intended control. Crop requests must not silently become
      full-page captures or use stale geometry. Missing geometry is explicit
      and cannot be treated as zero offset or unit scale.
    derivation: "Image similarity is not semantic target identity."
    x-status: inferred
    x-source: "4-circus-tent-arch.md §5.6; 5-browser-qualification.md."

  - id: CF-TIME
    classification: invariant
    rule: >-
      Use kernel Measurement for every measured interval or scalar. Register
      independent controller, browser-document, and native-report clocks.
      Never subtract across clocks or boots. A controller's own reported timer
      remains subject_reported; it does not become Hellscape's independent clock.
    consequence: >-
      Native timeout, local waiting deadline, connection loss, and forced
      termination remain separate. Preserve exact zero, bounded/censored
      intervals, and reasoned unavailability. No default zero or invented
      per-step duration is permitted.
    derivation: "The diagnosed _elapsed() behavior and cancellation evidence require explicit timing provenance."
    x-status: extracted
    x-source: *h

  - id: CF-EVIDENCE
    classification: invariant
    rule: >-
      Authorize each primitive against the commissioned task and resource scope.
      Journal durable intent before potentially side-effecting input. Preserve
      native replies and errors as immutable evidence before normalization.
      The ingestion authority, not the controller or extension payload, assigns
      provenance.
    consequence: >-
      Extension telemetry cannot emit origin commitment or verification facts.
      Scripts and artifact references cannot bypass target, account, upload,
      or data-destination permissions. Raw secrets/session material are not
      ordinary journal data. Sensitive DOM, images, and replies use restricted
      artifacts. A transcript never cites its future registration as support.
    derivation: "Browser observations are not application authority, and unjournaled evidence cannot support replay."
    x-status: inferred
    x-source: "contracts/00-evidence-kernel.yaml; 3-hellscape-blueprint.md §§3.3 and 10; 4-circus-tent-arch.md §§5.8 and 5.11."

  - id: CF-CAPS
    classification: invariant
    rule: >-
      New Camoufox, driver, extension, binding, or materially changed configured
      subject versions do not inherit capability presence or absence. Map only
      evidenced native surfaces. A missing extension mapping does not establish
      that Firefox itself lacks the capability.
    consequence: >-
      Run conformance independently for the declared route. Compatibility
      exemptions cannot certify extension bypass or waive ownership, timing,
      provenance, missingness, or truthful input semantics. Preserve Firefox,
      Gecko, NSS, and profile-specific strengths rather than imposing a
      BrowserOxide-shaped primitive vocabulary.
    derivation: "The two products remain independent bets; a shared internal abstraction repeats the failed port."
    x-status: extracted
    x-source: *h

x-open-evidence:
  - missing: Firefox-extension transport, permissions, packaging, signing, and current Camoufox support.
    resolution: >-
      Inspect the pinned Camoufox/Firefox extension environment. Build a small
      extension/controller specimen proving browser-resident DOM reduction,
      target identity, frame/root coverage, input semantics, and page-operation
      bypass of Playwright/Juggler. Measure rather than assume latency.
      Do not select an undocumented transport or claim privileged access.
    x-status: uncertain
    x-source: *t
  - missing: Current native upload, closed-root, capture, wait-interruption, and profile-flush behavior for that extension.
    resolution: >-
