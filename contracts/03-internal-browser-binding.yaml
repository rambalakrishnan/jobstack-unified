$id: urn:job-application:contracts:internal-browser-binding:camoufox:0.1.0
title: Camoufox Firefox-native binding
description: >-
  Review draft of the Camoufox-only synchronous primitive contract for the
  Python Circus Tent implementation. This independent schema is not a variant
  of the BrowserOxide primitive schema. It distinguishes a proposed in-browser
  Firefox extension surface from the documented Playwright-to-Juggler
  compatibility path without claiming the extension has been built.
x-status: proposed
x-source: "1-handoff-brief.txt Parts III, V, VI, and VIII; governing task, Products."

