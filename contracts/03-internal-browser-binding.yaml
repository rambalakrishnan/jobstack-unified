$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:job-application:contracts:internal-browser-binding:browseroxide:0.1.0
title: BrowserOxide native binding
description: >-
  Review draft of the BrowserOxide-only synchronous primitive contract.
  This is the first of two independent schema documents in this file.
  It is not a browser-neutral dispatcher, an external connector, or a selection
  of Ringmaster's packaging. Native Page, DOM, solver, and V8 objects retain
  their native ownership and lifetime rules.
x-status: proposed
x-source: "1-handoff-brief.txt Parts III, V, VI, and VIII; governing task, Products."

x-source-index:
  handoff: &h "1-handoff-brief.txt, Parts III, V, VI, and VIII–X"
  engine: &e "2-state-bank-crawler-blueprint.json, §§3–4, 5.5, 9–10, and Decision 2"
  acquisition: &a "2-state-bank-crawler-blueprint.json, §§3, 7–8, and 13"
  diagnostic: &d "3-hellscape-blueprint.md, §§3–5 and 10"
  qualification: &q "5-browser-qualification.md, Evidence discipline"
  kernel: &k "contracts/00-evidence-kernel.yaml, evidence-kernel/0.1.0"
  external: &x "contracts/02-external-connector.yaml, external-connector/0.1.0"
  task: &t "Governing task, Products: BrowserOxide direct DOM/V8 access and open Ringmaster packaging decision."
  wire: &w >-
    Proposed BrowserOxide-only primitive and evidence representations.
    Operation names and argument/result shapes below are contract proposals,
    not assertions that these exact Rust methods already exist.

x-contract:
  name: internal-browser-binding/browseroxide
  version: 0.1.0
  maturity: review_draft
  owner: contracts
  implementation_owner: BrowserOxide_binding_maintainer
  consumers: [crawler, Ringmaster]
  conformance_suite: conformance/03-internal-browser-binding.md
  suite_instance: BrowserOxide
  schema_entrypoints:
    - "#/$defs/BOBindingDescriptor"
    - "#/$defs/BOPrimitiveRecord"
    - "#/$defs/BODomExport"
  execution_shape: synchronous_native_primitive
  external_connector_version: external-connector/0.1.0
  evidence_kernel_version: evidence-kernel/0.1.0
  x-status: proposed
  x-source: *h

x-boundary:
  rule: >-
    BrowserOxide scraping and application execution may share BrowserOxide-native
    implementation. Neither shares primitives, handles, selector machinery, or
    implementation with the Camoufox binding. Shared definitions copied here
    describe evidence, not a cross-browser runtime interface.
  packaging: >-
    Ringmaster's in-process/FFI, separate-binary/API, or extension/controller
    packaging decision remains open for its PRD. Wherever the native operation
    executes, its Page and isolate stay on their owning OS thread. A process
    boundary may carry owned data, never a live DOM/V8 pointer.
  purpose: >-
    This binding enables discovery and real applications; its construction or
    qualification must not delay manually recorded production applications.
    An HTTP-only crawler slice may publish its actual narrower scope without
    claiming unexercised browser capabilities.
  x-status: inferred
  x-source: "1-handoff-brief.txt Parts V and VII–IX; governing task, Products."

x-representation:
  rule: >-
    PrimitiveRecord is an audit representation of a typed native call and its
    return, not a JSON RPC protocol. Same-thread code may use native borrows
    directly; it is not required to serialize the DOM to call another native
    operation. BOPageRef, BORootRef, and BONodeRef are diagnostic identities
    attached to live native objects. Deserializing one never creates a usable
    native handle or grants permission.
  validation: >-
    Parse this YAML document independently of the Camoufox document. Resolve
    only local schema references. Enforce JSON Schema 2020-12 plus BO rules,
    date-time formats, reference resolution, authorization, and hash checks.
    Reject duplicate mapping keys, non-finite numbers, unknown versions, and
    undeclared fields. Raw null is accepted only inside Missing.value.
  timing: >-
    A binding's own elapsed timer is subject_reported evidence, even if measured
    accurately with a monotonic clock. Browser-origin measurements are separately
    browser_measured. The consumer's independent engine_measured timing is not
    replaced by either. Configuration limits are not measurements.
  x-status: proposed
  x-source: "contracts/00-evidence-kernel.yaml; 2-state-bank-crawler-blueprint.json §5.5."

x-source-reconciliation:
  - decision: >-
      The supplied crawler blueprint already specifies Rust/BrowserOxide
      transport, thread, and session behavior. Those detailed constraints are
      retained; no Camoufox crawler assumption is imported into this binding.
    x-status: extracted
    x-source: *e
  - decision: >-
      Page::from_html, Page::challenge_verdict, reset_for_reuse,
      navigate_with_init(client), HttpClient::shared(profile), and ordinary
      HttpClient::clone are documentary native anchors. Their complete Rust
      signatures and current implementation inventory are not supplied.
      The proposed primitives below require explicit versioned native mappings.
    x-status: inferred
    x-source: *e
  - decision: >-
      HTTP acquisition remains a first-class BrowserOxide facility. Page is not
      treated as an operational superset: incomplete browser rendering may
      coexist with a complete response from the correctly retained live client.
    x-status: extracted
    x-source: "2-state-bank-crawler-blueprint.json §§3.2 and 3.6."
  - decision: >-
      No supplied source establishes current screenshot, file-assignment,
      closed-root, trusted-input, or native-interruption support for a particular
      BrowserOxide build. Naming a primitive reserves a contract, not a present
      capability.
    x-status: uncertain
    x-source: "The current BrowserOxide source/API inventory and executed binding evidence are absent."
  - decision: >-
      No handoff amendment is introduced. Browser-specific catalog and audit
      encodings are proposed mechanisms; no new native capability is assumed.
    x-status: proposed
    x-source: *w

x-native-catalog:
  required_capability_ids:
    - bo.direct_dom
    - bo.direct_v8
    - bo.live_http_client
    - bo.http_pool_sharing
    - bo.offline_from_html
    - bo.frame_dom
    - bo.open_shadow_dom
    - bo.closed_shadow_dom
    - bo.dom_value_mutation
    - bo.composed_event_dispatch
    - bo.file_assignment
    - bo.raster_capture
    - bo.reset_dom_invalidation
    - bo.native_deadline_interruption
  rule: >-
    These IDs form the minimum BrowserOxide catalog. Each appears exactly once
    in the pinned capability catalog and descriptor, including unknown entries.
    Additional capabilities require an explicitly versioned catalog. New
    primitives require a BrowserOxide schema revision, not a matching Camoufox
    operation or a browser-neutral escape hatch.
  flip_condition: >-
    Refine this proposed inventory when the pinned engine API and native
    conformance fixtures establish better primitive boundaries. Preserve direct
    access, native ownership, and truthful unsupported results.
  x-status: proposed
  x-source: *w

x-rules:
  - id: BO-NATIVE
    classification: invariant
    rule: >-
      Mapped operations enter BrowserOxide's native API directly. DOM and V8
      operations must not route through CDP, Playwright, Juggler, another browser,
      or a shared browser adapter. Reading serialized HTML through a bridge is
      not evidence of direct native DOM access.
    derivation: >-
      The Stagehand-on-Juggler failure shows why a lowest-common-denominator
      internal abstraction removes the capabilities the framework needs.
    x-status: extracted
    x-source: *h

  - id: BO-THREAD
    classification: invariant
    rule: >-
      Allocate, enter, reset, and destroy a Page on its owning OS thread.
      Page, isolate-local values, DOM borrows, solver instances, and closures
      capturing them never cross that thread boundary. A call is synchronous:
      it returns a value or a typed failure, not a task handle for later polling.
    consequence: >-
      Queues and durable I/O may yield outside native execution. Cross-thread
      messages contain owned bytes, immutable descriptions, IDs, and only those
      live HTTP-client handles whose Send/sharing semantics are established.
      Reject wrong-thread use before entering the engine.
    derivation: "The supplied Page contract is stricter than merely locking a V8 isolate."
    x-status: extracted
    x-source: *e

  - id: BO-HTTP
    classification: invariant
    rule: >-
      Preserve live-client identity, pool identity, profile, session domain,
      epoch, request order, and cookie-application order. An ordinary client
      clone has an independent pool; it is not a shared-pool handle.
      Stateful and rotating sessions admit at most one request affecting a jar
      until redirects and cookie updates have completed.
    consequence: >-
      With a process-global SharedSession, independent session domains use
      separate engine processes unless namespacing is independently verified.
      A persisted cookie snapshot is recovery evidence, not permission to
      distribute a rotating session or resume it after an owner crash.
    derivation: "Concurrent Set-Cookie application and accidental process-global sharing break session continuity."
    x-status: extracted
    x-source: *e

  - id: BO-OFFLINE
    classification: invariant
    rule: >-
      bo.from_html performs no network acquisition. Its inputs and required
      rendering resources must already be available. If required resources are
      absent, report an unmet precondition; the acquisition controller may then
      choose a separately evidenced cold navigation.
    consequence: >-
      Preserve each transport attempt and verdict. Neither successful bootstrap
      nor challenge clearance alone establishes accepted job content.
      Structured JSON must be validated and normalized before an HTML-only
      render classifier receives it.
    derivation: "The hybrid acquisition contract cannot be reproduced if from_html secretly fetches."
    x-status: extracted
    x-source: *a

  - id: BO-DOM
    classification: invariant
    rule: >-
      Native DOM observations retain frame, document, root, and node identity.
      Navigation, replacement, reset, and destruction invalidate affected
      identities before reuse. Removed/replaced nodes cannot be resurrected by
      reusing an ID. Reject stale references before mutation.
    consequence: >-
      Report inaccessible frames, closed roots, truncation, and observation gaps
      explicitly. Missing access is not an empty complete tree. Direct DOM access
      does not by itself establish closed-root access, rendering fidelity,
      trusted input, isolation, or origin compatibility.
    derivation: "Observation coverage and native access are different properties."
    x-status: inferred
    x-source: "1-handoff-brief.txt Parts III and VI; 3-hellscape-blueprint.md §§2.1 and 4."

  - id: BO-INPUT
    classification: invariant
    rule: >-
      Direct property mutation, synthetic DOM event dispatch, and native browser
      input are different mechanisms. This catalog exposes property mutation
      and event dispatch explicitly; it does not label either as trusted user
      input. Preserve bubbles, cancelable, and composed settings and actual
      event observations.
    consequence: >-
      A returned native call, None/unit return, setter readback, or dispatched
      click event is not application acceptance or commitment. No hidden
      selector healing, planner, retry loop, alternate browser, or direct
      employer API submission may be added by the binding.
    derivation: "Acknowledgement is not semantic success; undisclosed assistance corrupts attribution."
    x-status: inferred
    x-source: "5-browser-qualification.md; 3-hellscape-blueprint.md §§4.6 and 5.4."

  - id: BO-AUTHORITY
    classification: invariant
    rule: >-
      Every call is bound to an admitted task/resource grant. Artifact references,
      scripts, node IDs, and URLs do not grant authority. Crawler acquisition and
      extraction cannot invoke application mutations through DOM writes, V8
      evaluation, redirects, or a query POST with hidden write semantics.
    consequence: >-
      bo.http_exchange is acquisition-only. Application interaction requires
      the separately commissioned executor scope. Script evaluation obeys the
      same target, data, and effect permissions as other primitives.
    derivation: "The crawler's write-action stub and Oregon self-referral counterexample prohibit acquisition-to-apply escalation."
    x-status: extracted
    x-source: *a

  - id: BO-REUSE
    classification: invariant
    rule: >-
      reset_for_reuse clears the native DOM registry and invalidates old DOM
      references while preserving the intended cookie jar. Increment the page
      generation before making a reset Page available again. Reuse is confined
      to compatible process, profile, target, and session-generation scope.
    consequence: >-
      A failed reset quarantines the Page for owner-thread destruction.
      Bootstrap remains cold. No retained Page or solver moves to a replacement
      worker, and no pool reset proves browser-state isolation.
    derivation: "Warmth must not retain stale native objects or cross session ownership."
    x-status: extracted
    x-source: "2-state-bank-crawler-blueprint.json §§9.6 and 10."

  - id: BO-TIME
    classification: invariant
    rule: >-
      Every measurement identifies origin, clock_id, and boot_id and uses exact,
      bounded, or unavailable estimation with censoring. Endpoint subtraction
      requires one registered clock/boot/origin and ordered endpoints. Zero is
      valid. UTC is annotation only.
    consequence: >-
      A local waiting deadline is not a native timeout or proof of interruption.
      If a synchronous engine call cannot be interrupted, the supervisor may
      contain its owner separately; the binding records uncertainty rather than
      inventing native cancellation. Do not compare offsets across restarts.
    derivation: "The _elapsed() defect and the qualification timeout distinction forbid default-zero and timeout-as-cancel semantics."
    x-status: extracted
    x-source: *h

  - id: BO-EVIDENCE
    classification: invariant
    rule: >-
      Journal the evidence needed to reconstruct a call before citing its
      record. Mutating calls require a durable authorized intent before native
      entry. Install immutable artifacts before registration. Record native
      returns and errors without strengthening their semantics.
    consequence: >-
      Primitive records are observations or subject claims, never origin facts.
      The ingestion authority assigns provenance; these records cannot set it.
      Timings copied into the kernel retain their original origin. Secrets stay
      in controlled session storage; sensitive native bytes are restricted
      artifacts. A record cannot cite its own future registration.
    derivation: "Unjournaled native observations cannot become retroactive diagnostic evidence."
    x-status: inferred
    x-source: "contracts/00-evidence-kernel.yaml; 3-hellscape-blueprint.md §§3.3 and 10."

  - id: BO-CAPS
    classification: invariant
    rule: >-
      Capability evidence is scoped to the exact binding build, engine build,
      configuration, mode, and interface surface. A new subject version starts
      unknown. Mapped does not mean exercised; unsupported mapping does not
      establish native absence. Capability, opportunity, and result remain
      separate in the consumer's diagnostic.
    consequence: >-
      The BrowserOxide suite must prove actual direct DOM/V8 access for a
      full-strength binding claim; that test cannot be exempted away. A narrower
      HTTP-only release must identify unexercised browser capabilities.
      Passing a binding fixture does not qualify an employer origin.
    derivation: "No inheritance and held-in/held-out separation prevent untested capability promotion."
    x-status: extracted
    x-source: *h

x-open-evidence:
  - missing: Current BrowserOxide API inventory, build identity, and native action/capture implementations.
    resolution: >-
      Inspect the pinned engine source and compile minimal owner-thread fixtures
      for direct DOM, V8, frames/roots, event semantics, upload, capture, and
      interruption. Record exact native symbols and executed evidence separately.
      Until then, descriptors must not advertise these as demonstrated.
    x-status: uncertain
    x-source: "2-state-bank-crawler-blueprint.json references an engine inventory but does not supply it."
  - missing: Engine-level namespacing of process-global session storage.
    resolution: >-
      Run same-origin controlled write/read and rotating-cookie tests with valid
      controls. Until established, preserve the source's separate-process
      allocation for independent session domains.
    x-status: uncertain
    x-source: "2-state-bank-crawler-blueprint.json Decision 2 and §9."

oneOf:
  - $ref: "#/$defs/BOBindingDescriptor"
  - $ref: "#/$defs/BOPrimitiveRecord"
  - $ref: "#/$defs/BODomExport"

$defs:
  SchemaVersion:
    const: internal-browser-binding.browseroxide/0.1.0
    x-status: proposed
    x-source: *w

  Identifier:
    type: string
    minLength: 1
    x-status: extracted
    x-source: *k

  Revision:
    type: integer
    minimum: 0
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  PositiveInteger:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  Digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    x-status: extracted
    x-source: *k

  Missing:
    type: object
    additionalProperties: false
    required: [value, reason]
    properties:
      value: {type: "null", x-status: extracted, x-source: *k}
      reason:
        enum: [not_enabled, not_applicable, not_observed, observation_lost, unsupported_by_subject, manual_override]
        x-status: extracted
        x-source: *k
      detail: {type: string, minLength: 1, x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  Inapplicable:
    allOf:
      - $ref: "#/$defs/Missing"
      - properties: {reason: {const: not_applicable}}
    x-status: extracted
    x-source: *k

  MaybeString:
    oneOf:
      - $ref: "#/$defs/Identifier"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  EvidenceRef:
    type: object
    additionalProperties: false
    required: [journal_id, sequence, event_id, event_hash, pointer]
    properties:
      journal_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      sequence: {$ref: "#/$defs/PositiveInteger", x-status: extracted, x-source: *k}
      event_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      event_hash: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
      pointer: {type: string, pattern: '^(?:/(?:[^~/]|~[01])*)*$', x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  EvidenceRefs:
    type: array
    uniqueItems: true
    items: {$ref: "#/$defs/EvidenceRef"}
    x-status: extracted
    x-source: *k

  SupportRefs:
    allOf:
      - $ref: "#/$defs/EvidenceRefs"
      - minItems: 1
    x-status: extracted
    x-source: *k

  JournalPrefix:
    type: object
    additionalProperties: false
    required: [journal_id, last_sequence, head_hash]
    properties:
      journal_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      last_sequence: {$ref: "#/$defs/PositiveInteger", x-status: extracted, x-source: *k}
      head_hash: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  ArtifactReference:
    type: object
    additionalProperties: false
    required: [digest, size_bytes, media_type, owner_domain, access]
    properties:
      digest: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
      size_bytes: {$ref: "#/$defs/Revision", x-status: extracted, x-source: *k}
      media_type: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      owner_domain: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      access: {enum: [public, restricted], x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  MaybeArtifact:
    oneOf:
      - $ref: "#/$defs/ArtifactReference"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *x

  VersionPin:
    type: object
    additionalProperties: false
    required: [id, version, artifact_digest]
    properties:
      id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      version: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      artifact_digest: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  TimePoint:
    type: object
    additionalProperties: false
    required: [clock_id, boot_id, origin, monotonic_offset_ms, utc_annotation]
    properties:
      clock_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      boot_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      origin:
        enum: [engine_measured, browser_measured, subject_reported, manual_reference]
        x-status: extracted
        x-source: *k
      monotonic_offset_ms: {type: number, minimum: 0, x-status: extracted, x-source: *k}
      utc_annotation:
        oneOf:
          - {type: string, format: date-time}
          - $ref: "#/$defs/Missing"
        x-status: extracted
        x-source: *k
    x-status: extracted
    x-source: *k

  Estimate:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: {const: exact, x-status: extracted, x-source: *k}
          value: {type: number, x-status: extracted, x-source: *k}
      - type: object
        additionalProperties: false
        required: [kind, lower_bound, upper_bound]
        properties:
          kind: {const: bounded, x-status: extracted, x-source: *k}
          lower_bound:
            oneOf: [{type: number}, {$ref: "#/$defs/Missing"}]
            x-status: extracted
            x-source: *k
          upper_bound:
            oneOf: [{type: number}, {$ref: "#/$defs/Missing"}]
            x-status: extracted
            x-source: *k
        anyOf:
          - properties: {lower_bound: {type: number}}
          - properties: {upper_bound: {type: number}}
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: {const: unavailable, x-status: extracted, x-source: *k}
          value: {$ref: "#/$defs/Missing", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  Measurement:
    type: object
    additionalProperties: false
    required: [measurement_id, name, scope, quantity, unit, origin, clock_id, boot_id, method, start, end, estimate, resolution, censoring, comparability_group]
    properties:
      measurement_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      name: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      scope:
        type: object
        additionalProperties: false
        required: [kind, id]
        properties:
          kind:
            enum: [run, session, connector_call, workflow_step, application_operation, native_primitive, recovery, discovery, capability, resource]
            x-status: extracted
            x-source: *k
          id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
        x-status: extracted
        x-source: *k
      quantity: {enum: [duration, scalar], x-status: extracted, x-source: *k}
      unit: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      origin:
        enum: [engine_measured, browser_measured, subject_reported, manual_reference]
        x-status: extracted
        x-source: *k
      clock_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      boot_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      method:
        enum: [endpoint_difference, source_value, evidence_bound, unavailable]
        x-status: extracted
        x-source: *k
      start:
        oneOf: [{$ref: "#/$defs/TimePoint"}, {$ref: "#/$defs/Missing"}]
        x-status: extracted
        x-source: *k
      end:
        oneOf: [{$ref: "#/$defs/TimePoint"}, {$ref: "#/$defs/Missing"}]
        x-status: extracted
        x-source: *k
      estimate: {$ref: "#/$defs/Estimate", x-status: extracted, x-source: *k}
      resolution:
        oneOf: [{type: number, minimum: 0}, {$ref: "#/$defs/Missing"}]
        x-status: extracted
        x-source: *k
      censoring: {enum: [none, left, right, both, unavailable], x-status: extracted, x-source: *k}
      comparability_group: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *k}
    allOf:
      - if: {properties: {quantity: {const: duration}}}
        then:
          properties:
            unit: {const: ms}
            estimate:
              properties:
                value: {minimum: 0}
                lower_bound: {minimum: 0}
                upper_bound: {minimum: 0}
      - if: {properties: {estimate: {properties: {kind: {const: exact}}}}}
        then:
          properties:
            method: {enum: [endpoint_difference, source_value]}
            censoring: {const: none}
      - if: {properties: {estimate: {properties: {kind: {const: bounded}}}}}
        then:
          properties:
            method: {const: evidence_bound}
            censoring: {enum: [none, left, right, both]}
      - if: {properties: {estimate: {properties: {kind: {const: unavailable}}}}}
        then:
          properties:
            method: {const: unavailable}
            censoring: {const: unavailable}
      - if: {properties: {method: {const: endpoint_difference}}}
        then:
          properties:
            quantity: {const: duration}
            start: {$ref: "#/$defs/TimePoint"}
            end: {$ref: "#/$defs/TimePoint"}
            estimate: {properties: {kind: {const: exact}}}
    description: >-
      Enforce same-clock/boot/origin endpoint arithmetic, ordered bounds, and
      clock registration semantically. No native value is silently corrected.
    x-status: extracted
    x-source: *k

  DurationLimit:
    type: object
    additionalProperties: false
    required: [kind, unit, value]
    properties:
      kind: {const: exact, x-status: extracted, x-source: *x}
      unit: {const: ms, x-status: extracted, x-source: *x}
      value: {type: number, minimum: 0, x-status: extracted, x-source: *x}
    x-status: extracted
    x-source: *x

  ComponentIdentity:
    type: object
    additionalProperties: false
    required: [component, reported_version, build_digest, configuration_digest]
    properties:
      component: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      reported_version: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *k}
      build_digest:
        oneOf: [{$ref: "#/$defs/Digest"}, {$ref: "#/$defs/Missing"}]
        x-status: extracted
        x-source: *k
      configuration_digest:
        oneOf: [{$ref: "#/$defs/Digest"}, {$ref: "#/$defs/Missing"}]
        x-status: extracted
        x-source: *k
    x-status: extracted
    x-source: *k

  SubjectIdentity:
