      basis: {$ref: "#/$defs/ArtifactReference", x-status: proposed, x-source: *w}
    description: Render classification only, never content relevance, authentication, or application completion.
    x-status: proposed
    x-source: *w

  BOResetReturn:
    type: object
    additionalProperties: false
    required: [page, invalidated_generation, cookie_continuity_refs]
    properties:
      page: {$ref: "#/$defs/BOPageRef", x-status: proposed, x-source: *w}
      invalidated_generation: {$ref: "#/$defs/Revision", x-status: proposed, x-source: *w}
      cookie_continuity_refs: {$ref: "#/$defs/SupportRefs", x-status: inferred, x-source: *e}
    description: Same native owner/page identity, newer generation, invalid old DOM references, preserved intended jar.
    x-status: proposed
    x-source: *w

  BODestroyReturn:
    type: object
    additionalProperties: false
    required: [page, destruction_refs]
    properties:
      page: {$ref: "#/$defs/BOPageRef", x-status: proposed, x-source: *w}
      destruction_refs: {$ref: "#/$defs/SupportRefs", x-status: proposed, x-source: *w}
    description: Owner-thread destruction evidence; not proof that remote origin work stopped or rolled back.
    x-status: proposed
    x-source: *w

  BOFailure:
    type: object
    additionalProperties: false
    required: [code, native_entry, native_error, detail]
    properties:
      code:
        enum: [WRONG_THREAD, STALE_REFERENCE, INVALID_INPUT, UNAUTHORIZED, UNMAPPED_PRIMITIVE, NATIVE_ERROR, NATIVE_TIMEOUT, LOCAL_DEADLINE, OWNER_LOST, INPUTS_INCOMPLETE, RESOURCE_BUSY, RESPONSE_LIMIT]
        x-status: proposed
        x-source: *w
      native_entry: {enum: [not_entered, entered, unknown], x-status: proposed, x-source: *w}
      native_error: {$ref: "#/$defs/MaybeArtifact", x-status: proposed, x-source: *w}
      detail: {type: string, minLength: 1, x-status: proposed, x-source: *w}
    description: >-
      NATIVE_TIMEOUT requires actual native timeout evidence. LOCAL_DEADLINE
      and OWNER_LOST do not establish native termination or absence of effects.
      Sanitize detail; retain sensitive raw errors as restricted artifacts.
    x-status: proposed
    x-source: *w

  BOPrimitiveRecord:
    type: object
    additionalProperties: false
    required: [record_type, schema_version, binding_digest, call_id, owner, primitive, authorization_ref, limit, arguments, return_state, value, error, elapsed, evidence_refs, effect_refs]
    properties:
      record_type: {const: browseroxide_primitive_record, x-status: proposed, x-source: *w}
      schema_version: {$ref: "#/$defs/SchemaVersion", x-status: proposed, x-source: *w}
      binding_digest: {$ref: "#/$defs/Digest", x-status: proposed, x-source: *w}
      call_id: {$ref: "#/$defs/Identifier", x-status: proposed, x-source: *w}
      owner: {$ref: "#/$defs/BOOwner", x-status: proposed, x-source: *w}
      primitive: {$ref: "#/$defs/BOPrimitive", x-status: proposed, x-source: *w}
      authorization_ref: {$ref: "#/$defs/EvidenceRef", x-status: proposed, x-source: *w}
      limit: {$ref: "#/$defs/DurationLimit", x-status: proposed, x-source: *w}
      arguments: {type: object, x-status: proposed, x-source: *w}
      return_state:
        enum: [returned, failed, unsupported, uncertain]
        description: Native-call reporting only; not a capability assessment or application status.
        x-status: proposed
        x-source: *w
      value: {x-status: proposed, x-source: *w}
      error:
        oneOf: [{$ref: "#/$defs/BOFailure"}, {$ref: "#/$defs/Inapplicable"}]
        x-status: proposed
        x-source: *w
      elapsed:
        allOf:
          - $ref: "#/$defs/Measurement"
          - properties:
              quantity: {const: duration}
              origin: {const: subject_reported}
              scope: {properties: {kind: {const: native_primitive}}}
        x-status: inferred
        x-source: *k
      evidence_refs: {$ref: "#/$defs/SupportRefs", x-status: extracted, x-source: *k}
      effect_refs: {$ref: "#/$defs/EvidenceRefs", x-status: inferred, x-source: *q}
    allOf:
      - if: {properties: {return_state: {const: returned}}}
        then: {properties: {error: {$ref: "#/$defs/Inapplicable"}}}
        else:
          properties:
            value: {$ref: "#/$defs/Missing"}
            error: {$ref: "#/$defs/BOFailure"}
      - if: {properties: {primitive: {const: bo.client_create}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOClientCreate"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOClientRef"}}}
      - if: {properties: {primitive: {const: bo.http_exchange}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOHttpExchange"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOHttpReturn"}}}
      - if: {properties: {primitive: {const: bo.page_create}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOPageCreate"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOPageRef"}}}
      - if: {properties: {primitive: {const: bo.navigate}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BONavigate"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BONavigationReturn"}}}
      - if: {properties: {primitive: {const: bo.from_html}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOFromHtml"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BONavigationReturn"}}}
      - if: {properties: {primitive: {const: bo.dom_read}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BODomRead"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BODomExport"}}}
      - if: {properties: {primitive: {const: bo.dom_write}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BODomWrite"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOMutationReturn"}}}
      - if: {properties: {primitive: {const: bo.event_dispatch}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOEventDispatch"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOMutationReturn"}}}
      - if: {properties: {primitive: {const: bo.v8_evaluate}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOV8Evaluate"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOV8Return"}}}
      - if: {properties: {primitive: {const: bo.assign_files}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOAssignFiles"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOMutationReturn"}}}
      - if: {properties: {primitive: {const: bo.capture}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOCapture"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOCaptureReturn"}}}
      - if: {properties: {primitive: {const: bo.render_verdict}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOPageArgument"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOVerdictReturn"}}}
      - if: {properties: {primitive: {const: bo.reset_for_reuse}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOPageArgument"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BOResetReturn"}}}
      - if: {properties: {primitive: {const: bo.page_destroy}}}
        then:
          properties: {arguments: {$ref: "#/$defs/BOPageArgument"}}
          allOf:
            - if: {properties: {return_state: {const: returned}}}
              then: {properties: {value: {$ref: "#/$defs/BODestroyReturn"}}}
    description: >-
      Resolve binding_digest to BOBindingDescriptor. Validate every native
      reference against that binding and owner lifetime; HTTP references obey
      their separately established sharing contract. elapsed.scope.id equals
      call_id. Returned identities match the arguments except documented
      generation changes. Unsupported/uncertain records do not invent outputs.
      Do not infer effect absence from an empty effect_refs array.

