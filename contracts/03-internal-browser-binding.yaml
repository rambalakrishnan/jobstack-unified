            - if: {properties: {reply: {properties: {kind: {const: returned}}}}}
              then: {properties: {reply: {properties: {data: {$ref: "#/$defs/CFInputReply"}}}}}
      - if: {properties: {operation: {const: fx.evaluate}}}
