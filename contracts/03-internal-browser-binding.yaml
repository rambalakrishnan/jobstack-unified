      - if: {properties: {operation: {const: fx.tab_close}}}
        then:
          properties: {request: {$ref: "#/$defs/CFTabArgument"}}
          allOf:
            - if: {properties: {reply: {properties: {kind: {const: returned}}}}}
              then: {properties: {reply: {properties: {data: {$ref: "#/$defs/CFTabClosed"}}}}}
      - if: {properties: {operation: {const: fx.profile_flush_exit}}}
        then:
          properties: {request: {$ref: "#/$defs/CFProfileArgument"}}
          allOf:
            - if: {properties: {reply: {properties: {kind: {const: returned}}}}}
              then: {properties: {reply: {properties: {data: {$ref: "#/$defs/CFProfileExited"}}}}}
    description: >-
      Resolve binding_digest to CFBindingDescriptor and verify route, operation
      mapping, permissions, token lifetimes, and native evidence. The controller
      interval uses native_primitive scope with id=call_id. Browser measurements
      retain separate clocks and origins. Reply identities match the requested
      profile/tab/document except explicit navigation or lifecycle changes.
      A route label alone is not proof of bypass, and an empty effect_refs array
      does not establish no effect. The transcript is registered after its
      supporting evidence and is never an application-axis write.
