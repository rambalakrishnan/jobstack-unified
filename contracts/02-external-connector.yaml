    properties:
      clock_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      boot_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      origin: {$ref: "#/$defs/MeasurementOrigin", x-status: extracted, x-source: *k}
