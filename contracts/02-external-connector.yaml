$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:job-application:contracts:external-connector:0.1.0
title: External connector
description: >-
  Review draft of the shared asynchronous, task-shaped interface used to
  commission browser execution and discovery work, observe its evidence, and
  control local exposure without confusing observation closure with native
  cancellation. Circus Tent and Ringmaster implement this interface independently.
  All schema references are local to this file.
x-status: proposed
x-source: "1-handoff-brief.txt, Parts III, V, VI, and VIII."

x-source-index:
  handoff: &h "1-handoff-brief.txt, Parts VI and VIII–IX"
  boundary: &b "1-handoff-brief.txt, Parts III–V"
  crawler: &c "2-state-bank-crawler-blueprint.json, §§1, 5, 11, and 13"
  connector: &d "3-hellscape-blueprint.md, §§4–5 and 10.6–10.8"
  native: &n "4-circus-tent-arch.md, §§5.6–5.9"
  qualification: &q "5-browser-qualification.md, Evidence discipline"
  product: &j "6-get-a-job.xml.txt, AGENTS.md and docs/contracts/firestore-collections.md"
  kernel: &k "contracts/00-evidence-kernel.yaml, evidence-kernel/0.1.0"
  lifecycle: &l "contracts/01-application-attempt-lifecycle.yaml, application-attempt-lifecycle/0.1.0"
  wire: &w >-
    Proposed wire design implementing the governing external-connector contract.
    Message discriminators, identifiers, pagination, limits, and transport
    mechanics are proposals, not claims about deployed native interfaces.

x-contract:
  name: external-connector
  version: 0.1.0
  maturity: review_draft
  owner: contracts
  consumers: [crawler, Circus Tent, Ringmaster, Hellscape, job-hunter]
  conformance_suite: conformance/02-external-connector.md
  reference_corpus: Hellscape_M1_synthetic_backends
  implementation_status: specified_not_certified
  purpose: >-
    Let job-hunter commission real applications through either executor and
    collect evidence from every attempt. Let discovery use the same task/control
    mechanics without inventing application attempts. Manual applications use
    the evidence kernel and lifecycle directly; an automation connector is not
    a prerequisite for recording them.
  x-status: inferred
  x-source: "1-handoff-brief.txt Parts VI–IX; 3-hellscape-blueprint.md §§5 and 10.6."

x-compatibility:
  kernel_version: evidence-kernel/0.1.0
  lifecycle_version: application-attempt-lifecycle/0.1.0
  rules:
    - >-
      Common evidence, timing, capability, assistance, source-check, claim, and
      control-observation definitions preserve their established wire meanings.
      A connector response is not itself a kernel journal envelope.
    - >-
      Lifecycle publications are carried by typed immutable references, not
      whole-attempt updates. Their complete bytes retain the lifecycle schema
      version. This connector does not redefine their five-owner composition.
    - >-
      binding_version in an application execution descriptor identifies the
      external native-interface mapping version, corresponding here to
      ConfigurationPin.binding.version. A browser's internal binding identity
      belongs in the subject's stack; it is not a shared primitive protocol.
    - >-
      Validate JSON Schema and every applicable EXT rule. Unknown versions,
      duplicate mapping keys, non-finite numbers, unknown closed-object fields,
      and bare normalized nulls are rejected. Enforce date-time and URI formats.
  x-status: proposed
  x-source: "contracts/00-evidence-kernel.yaml; contracts/01-application-attempt-lifecycle.yaml; 3-hellscape-blueprint.md §§4.2 and 5.3."

x-ownership:
  consumer:
    owns: [task_intent, task_permissions, selected_subject, declared_assistance, admission_decision]
    restriction: >-
      Selection and permission do not establish capability satisfaction or
      application commitment. Authentication comes from the channel, not a
      caller-supplied principal/provenance field.
  connector:
    owns: [preparation, local_handle, dispatch_observations, observation_window, translation, local_control_evidence]
    restriction: >-
      Publishes dispatch and observation only under the commission's grants.
      It may faithfully publish subject claims as the designated execution
      writer, but does not become their semantic author.
  subject:
    owns: [native_execution_claims, native_capability_declarations]
    restriction: "Declarations and claims are not independent assessments."
  origin:
    owns: [application_facts]
    restriction: >-
      Browser-visible receipts collected by a connector remain observations until
      the separately authorized origin-fact recorder verifies their source,
      meaning, and correlation.
  consumer_assessor:
    owns: [requirement_assessment, reconciliation, diagnostic]
    restriction: >-
      Hellscape assesses practice execution; job-hunter's authorized reconciler
      assesses production evidence. Neither edits source claims or origin facts.
  x-status: inferred
  x-source: "1-handoff-brief.txt Part VI; contracts/01-application-attempt-lifecycle.yaml."

x-operations:
  Describe:
    request: "#/$defs/DescribeRequest"
    result: "#/$defs/ConnectorDescriptor"
    semantics: >-
      Return the configured subject/version, complete capability declaration,
      native mappings, and configured limits. Do not run a task, probe speculative
      endpoints, start a browser, or certify the subject.
    x-status: extracted
    x-source: *d
  Prepare:
    request: "#/$defs/PrepareRequest"
    result: "#/$defs/PrepareResult"
    semantics: >-
      Validate the admitted scope and task, disclose assistance and mapping
      limitations, serialize the intended native request, and persist immutable
      preparation. No target browsing, task execution, hidden planning, context
      reset, or recovery occurs.
    x-status: inferred
    x-source: *d
  Start:
    request: "#/$defs/StartRequest"
    result: "#/$defs/StartResult"
    semantics: >-
      Durably allocate or recover a local handle and enqueue one logical
      execution. Return without waiting for native completion. A separately
      authorized same-key resume is not a second logical execution.
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§5.2–5.3 and 10.6; 4-circus-tent-arch.md §5.6."
  Observe:
    request: "#/$defs/ObserveRequest"
    result: "#/$defs/ObservationPage"
    semantics: >-
      Read accumulated, journal-backed observations through an explicit prefix.
      Bounded waiting and pagination do not imply a native polling endpoint.
      Observation remains available for late evidence after local closure.
    x-status: inferred
    x-source: *d
  RequestNativeCancel:
    request: "#/$defs/NativeCancelRequest"
    result: "#/$defs/ControlReceipt"
    semantics: >-
      Invoke only a mapped native cancellation operation, or report unsupported
      mapping/unknown delivery honestly. Preserve request, acknowledgement,
      subject stop claim, independently observed effect, and timing separately.
    x-status: inferred
    x-source: *d
  CloseObservationConnection:
    request: "#/$defs/CloseConnectionRequest"
    result: "#/$defs/ControlReceipt"
    semantics: >-
      Close the connector-owned native observation transport. The explicit
      end_observation flag additionally requests bounded local finalization,
      never native cancellation. Neither action establishes no-commit.
    x-status: proposed
    x-source: *w
  CollectArtifacts:
    request: "#/$defs/CollectArtifactsRequest"
    result:
      - "#/$defs/ArtifactInventory"
      - "#/$defs/ArtifactChunk"
    semantics: >-
      Enumerate or transfer retained artifacts, optionally retrieving already
      produced artifacts through an evidenced native retrieval contract.
      Return explicit missingness. Never rerun a task to manufacture an artifact.
    x-status: inferred
    x-source: *d
  ReleaseNativeContext:
    request: "#/$defs/ReleaseContextRequest"
    result: "#/$defs/ControlReceipt"
    semantics: >-
      Use a mapped native release operation for the specified context, or report
      unsupported. Do not silently log out, purge a profile, terminate unrelated
      work, or substitute process containment.
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §5; 4-circus-tent-arch.md §5.3."
  Contain:
    request: "#/$defs/ContainRequest"
    result: "#/$defs/ControlReceipt"
    semantics: >-
      Execute an independently authorized, versioned harness policy against a
      bounded resource scope. No arbitrary shell command is accepted. Record
      known affected attempts and unresolved impact.
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§5.5 and 13."

x-reference-carrier:
  classification: provisional
  profile: connector-http-json/0.1.0
  method: POST
  path: /connector
  base_address: deployment_configured_no_default_host_or_port
  media_type: application/json
  encoding: UTF-8
  behavior:
    - >-
      Each call carries one ConnectorRequest and returns one ConnectorResponse.
      Start is asynchronous with respect to task execution; Observe uses bounded
      pull pages. No WebSocket, SSE, or native GET-runs endpoint is required.
    - >-
      A normal result uses HTTP 200. Typed connector errors use an appropriate
      4xx/5xx transport status; clients inspect the typed body, not status alone.
      A valid observed native failure remains a normal Observe result.
    - >-
      Undecodable or unauthenticated traffic may be rejected before a correlated
      ConnectorResponse can be constructed. Such a transport rejection conveys
      no task outcome and must not reveal another principal's handles.
    - >-
      Authenticate and authorize the channel independently of request IDs.
      Use an authenticated local channel or TLS-protected deployment channel;
      credentials are configured outside these JSON records.
  reason: >-
    A single small JSON carrier permits independently implemented Python, Rust,
    Go, and language-undecided consumers without coupling to a native REST API.
    Pull observations avoid requiring native callbacks or streaming support.
  flip_condition: >-
    Add a separately versioned carrier if measured deployment requirements need
    streaming, another authenticated IPC mechanism, or different transfer
    efficiency. Preserve the nine verbs, messages, ownership, and evidence rules.
  x-status: proposed
  x-source: *w

x-hashing:
  profile: kernel-jcs-sha256/1
  rules:
    artifact: SHA-256_of_exact_stored_bytes
    structured_record: SHA-256_of_RFC8785_canonical_complete_record
    native_request_hash: SHA-256_of_exact_retained_native_request_bytes
    delivered_task_hash: SHA-256_of_exact_retained_subject_facing_task_bytes
    task_semantic_hash: >-
      SHA-256 of the canonical TaskEnvelope after removing task_id and replacing
      entry.url with entry.logical_id and each permitted_origins entry's origin
      with that entry's logical_id. All other values and array order remain.
    semantic_profile: external-connector-task/1
  constraints:
    - >-
      Logical entry/origin IDs are immutable, unique within their scope, and
      bound to actual destinations by the admitted manifest. A semantic hash is
      a comparison key, not permission to change a destination.
    - >-
      The full task digest, actual destinations, complete preparation, subject
      identity, permissions, and native request digest are pinned separately.
      An equal semantic hash cannot bypass changed-input or commissioning checks.
    - >-
      Runtime credentials and signing values are not task semantics. Store secret
      material through scoped runtime access bindings, not ordinary task fields
      or logs. Retained native bytes with sensitive content are restricted.
    - >-
      Install preparation/handle bytes before their registration event. A record
      does not contain its own digest or a reference to its future registration.
  x-status: proposed
  x-source: "contracts/00-evidence-kernel.yaml x-canonicalization; 3-hellscape-blueprint.md §§5.4, 6.5, and 10."

x-minimum-capability-ids:
  values:
    - native_goal_task
    - native_plan_execution
    - native_cancel
    - native_context_release
    - native_artifact_retrieval
    - native_revision
    - native_dom_access
    - browser_state_isolation
    - browser_state_persistence
    - learning_state_control
  rule: >-
    The descriptor's pinned catalog includes these IDs and may include additional
    versioned capabilities. Each catalog capability appears exactly once,
    including unknown or evidenced not_applicable entries. These are capability
    declarations, not shared browser primitives or compulsory success gates.
  x-status: proposed
  x-source: "1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §§2.1, 4.3, and 5.1."

x-invariants:
  - id: EXT-SURFACE
    classification: invariant
    rule: >-
      Recognize exactly the nine versioned verbs. The shared request surface is
      task-shaped and browser-agnostic. No shared Page, ElementHandle, selector
      engine, DOM node handle, or synchronous browser primitive is defined here.
      Native input formats are mapping artifacts, not a cross-browser API.
    derivation: "Unifying browser primitives repeats the Stagehand-on-Juggler failure."
    x-status: extracted
    x-source: *b

  - id: EXT-AUTHORITY
    classification: invariant
    rule: >-
      Derive caller identity and grants from authenticated channel registration.
      Authorize verb, connector, subject, task scope, account/runtime access,
      artifacts, and control target. IDs and digests are not bearer authority.
      Application credentials do not grant connector control access.
    consequence: >-
      Requests cannot assign server provenance or write origin/report domains.
      Observation provenance is copied from authenticated kernel ingestion.
      Hash-valid content from an unauthorized source remains unauthorized.
    derivation: "HTTP 200, a matching trace, and authentication are different facts."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §3.3; 4-circus-tent-arch.md §5.8; 5-browser-qualification.md."

  - id: EXT-DESCRIBE
    classification: invariant
    rule: >-
      Pin a descriptor to one subject/version/configured mode/interface surface.
      A new subject version starts unknown on every capability until its own
      evidence establishes another availability. Neither presence nor absence
      inherits. Documentation can support a declaration, not a run-success result.
    consequence: >-
      Complete operation-handler coverage does not mean complete native mapping.
      An unmapped operation is not automatically native absence. A watchdog,
      fixture namespace, or forced termination cannot establish a native capability.
    derivation: "The invalid isolation control and version-inheritance trap prohibit assumed findings."
    x-status: extracted
    x-source: *h

  - id: EXT-DECLARE-NOT-ASSESS
    classification: invariant
    rule: >-
      The connector declares capabilities, mappings, observations, and source
      claims. It does not emit qualification, requirement satisfaction, or an
      authoritative application-success flag. Consumer assessment remains
      separate from capability availability and opportunity.
    derivation: "The judged component must not certify its own behavior."
    x-status: extracted
    x-source: *h

  - id: EXT-TASK
    classification: invariant
    rule: >-
      Match the full task, scope, permissions, observation policy, assistance,
      and selected subject to the admitted manifest. Application work additionally
      matches its immutable commission, including kind and lineage. Manual
      commissions are not dispatchable through this contract.
    consequence: >-
      Laboratory forms remain practice/held_in even with real job content.
      Discovery and extraction have no fabricated application attempt.
      Rehearsal completion never authorizes production dispatch.
    derivation: "Practice facts cannot become production evidence through a connector."
    x-status: inferred
    x-source: "1-handoff-brief.txt Parts III and VI; contracts/01-application-attempt-lifecycle.yaml."

  - id: EXT-READ-ONLY
    classification: invariant
    rule: >-
      discover_jobs and extract tasks cannot execute employer/application
      mutations. HTTP method alone does not determine whether an operation is
      read-only. The crawler cannot gain application authority through an
      extraction extension, plan artifact, redirect, or permissive task text.
    consequence: >-
      Persisting discovery evidence is permitted. An apply/self-referral/contact
      reveal mutation requires a separately commissioned application task and
      an authorized executor, not a crawler's write-action stub.
    derivation: "Stage1's Oregon self-referral example demonstrates the acquisition/mutation boundary."
    x-status: extracted
    x-source: *c

  - id: EXT-PREPARE
    classification: invariant
    rule: >-
      Prepare is non-executing. Validate already supplied task data, plan,
      dependencies, mappings, grants, and declared limits without visiting the
      target, testing authentication, resetting context, invoking a planner,
      or secretly improving the plan. Record the native serialization and
      subject-facing task independently.
    consequence: >-
      External planning occurs before Prepare with public-observation evidence
      and disclosed cost. A native goal planner starts only as part of Start.
      Translation preserves intent, action order, values, targets, and retry
      policy; it adds no hidden sleeps, selector alternatives, or recovery.
      Incomplete translation produces UNSUPPORTED_MAPPING.
    derivation: "Undisclosed assistance makes executor comparisons and attribution meaningless."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§5.2–5.4."

  - id: EXT-PREPARATION-PIN
    classification: invariant
    rule: >-
      A preparation is immutable and names the exact descriptor, subject,
      mapping, full task, delivered task, intended native request, runtime-access
      references, and limitations. Start accepts that preparation digest,
      including all concerns requiring acceptance, under actual task authority.
    consequence: >-
      Reject a stale subject/configuration/mapping or changed artifact rather
      than silently repreparing. A blocking concern never produces a startable
      preparation. Missing native cancellation alone is not a universal
      preparation blocker.
    derivation: "A request audited at preparation must be the request actually dispatched."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§5 and 10.6; contracts/01-application-attempt-lifecycle.yaml."

  - id: EXT-START
    classification: invariant
    rule: >-
      Before wire delivery, durably commit the local handle, immutable request
      binding, idempotency association, and dispatch intent under owner-local
      fencing. Start returns a local receipt without awaiting task completion.
      A native run ID is attached only in later source-backed observations.
    consequence: >-
      Local admission, queueing, native acceptance, native execution claims, and
      origin commitment remain distinct. A crash around delivery yields uncertain
      unless stronger evidence establishes acceptance or non-acceptance.
    derivation: "Remote work cannot be atomically committed with a local acknowledgement."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§5.3 and 10.6; contracts/01-application-attempt-lifecycle.yaml."

  - id: EXT-IDEMPOTENCY
    classification: invariant
    rule: >-
      For mutating/collecting calls, (authenticated principal, connector_id,
      request_id) identifies one command. Same command and identical request
      returns its retained receipt without another effect; conflicting content
      under that key is rejected. Describe and Observe are read calls whose
      responses may reflect newer evidence.
    consequence: >-
      Independently index logical execution by (principal, connector_id,
      Start.idempotency_key), bound to the immutable preparation and commission.
      Repeated initial Start, even with a new request_id, returns the same handle.
      An application commission cannot acquire a second logical execution by
      changing keys, callers, or executors.
    derivation: "Transport retries must not create repeated applications."
    x-status: inferred
    x-source: "4-circus-tent-arch.md §5.6; contracts/01-application-attempt-lifecycle.yaml LIFE-IDEMPOTENCY."

  - id: EXT-RESUME
    classification: invariant
    rule: >-
      Resume requires a new command identity, the existing logical idempotency
      key/handle, explicit recovery authority, and an evidenced native checkpoint
      or idempotency contract for the same request and context. It preserves the
      same logical dispatch and journals each additional delivery.
    consequence: >-
      Never repeat completed side-effecting steps. Do not resume after the
      observation window is draining/closed, after context identity changed,
      or merely because a local lease expired. Unsupported recovery retains
      uncertainty; a new attempt needs the lifecycle's duplicate-risk review.
    derivation: "A local checkpoint or lease is not proof that an employer write did not commit."
    x-status: inferred
    x-source: "4-circus-tent-arch.md §5.6; contracts/01-application-attempt-lifecycle.yaml."

  - id: EXT-OBSERVE
    classification: proposed_mechanism
    rule: >-
      Observe returns registered connector observation projections in journal
      order for exactly the requested handle. The cursor identifies a scanned
      journal position, including positions containing other event kinds.
      It does not claim every journal entry is a connector observation.
    consequence: >-
      The first page pins through; continuation pages use that same cutoff.
      after < entry.sequence <= next <= through. next names the last scanned
      position, not merely the last returned item. has_more is exactly
      next.sequence < through.last_sequence. At the cutoff an empty page is
      legitimate and does not imply native termination or absence of future
      callbacks. Lost/unavailable cursor history is explicit, never skipped.
    rationale: "Bounded resumable pulls work even when the native interface has no polling API."
    flip_condition: >-
      Introduce another versioned observation carrier if measured workloads need
      push delivery; retain journal cutoffs, loss visibility, deduplication,
      ordering, and late-evidence semantics.
    x-status: proposed
    x-source: *w

  - id: EXT-NORMALIZE
    classification: invariant
    rule: >-
      Retain exact native bodies before normalization. Authenticate source and
      correlate to the attempt independently. Mismatched/unknown correlation
      or unverified source yields no accepted execution claims. Trace mismatch
      may coexist with independently evidenced alternate correlation.
    consequence: >-
      Preserve source scope, mapping version, source/receipt times, explicit
      unknown, missing fields, and conflicting responses/callbacks. None and
      acknowledgements do not become semantic success. Initially map audited
      circus-tent /run completed to execution completion only.
    derivation: "Adapter overclaims are connector defects, not native subject claims."
    x-status: extracted
    x-source: *d

  - id: EXT-CLOSE
    classification: invariant
    rule: >-
      Closing a connection, ending observation, requesting native cancellation,
      releasing context, and containment are separate operations/effects.
      end_observation=true stops new workflow commands and starts the commissioned
      bounded drain/finalization; false closes only the selected native transport.
      Neither setting implies a cancel request.
    consequence: >-
      Local deadlines remain effective without native cancellation. Freeze
      close-time knowledge and pins; append late evidence and new owner/report
      revisions without reopening the window or rewriting the original snapshot.
      Only a fixture origin can seal its mutation authority.
    derivation: "Post-disconnect continuation is the paid-for cancellation counterexample."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §5.5; contracts/01-application-attempt-lifecycle.yaml."

  - id: EXT-CONTROLS
    classification: invariant
    rule: >-
      Every control operation has a scoped authorization and immutable
      observations. requested records a request attempt, acknowledged records
      a verified response, and effect_observed requires effect evidence.
      A subject's confirmed-stop report is still a subject claim.
    consequence: >-
      Unknown delivery is not unsupported and unsupported mapping is not
      automatically native absence. Release failure cannot silently trigger
      Contain. Forced termination is not cooperative cancellation or rollback.
      Cleanup of shared resources must identify known affected attempts.
    derivation: "An acknowledgement does not establish the requested semantic effect."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§4.1 and 5.5; 5-browser-qualification.md."

  - id: EXT-BOUNDS
    classification: invariant
    rule: >-
      Enforce finite local call, queue/observation, drain, cancellation-wait, and
      cleanup-wait bounds using registered local monotonic clocks. Admission
      and observation buffering are bounded; rejected work is not silently lost.
      An accepted queued task consumes its active observation budget.
    consequence: >-
      No workflow delivery starts after its active boundary. A call deadline
      does not stop native work already dispatched. Record budget enforcement
      ownership and gaps; Start cannot silently downgrade a required bound or
      requested state policy. A zero configured bound means immediate, not absent.
      Reserve progress for local close/control handling despite task queue pressure.
    derivation: "A stuck native call must not prevent the observer from truthfully finalizing."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§5.5 and 10.6; 2-state-bank-crawler-blueprint.json Decision 2."

  - id: EXT-STATE-POLICY
    classification: invariant
    rule: >-
      Browser-state and framework-learning-state requests remain separate.
      Prepare records their mapping and limitations; actual realization is
      journaled after Start. An opaque context reference is not a Page or DOM
      handle and grants no authority by itself.
    consequence: >-
      Do not call a subject-default context fresh, infer isolation from a fixture
      namespace, or claim clean learning state from a fresh browser profile.
      Required unsupported policies reject preparation; explicitly permitted
      best-effort policies disclose their limitations before Start.
    derivation: "Fixture, browser, and learning state have different contamination boundaries."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§3.4 and 5.1."

  - id: EXT-ARTIFACTS
    classification: invariant
    rule: >-
      Install immutable artifact bytes durably before journal references.
      Artifact names and digests resolve only within the authorized handle's
      retained evidence or declared native retrieval mapping. Do not fetch
      arbitrary caller URLs or filesystem paths through CollectArtifacts.
    consequence: >-
      Each requested name receives an available slot or reasoned missingness;
      known digests survive loss. Inventory completeness concerns the declared
      inventory scope, not proof of all private native artifacts. Retrieval
      never reruns workflow actions, creates a new browser session, or claims
      a native artifact API exists because local response bytes were captured.
    derivation: "Evidence references must identify available bytes, not plausible locators."
    x-status: inferred
    x-source: "contracts/00-evidence-kernel.yaml EK-ARTIFACTS; 3-hellscape-blueprint.md §§1.3 and 10."

  - id: EXT-EVIDENCE
    classification: invariant
    rule: >-
      ObservationItem copies an already journaled, registry-validated projection.
      Its metadata must match the referenced event. Nested claims, control
      observations, and artifact slots cite earlier supporting events, not
      themselves. Register/import source evidence before citing it.
    consequence: >-
      Publish lifecycle domains asynchronously under their own grants.
      This connector may emit references for dispatch, observation, and faithfully
      delegated execution publications only. It cannot publish application or
      report as if those were connector-owned outcomes.
    derivation: "Unjournaled or self-authenticated data cannot support reproducible assessment."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; contracts/00-evidence-kernel.yaml; contracts/01-application-attempt-lifecycle.yaml."

  - id: EXT-TIME-NULL
    classification: invariant
    rule: >-
      Every normalized null uses Missing with one of the six kernel reasons.
      Every measurement has clock_id, boot_id, origin, estimate, and censoring.
      Register clocks before use. Never subtract across clocks or boots; UTC is
      annotation only. Endpoint differences and bounds obey kernel arithmetic.
    consequence: >-
      Preserve reported zero unchanged under its source clock. Missing native
      timing is unavailable, not zero. Do not divide aggregate latency into
      step timings or compare unlike intervals as a measurement discrepancy.
      Configuration limits are declarations, not observed measurements.
    derivation: "The diagnosed _elapsed() zero defect makes default timing values unsafe."
    x-status: extracted
    x-source: *h

  - id: EXT-FAILURE
    classification: invariant
    rule: >-
      ConnectorError describes failure to carry out this connector operation,
      not a composite task outcome. An observed native failed/completed/stopped
      claim is normal evidence returned by Observe. Local prerequisite and
      translation errors are not fabricated subject failures.
    consequence: >-
      A lost response or storage failure cannot justify a success default,
      fresh idempotency key, speculative native probe, or silent external retry.
      Offline evidence replay invokes none of the task/control effects here.
    derivation: "The retired qualification harness distinguished harness failure from driver behavior."
    x-status: inferred
    x-source: "5-browser-qualification.md; 3-hellscape-blueprint.md §§10.6–10.8."

x-native-reconciliation:
  initial_circus_tent_rest_binding:
    status: documentary_mapping_basis_not_current_deployment_certification
    task_delivery:
      recorded_plan: "POST /run"
      eligible_extraction: "POST /extract"
    optional_operational_observations: ["GET /health", "GET /shards"]
    result_sources: [terminal_response, authenticated_correlated_callback]
    not_established:
      - goal_submission_endpoint
      - GET_runs_by_id
      - native_cancel_endpoint
      - fresh_context_creation_endpoint
      - native_context_release_endpoint
      - native_revision_endpoint
      - native_artifact_download_endpoint
    rules:
      - >-
        The common /connector route is a proposed facade, not an assertion that
        circus-tent already implements it or that /run has become asynchronous.
      - >-
        The facade allocates the local handle before the blocking-shaped native
        call. Observe reads retained responses/callbacks without inventing polling.
      - >-
        Native callbacks use configured, authorized callback destinations and a
        pinned verification contract; callers cannot supply arbitrary callback
        URLs through this shared interface.
      - >-
        Historical 404s, trace mismatches, zero timing, and inconclusive MCP
        initialization remain scoped historical evidence, not current defaults.
    x-status: extracted
    x-source: "3-hellscape-blueprint.md §§1.3 and 5.3; 4-circus-tent-arch.md §5.8."
  ringmaster:
    rule: >-
      Implements the same external messages independently. Its BrowserOxide
      packaging, native implementation interface, and primitive inventory are not
      selected by this contract. Direct DOM/V8 strengths remain internal.
    x-status: inferred
    x-source: *b
  manual:
    rule: >-
      Manual execution bypasses Prepare/Start and has no fabricated descriptor.
      Record its actions and origin receipts through the kernel/lifecycle path.
    x-status: extracted
    x-source: *l
  handoff_amendments:
    value: none
    explanation: >-
      This file supplies protocol mechanisms without changing a governing
      invariant or resolving an unprovided native capability by assumption.
    x-status: proposed
    x-source: *w

x-open-evidence:
  - missing: >-
      The complete audited native request/response bodies and callback signing
      algorithm/key-distribution contract are not supplied.
    resolution: >-
      Pin the implementation's actual native schemas and verifier with retained
      authorized evidence. Until verified, preserve raw observations without
      accepting authenticated claims. Use explicitly synthetic backends for M1;
      do not restore a pre-M1 live-probe gate.
    x-status: uncertain
    x-source: "3-hellscape-blueprint.md §§1.3, 5.3, and 10.6; 4-circus-tent-arch.md §5.8."
  - missing: "Current native capability evidence for newly built subject versions."
    resolution: >-
      Publish complete unknown descriptors and collect version-specific evidence
      as each implementation is exercised. Do not inherit historical presence,
      absence, capacity, isolation, or timing findings.
    x-status: uncertain
    x-source: *h

oneOf:
  - $ref: "#/$defs/ConnectorRequest"
  - $ref: "#/$defs/ConnectorResponse"
  - $ref: "#/$defs/ConnectorDescriptor"
  - $ref: "#/$defs/TaskEnvelope"
  - $ref: "#/$defs/PreparedTask"
  - $ref: "#/$defs/ConnectorHandle"

$defs:
  SchemaVersion:
    const: external-connector/0.1.0
    x-status: proposed
    x-source: *w

  Identifier:
    type: string
    minLength: 1
    x-status: extracted
    x-source: *k

  Revision:
    type: integer
    minimum: 0
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  PositiveInteger:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  Digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    x-status: extracted
    x-source: *k

  Missing:
    type: object
    additionalProperties: false
    required: [value, reason]
    properties:
      value: {type: "null", x-status: extracted, x-source: *k}
      reason:
        enum: [not_enabled, not_applicable, not_observed, observation_lost, unsupported_by_subject, manual_override]
        x-status: extracted
        x-source: *h
      detail: {type: string, minLength: 1, x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  Inapplicable:
    allOf:
      - $ref: "#/$defs/Missing"
      - properties: {reason: {const: not_applicable}}
    x-status: extracted
    x-source: *k

  MaybeString:
    oneOf:
      - $ref: "#/$defs/Identifier"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  MaybeDigest:
    oneOf:
      - $ref: "#/$defs/Digest"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  EvidenceRef:
    type: object
    additionalProperties: false
    required: [journal_id, sequence, event_id, event_hash, pointer]
    properties:
      journal_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      sequence: {$ref: "#/$defs/PositiveInteger", x-status: extracted, x-source: *k}
      event_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      event_hash: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
      pointer:
        type: string
        pattern: '^(?:/(?:[^~/]|~[01])*)*$'
        x-status: extracted
        x-source: *k
    x-status: extracted
    x-source: *k

  MaybeEvidenceRef:
    oneOf:
      - $ref: "#/$defs/EvidenceRef"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *l

  EvidenceRefs:
    type: array
    uniqueItems: true
    items: {$ref: "#/$defs/EvidenceRef"}
    x-status: extracted
    x-source: *k

  SupportRefs:
    allOf:
      - $ref: "#/$defs/EvidenceRefs"
      - minItems: 1
    x-status: extracted
    x-source: *k

  JournalPrefix:
    type: object
    additionalProperties: false
    required: [journal_id, last_sequence, head_hash]
    properties:
      journal_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      last_sequence: {$ref: "#/$defs/PositiveInteger", x-status: extracted, x-source: *k}
      head_hash: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  ArtifactReference:
    type: object
    additionalProperties: false
    required: [digest, size_bytes, media_type, owner_domain, access]
    properties:
      digest: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
      size_bytes: {$ref: "#/$defs/Revision", x-status: extracted, x-source: *k}
      media_type: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      owner_domain: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      access: {enum: [public, restricted], x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  MaybeArtifact:
    oneOf:
      - $ref: "#/$defs/ArtifactReference"
      - $ref: "#/$defs/Missing"
    x-status: proposed
    x-source: *w

  ArtifactSlot:
    type: object
    additionalProperties: false
    required: [name, expected_digest, content, evidence_refs]
    properties:
      name: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      expected_digest: {$ref: "#/$defs/MaybeDigest", x-status: extracted, x-source: *k}
      content: {$ref: "#/$defs/MaybeArtifact", x-status: extracted, x-source: *k}
      evidence_refs: {$ref: "#/$defs/SupportRefs", x-status: extracted, x-source: *k}
    description: Available content requires expected_digest=content.digest; known identity survives loss.
    x-status: extracted
    x-source: *k

  VersionPin:
    type: object
    additionalProperties: false
    required: [id, version, artifact_digest]
    properties:
      id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
