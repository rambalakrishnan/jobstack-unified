    x-status: proposed
    x-source: *w

  MeasurementOrigin:
    enum: [engine_measured, browser_measured, subject_reported, manual_reference]
    x-status: extracted
    x-source: *k

  ClockDescriptor:
    type: object
    additionalProperties: false
    required: [clock_id, boot_id, origin, source_id, basis, unit]
