$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:job-application:contracts:owner-separated-write-domains:0.1.0
title: Owner-separated write domains
description: >-
  Review draft for independently writable domains, asynchronous publication,
  atomic read compositions, named revision-vector seals, and complete immutable
  archives. Applies the pattern to discovered jobs, application attempts, and
  Hellscape sessions. A read composition is not a multi-owner write API.
x-status: proposed
x-source: "1-handoff-brief.txt, Parts VI and VIII."

x-source-index:
  handoff: &h "1-handoff-brief.txt, Parts VI and VIII–X"
  separation: &s "2-state-bank-crawler-blueprint.json, §§11.16–11.17 and Decision 8"
  crawler: &c "2-state-bank-crawler-blueprint.json, §§5–8 and 11"
  hellscape: &f "3-hellscape-blueprint.md, §§3–5 and 9–10"
  qualification: &q "5-browser-qualification.md, Evidence discipline"
  product: &p "6-get-a-job.xml.txt, docs/contracts/firestore-collections.md"
  kernel: &k "contracts/00-evidence-kernel.yaml, evidence-kernel/0.1.0"
  lifecycle: &l "contracts/01-application-attempt-lifecycle.yaml, application-attempt-lifecycle/0.1.0"
  wire: &w >-
    Proposed wire design for the handoff's owner-separation invariant.
    Record names, publication receipts, fixed domain maps, archive extent
    encoding, and retention pins are proposals, not existing implementation claims.

x-contract:
  name: owner-separated-write-domains
  version: 0.1.0
  maturity: review_draft
  owner: contracts
  consumers: [crawler, Circus Tent, Ringmaster, Hellscape, job-hunter, dashboard]
  conformance_suite: conformance/04-owner-separated-write-domains.md
  gate: structural_validation_and_OWD_rules
  scope:
    - Immutable entity registrations and single-writer domain bindings.
    - Complete owner revisions and independently acknowledged owner-local writes.
    - Asynchronous installation of complete revisions into a named read view.
    - Complete read rows sealed at explicit version vectors.
    - Fetch-key replacement with complete prior-row archival.
    - Retention roots protecting archives and their transitive dependencies.
  non_goals:
    - A shared database, broker, runtime, or distributed transaction.
    - A global status replacing independently owned facts.
    - A new browser abstraction or a change to connector verbs.
    - A replacement for the kernel lease primitive.
    - Selection of job-hunter's implementation language or primary store.
  x-status: proposed
  x-source: *w

x-compatibility:
  schema_references: All_$ref_values_are_local
  common_types: >-
    Missing, evidence references, artifact references, version pins, clocks,
    measurements, subject identity, assistance, and attempt context preserve
    evidence-kernel/0.1.0 wire meanings.
  attempt_publications: >-
    AxisRevision and its value types retain application-attempt-lifecycle/0.1.0
    field names and record version. They are embedded without assigning a
    second authoritative revision number. The containing publication receipt
    and read row belong to this contract.
  attempt_registration: >-
    The immutable commission remains an artifact. Registration repeats only
    the attempt context, execution descriptor, and owner bindings needed here;
    these must equal the corresponding commissioned values. The registration
    is not permission to amend the commission.
  canonicalization: >-
    Use kernel-jcs-sha256/1: UTF-8 RFC 8785 canonical JSON and SHA-256 digests
    encoded as sha256:<64 lowercase hexadecimal digits>. Artifact digests
    identify exact stored bytes. A record never includes its own artifact digest.
  archive_identity: >-
    ArchiveRecord.root identifies the exact canonical ArchiveStorageManifest
    bytes, not the expanded ArchiveRecord or payload_json bytes. The manifest
    names immutable, locally durable components and deterministically expands
    into the complete payload_json. This distinction permits bounded metadata
    archival without reserializing a large downstream domain on crawler writes.
  x-status: proposed
  x-source: "contracts/00-evidence-kernel.yaml; contracts/01-application-attempt-lifecycle.yaml; 2-state-bank-crawler-blueprint.json Decision 8."

x-domain-layouts:
  job:
    identity: "(target, job_id); both are source-system identities"
    domains:
      crawler:
        writer_role: crawler
        owns: >-
          Acquisition, fetch identity, extracted content, render evidence,
          discovery and coverage references, operational processing,
          classifier provenance, crawler semantic candidate, replacement lineage.
      downstream:
        writer_role: product
        owns: >-
          Product track, priority, evaluations, material references, selection,
          downstream work ownership, and links to application attempts.
    exclusion: >-
      A downstream link to an attempt is not an application fact. Neither job
      owner may overwrite an attempt's execution or application axis.
    x-status: inferred
    x-source: "2-state-bank-crawler-blueprint.json §§11.4, 11.14, 11.17; 1-handoff-brief.txt Part VI."

  application_attempt:
    identity: "(attempt_id, kind)"
    domains:
      dispatch: connector
      observation: connector
      execution: subject
      application: origin
      report: reconciler
    exclusion: >-
      Commissioning is immutable metadata, not a sixth outcome axis.
      Manual dispatch and execution slots remain unpublished and inapplicable.
    x-status: extracted
    x-source: *l

  hellscape_session:
    identity: session_id
    domains:
      application:
        writer_role: origin
        owns: Fixture reducer state, accepted data, validation generations, commitment, mutation-authority sealing.
      observation:
        writer_role: observer
        owns: >-
          Producer completeness, observed actions, confirmation-render evidence,
          incidents, measurements, and a pinned copy of the attempt observation
          publication. That copy is not a second lifecycle authority.
      diagnostic:
        writer_role: analyzer
        owns: Immutable diagnostic selection, its input pins, classifier identity, and replay-receipt references.
    exclusion: >-
      Curriculum selects future manifests; it cannot mutate these domains to
      improve an active session's result. Native claims remain attempt execution
      records, not fixture application state.
    x-status: proposed
    x-source: "3-hellscape-blueprint.md §§3.2–3.4, 4, 6.6, 10."

x-source-reconciliation:
  - decision: >-
      Stage1's crawler/downstream split wins over a shared mutable Firestore
      jobs document. The source-system root remains (target, job_id).
      portfolio_job_id supplies the product-facing identity.
    x-status: inferred
    x-source: "2-state-bank-crawler-blueprint.json §11; 6-get-a-job.xml.txt docs/contracts/firestore-collections.md."

  - decision: >-
      Firestore company maps to content.employer; rawDescription maps to
      content.description; sourceUrl, directApplyUrl, portalType, location,
      and closingDate remain separately represented. track belongs to the
      downstream domain. Missing source values retain reasoned missingness.
      source_url is not silently copied into direct_apply_url.
    x-status: proposed
    x-source: "2-state-bank-crawler-blueprint.json §11.4; 6-get-a-job.xml.txt docs/contracts/firestore-collections.md."

  - decision: >-
      The old multi-writer semantic_state is not a stored shared field.
      Crawler semantic_candidate, product selection/ownership, and origin-backed
      attempt facts remain separate. A legacy DISCOVERED/SHORTLISTED/CLAIMED/
      APPLIED/CLOSED display may be derived with pinned inputs, but cannot be
      used as an authoritative write target.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 2-state-bank-crawler-blueprint.json §11.14."

  - decision: >-
      Company/title/location hashes remain possible duplicate-candidate hints,
      not primary keys or overwrite authority. The legacy company/title
      application key cannot merge distinct source postings or practice and
      production attempts.
    x-status: inferred
    x-source: "2-state-bank-crawler-blueprint.json §11.0; 6-get-a-job.xml.txt docs/contracts/firestore-collections.md; 1-handoff-brief.txt Part VI."

  - decision: >-
      Hellscape's single-binary direction does not imply one cross-owner
      transaction. Application operations may atomically write their own state,
      operation record, and journal. Telemetry and diagnostic publication do not
      join that transaction. Separate tables sharing a contested serialized
      writer do not establish write-path independence.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 2-state-bank-crawler-blueprint.json Decision 8; 3-hellscape-blueprint.md §§3 and 10.1–10.2."

  - decision: >-
      The Stage1 same-fetch-key no-op rule is retained, including its freshness
      limitation. A newer response, repaired failed render, changed extractor,
      or new crawl date does not authorize same-key acquisition replacement.
      Independent lease, classification, and semantic transitions remain possible.
    x-status: extracted
    x-source: "2-state-bank-crawler-blueprint.json §§11.16 and 15.1."

  - decision: >-
      ArchiveStorageManifest is a physical extent representation, not permission
      to return only hashes instead of the promised logical row. Every archive
      must expand into the complete typed payload_json, including reasoned
      nulls and the exact published downstream revision.
    x-status: proposed
    x-source: *s

  - decision: >-
      No handoff amendment is introduced. Physical persistence choices remain
      open; their admission depends on the isolation, publication, archive, and
      retention tests rather than a datastore brand.
    x-status: proposed
    x-source: *w

x-validation:
  x-status: proposed
  x-source: *w
  requirements:
    - >-
      Validate JSON Schema 2020-12 with format assertions. Reject duplicate YAML
      keys, non-JSON values, non-finite numbers, unknown versions, and undeclared
      properties. Decode YAML before hashing; schema anchors are not wire features.
    - >-
      Structural validation is necessary but insufficient. All applicable OWD,
      kernel, and lifecycle authorization, reference, arithmetic, and transition
      rules must also pass.
    - >-
      Only Missing.value may contain serialized null. Every nested absence has
      one of the six kernel reasons. Empty arrays describe an established empty
      collection, not an unknown collection.
    - >-
      Verify artifact bytes, declared sizes, evidence references, journal
      prefixes, registration digests, domain identity, and all revision equality
      constraints. A caller-supplied writer_id or verified flag grants no authority.
    - >-
      Mutable rows, URLs, native handles, and current database queries cannot
      substitute for the immutable components named by a published row or archive.

x-semantic-rules:
  - id: OWD-OWNER
    classification: invariant
    rule: >-
      Every declared domain has one authenticated logical writer. Entity
      registration fixes its field set, authority source, writer, storage-domain
      identity, and publication policy. Temporary workers act through that
      writer's fenced transition gateway; they do not become additional owners.
      Each owner_domain is distinct within an entity.
    consequence: >-
      A writer may publish only its own complete domain. A changed field outside
      that domain rejects the entire write. A composed row is never accepted as
      an update command. Deployment replacement may retain a logical writer
      identity; ownership transfer requires an explicit versioned migration,
      not an unjournaled configuration edit.
    derivation: "Shared field ownership allows one component's refresh to erase another's work."
    x-status: inferred
    x-source: *s

  - id: OWD-LOCAL-COMMIT
    classification: invariant
    rule: >-
      Commit an owner's authorized effect, revision advance, and journal evidence
      atomically within that owner's durability boundary. Do not acknowledge
      before durability. No owner commit acquires a peer-owned write lock or
      waits for a peer transaction, acknowledgement, or large-payload serialization.
    consequence: >-
      A shared contracts workspace, process, or database hostname proves no
      isolation property. For crawler/downstream writes, independent persistence
      and I/O admission must be demonstrated. Owner-local journals may be
      asynchronously imported into a composition journal; a central journal
      transaction is not required on every owner's write path.
    derivation: "Two tables behind one serialized storage writer fail Stage1 Decision 8's floor."
    x-status: extracted
    x-source: *s

  - id: OWD-REVISION
    classification: invariant
    rule: >-
      A domain revision is a complete immutable snapshot, not a patch.
      revision=previous_revision+1 at the owner. The first revision is 1.
      The key (entity, domain, revision) identifies exactly one content digest.
      Identical retries are idempotent; different bytes under that key are an
      integrity conflict. Stale expected revisions or lease epochs cannot commit.
    consequence: >-
      A rejected write changes neither source fields nor publication pointers.
      Revisions and lease ownership are not application statuses. Claiming a
      resource does not change its pending operational state.
    derivation: "Partial writes and unfenced retries create lost updates and duplicate effects."
    x-status: inferred
    x-source: "2-state-bank-crawler-blueprint.json §§11.15–11.17; contracts/00-evidence-kernel.yaml."

  - id: OWD-PUBLISH
    classification: invariant
    rule: >-
      Owner durability acknowledgement and installation into a read view are
      different events. Transfer, validate, and durably install all immutable
      components before atomically advancing the view's domain pointer.
      The pointer update is bounded metadata work. Publication cannot expose
      partially transferred bytes.
    consequence: >-
      Failed transfer, checksum failure, unavailable peer storage, or publication
      lag leaves the last complete published revision visible. Reordered delivery
      cannot roll the current pointer backward. Publication may skip intermediate
      visible revisions only after verifying their owner revision lineage.
      An identical installed revision returns its existing receipt.
    derivation: "Asynchronous publication is safe only when readers see old-or-new, never partial."
    x-status: extracted
    x-source: *s

  - id: OWD-VIEW
    classification: invariant
    rule: >-
      A LogicalRow contains every declared domain slot and an exact version
      vector. Each nonzero slot embeds the complete domain document whose
      artifact digest and installation receipt it names. A zero slot means no
      publication in this view, or an explicitly inapplicable manual axis.
      Readers obtain one complete immutable row root.
    consequence: >-
      Different owners may be at different publication ages. This is a named,
      locally available composition, not global cross-owner linearizability.
      A durable but unpublished downstream update is not silently included.
      Once a revision has been published, loss of its bytes cannot be disguised
      as revision zero; report observation_lost and retain the known identity.
    derivation: "A version vector makes asynchronous freshness visible instead of hiding it behind a whole-row status."
    x-status: inferred
    x-source: *s

  - id: OWD-SEAL
    classification: invariant
    rule: >-
      A seal names a state and pins all domain revisions selected in a named
      read view. Its journaled seal-selection event pins the domain document
      digests and publication receipts before the resulting LogicalRow is
      registered. The row's input prefix includes that selection event, not its
      own later artifact-registration event.
    consequence: >-
      Seals are immutable and do not freeze future owner writes. observation_closed
      requires a pinned closed observation publication; it does not establish
      native termination or final origin absence. A later seal records a new
      view without changing the earlier cut.
    derivation: "Without an exact cut, archived rows and diagnostic inputs change when a peer publishes."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; contracts/01-application-attempt-lifecycle.yaml."

  - id: OWD-JOB
    classification: invariant
    rule: >-
      Job acquisition fields belong exclusively to crawler. Product decisions,
      priorities, materials, and attempt links belong exclusively to downstream.
      A crawler refresh preserves the separately published downstream domain;
      it does not copy stale downstream values back into downstream storage.
      Product evaluations identify the crawler revision they evaluated.
    consequence: >-
      A newer crawler revision can make an evaluation stale without deleting it.
      A content veto is not posting closure. Closure requires authoritative
      closure evidence, and missing from one crawl is insufficient. An APPLIED
      display requires a correlated production origin commitment, not a product
      claim, practice receipt, native completed response, or submit click.
    derivation: "Crawler semantic candidates and downstream application work have different authorities."
    x-status: inferred
    x-source: "2-state-bank-crawler-blueprint.json §§5.6, 11.14, 11.17; 1-handoff-brief.txt Part VI."

  - id: OWD-RENDER
    classification: invariant
    rule: >-
      A Pass acquisition must satisfy its declared required content fields.
      Required content is present, non-null, and correctly typed. A Pass with
      missing required extraction is rejected as incomplete_extraction, not
      materialized as a valid job or reclassified as failed rendering.
      A non-Pass acquisition has pipeline_state=render_failed and reasoned
      missingness for every content value.
    consequence: >-
      Failed render creates no genuine classifier result or successful seen_ids
      membership. Bypass creates no classifier result. A raw VETO overridden by
      shadow mode is not a genuine PASS; bypass alone does not shortlist.
      A later bypass may preserve an earlier genuine applied PASS.
    derivation: "Render acceptance, relevance classification, and application suitability cannot substitute for one another."
    x-status: extracted
    x-source: *c

  - id: OWD-FETCH-IDENTITY
    classification: invariant
    rule: >-
      Lookup uses (target, job_id). For A_full, fetch identity is the actual
      listing source URL. For B, it is canonical URL, uppercase method, actual
      request-body digest, and representation-determining headers. Exclude
      ephemeral identity/session headers; do not exclude representation headers
      to increase cache hits.
    consequence: >-
      Preserve query ordering unless endpoint evidence permits normalization.
      Remove fragments and normalize scheme/host case and default ports.
      Cookie rotation, run ID, crawl date, response digest, and extractor version
      are not hidden fetch-key inputs.
    derivation: "Changing request identity accidentally defeats idempotency and hides the documented freshness limitation."
    x-status: extracted
    x-source: "2-state-bank-crawler-blueprint.json §11.16."

  - id: OWD-FETCH-NOOP
    classification: invariant
    rule: >-
      An absent root accepts an initial complete crawler domain without a
      predecessor archive. An existing identical fetch key makes the acquisition
      write a no-op. No archive is created for that no-op. Independent discovery,
      lease, classification, and semantic transitions may advance the crawler
      domain while preserving acquisition and replacement_lineage exactly.
    consequence: >-
      A different response under the same key is journaled as new observation,
      not silently installed as replacement content. Repairing a same-key
      render_failed acquisition requires an explicitly versioned freshness
      contract; adding a run nonce is not a repair.
    derivation: "Stage1 explicitly makes request identity, not response freshness, authoritative for replacement."
    x-status: extracted
    x-source: "2-state-bank-crawler-blueprint.json §§11.16 and 15.1."

  - id: OWD-REPLACE
    classification: invariant
    rule: >-
      A changed fetch key requires a complete archive of the prior logical row
      at the named replacement seal. That cut uses the current old crawler
      revision and the latest fully published downstream revision in the named
      ingest-side view. An unpublished downstream revision is excluded.
      The owner-local replacement checks both the old crawler revision/key and
      the selected local publication pointer before committing.
    consequence: >-
      If either checked pointer changed before commit, reject/reselect rather
      than archiving a mismatched cut. Stage archive components outside the
      critical section. Commit the new crawler revision, its backward archive
      link, replacement journal effect, and durable retention protection as one
      owner-local effect. No updated crawler row may be acknowledged without
      its complete retrievable archive. A staged orphan is not a committed archive.
    derivation: "Archive and replacement must not diverge under crashes or concurrent publication."
    x-status: inferred
    x-source: *s

  - id: OWD-ARCHIVE
    classification: invariant
    rule: >-
      Archive payload_json is the entire previous LogicalRow, including its
      registration, all domain fields, reasoned nulls, publication receipts, and
      seal vector. It is not a changed-field diff, crawler-only row, hash list,
      or lookup of the latest downstream record.
    consequence: >-
      Physical immutable extents are permitted only when the archive resolver
      reconstructs exactly that full typed value without contacting a mutable
      peer. Complete downstream snapshots are imported before publication.
      Archive creation reuses their immutable bytes; large downstream JSON must
      not be serialized under, or awaited by, the crawler writer.
    derivation: "A locator that later resolves to different or absent fields is not a complete prior-row archive."
    x-status: extracted
    x-source: *s

  - id: OWD-RETENTION
    classification: invariant
    rule: >-
      A live replacement pins its archive root and every transitive immutable
      dependency. A retained later archive containing that replacement's
      backward link also keeps the earlier archive alive. Publishing a newer
      job revision, deleting a cache entry, or passing a TTL cannot release
      those dependencies.
    consequence: >-
      GC requires journaled proof that no live replacement or retained evidence
      root reaches the object. Reference checks and deletion are fenced against
      concurrent pin creation. Release is an explicit retention revision, not
      mutation of the archived payload. Artifact loss is an integrity incident,
      not successful GC or permission to silently reconstruct different bytes.
    derivation: "An immutable archive with reclaimable dependencies is not durable."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; 2-state-bank-crawler-blueprint.json Decision 8; contracts/00-evidence-kernel.yaml."

  - id: OWD-ATTEMPT
    classification: invariant
    rule: >-
      Attempt slots contain the exact lifecycle AxisRevision publications.
      Their outer slot revision equals the embedded axis revision; the axis,
      attempt identity, commission digest, owner_domain, and writer_id match
      registration and commission. The reconciler writes only report.
    consequence: >-
      Claim/fact histories remain cumulative and immutable. Late origin
      commitment can be published while report still uses older input pins.
      Readers expose that staleness; they neither overwrite the claim nor
      silently apply the old report to new facts. Manual execution creates no
      subject publication.
    derivation: "Owner separation must preserve the cancellation corpus's five orthogonal axes."
    x-status: extracted
    x-source: *l

  - id: OWD-SESSION
    classification: invariant
    rule: >-
      Hellscape application state is reducer-owned; observation cannot set
      accepted data, identity verification, or commitment. The diagnostic
      domain cites exact application and observation input revisions and a
      journal prefix. It cannot amend either source to fit a finding.
    consequence: >-
      A committed fixture application, incomplete telemetry tail, and stale
      diagnostic can coexist. Confirmation rendering stays observation evidence.
      The session's pinned attempt-observation copy is verified against its
      original axis publication, not independently authored lifecycle state.
      All Hellscape session evidence remains practice and held_in.
    derivation: "Fixture truth, observed behavior, and judgment have distinct failure modes and authorities."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§3–4 and 10; 1-handoff-brief.txt Part III."

  - id: OWD-TIME-PROVENANCE
    classification: invariant
    rule: >-
      Every measurement retains clock_id, boot_id, origin, censoring, and an
      exact, bounded, or unavailable estimate. No cross-clock or cross-restart
      subtraction is permitted. Publication delay cannot be computed by
      subtracting arbitrary source and destination UTC annotations.
      Provenance and writer authorization are assigned and checked at ingestion.
    consequence: >-
      Zero is a valid exact duration, never missingness. Unknown publication
      lag stays unavailable or bounded. Imported origin facts retain their
      original authority and correlation evidence; import does not turn a
      manual observation into a server-origin fact.
    derivation: "The timing defect and claim-as-fact counterexamples remain applicable at the storage boundary."
    x-status: extracted
    x-source: *k

x-proposed-mechanisms:
  - id: OWD-EXTENT-ENCODING
    decision: >-
      Use owner-domain-extents/1 for archive manifests. Each published domain
      already has a complete immutable document artifact. An archive manifest
      pins those document artifacts, the entity registration artifact, and the
      full seal. Expansion inserts the verified documents into the LogicalRow
      shape defined here.
    rationale: >-
      The metadata size depends on the fixed number of domains, not downstream
      payload size. This reconciles complete logical archives with the explicit
      prohibition on downstream serialization in the crawler critical path.
    flip_condition: >-
      A different representation may replace this encoding in a new version
      only if it demonstrates exact full-row reconstruction, content addressing,
      transitive retention, and equivalent non-blocking write behavior.
    x-status: proposed
    x-source: *s

  - id: OWD-READ-ROOT
    decision: >-
      Install immutable LogicalRow roots atomically in each read view. A
      composition service owns only that derived pointer and its publication
      journal; it gains no source-domain write authority.
    rationale: >-
      An atomic root prevents readers from assembling half a publication while
      permitting each source owner to acknowledge writes independently.
    flip_condition: >-
      A storage-native snapshot mechanism is acceptable if it returns the same
      explicit domain pins and passes old-or-new, delayed-publication, crash,
      and archive-race tests without a cross-owner transaction.
    x-status: proposed
    x-source: *w

x-fetch-key-profile:
  id: crawler-fetch-key/1
  formulas:
    B: "SHA-256(JCS([target, 'B', job_id, canonical_request]))"
    A_full: "SHA-256(JCS([target, 'A_full', job_id, listing_source_url]))"
  canonical_request_fields: [url, method, body_hash, header_identity_set]
  framing: >-
    Arrays are length-unambiguous JSON arrays. header_identity_set is ordered by
    normalized header name with deterministic value ordering declared by the
    endpoint. Preserve meaningful multi-value and query order.
  x-status: proposed
  x-source: "2-state-bank-crawler-blueprint.json §11.16 specifies inputs; framing is a Step 0 wire proposal."

x-archive-expansion:
  algorithm:
    - Verify root.digest and size against canonical storage_manifest bytes.
    - Load and verify the registration artifact; retain its digest.
    - For each nonzero domain pin, load its complete document and verify its digest and owner binding.
    - Preserve every zero-domain Missing envelope exactly.
    - >-
      Construct LogicalRow with record_type=logical_row, this contract version,
      the manifest entity, the complete registration, registration_digest,
      each expanded domain slot, and the manifest seal_point.
    - >-
      Require structural and semantic equality with ArchiveRecord.payload_json.
      No current owner lookup, default insertion, redaction, or revision upgrade
      is part of expansion.
    - Verify local durability and retention of every transitive dependency before replacement acknowledgement.
  x-status: proposed
  x-source: *w

