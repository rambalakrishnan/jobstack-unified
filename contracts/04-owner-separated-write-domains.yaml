    minimum: 0
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  PositiveInteger:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  Digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    x-status: extracted
    x-source: *k

  Missing:
    type: object
    additionalProperties: false
    required: [value, reason]
    properties:
      value: {type: "null", x-status: extracted, x-source: *k}
      reason:
        enum: [not_enabled, not_applicable, not_observed, observation_lost, unsupported_by_subject, manual_override]
        x-status: extracted
        x-source: *h
      detail: {type: string, minLength: 1, x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  Inapplicable:
    allOf:
      - $ref: "#/$defs/Missing"
      - properties: {reason: {const: not_applicable}}
    x-status: extracted
    x-source: *k

  MaybeString:
    oneOf:
      - $ref: "#/$defs/Identifier"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  MaybeText:
    oneOf:
      - type: string
      - $ref: "#/$defs/Missing"
    description: An observed empty string is distinct from an unobserved value.
    x-status: proposed
    x-source: *w

  MaybeDigest:
    oneOf:
      - $ref: "#/$defs/Digest"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  MaybeNumber:
    oneOf:
      - type: number
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  HttpURL:
    type: string
    format: uri
    pattern: '^https?://'
    description: An evidenced acquisition or application URL, never an invented endpoint.
    x-status: proposed
    x-source: *w

  MaybeURL:
    oneOf:
      - $ref: "#/$defs/HttpURL"
      - $ref: "#/$defs/Missing"
    x-status: proposed
    x-source: *w

  MaybeDate:
    oneOf:
      - {type: string, format: date}
      - $ref: "#/$defs/Missing"
    x-status: inferred
    x-source: *c

  EvidenceRef:
    type: object
    additionalProperties: false
    required: [journal_id, sequence, event_id, event_hash, pointer]
    properties:
      journal_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      sequence: {$ref: "#/$defs/PositiveInteger", x-status: extracted, x-source: *k}
      event_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      event_hash: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
      pointer: {type: string, pattern: '^(?:/(?:[^~/]|~[01])*)*$', x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  EvidenceRefs:
    type: array
    uniqueItems: true
    items: {$ref: "#/$defs/EvidenceRef"}
    x-status: extracted
    x-source: *k

  SupportRefs:
    allOf:
      - $ref: "#/$defs/EvidenceRefs"
      - minItems: 1
    x-status: extracted
    x-source: *k

  MaybeEvidenceRef:
    oneOf:
      - $ref: "#/$defs/EvidenceRef"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *l

  JournalPrefix:
    type: object
    additionalProperties: false
    required: [journal_id, last_sequence, head_hash]
    properties:
      journal_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      last_sequence: {$ref: "#/$defs/PositiveInteger", x-status: extracted, x-source: *k}
      head_hash: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  ArtifactReference:
    type: object
    additionalProperties: false
    required: [digest, size_bytes, media_type, owner_domain, access]
    properties:
      digest: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
      size_bytes: {$ref: "#/$defs/Revision", x-status: extracted, x-source: *k}
      media_type: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      owner_domain: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      access: {enum: [public, restricted], x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  MaybeArtifact:
    oneOf:
      - $ref: "#/$defs/ArtifactReference"
      - $ref: "#/$defs/Missing"
    x-status: proposed
    x-source: *w

  VersionPin:
    type: object
    additionalProperties: false
    required: [id, version, artifact_digest]
    properties:
      id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      version: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      artifact_digest: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  MeasurementOrigin:
    enum: [engine_measured, browser_measured, subject_reported, manual_reference]
    x-status: extracted
    x-source: *k

  Scope:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind:
        enum: [run, session, connector_call, workflow_step, application_operation, native_primitive, recovery, discovery, capability, resource]
        x-status: extracted
        x-source: *k
      id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  TimePoint:
    type: object
    additionalProperties: false
    required: [clock_id, boot_id, origin, monotonic_offset_ms, utc_annotation]
    properties:
      clock_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      boot_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      origin: {$ref: "#/$defs/MeasurementOrigin", x-status: extracted, x-source: *k}
      monotonic_offset_ms: {type: number, minimum: 0, x-status: extracted, x-source: *k}
      utc_annotation:
        oneOf:
          - {type: string, format: date-time}
          - $ref: "#/$defs/Missing"
        x-status: extracted
        x-source: *k
    x-status: extracted
    x-source: *k

  MaybeTimePoint:
    oneOf:
      - $ref: "#/$defs/TimePoint"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  Estimate:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: {const: exact, x-status: extracted, x-source: *k}
          value: {type: number, x-status: extracted, x-source: *k}
      - type: object
        additionalProperties: false
        required: [kind, lower_bound, upper_bound]
        properties:
          kind: {const: bounded, x-status: extracted, x-source: *k}
          lower_bound: {$ref: "#/$defs/MaybeNumber", x-status: extracted, x-source: *k}
          upper_bound: {$ref: "#/$defs/MaybeNumber", x-status: extracted, x-source: *k}
        anyOf:
          - properties: {lower_bound: {type: number}}
          - properties: {upper_bound: {type: number}}
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: {const: unavailable, x-status: extracted, x-source: *k}
          value: {$ref: "#/$defs/Missing", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  Measurement:
    type: object
    additionalProperties: false
    required:
      - measurement_id
      - name
      - scope
      - quantity
      - unit
      - origin
      - clock_id
      - boot_id
      - method
      - start
      - end
      - estimate
      - resolution
      - censoring
      - comparability_group
    properties:
      measurement_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      name: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      scope: {$ref: "#/$defs/Scope", x-status: extracted, x-source: *k}
      quantity: {enum: [duration, scalar], x-status: extracted, x-source: *k}
      unit: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      origin: {$ref: "#/$defs/MeasurementOrigin", x-status: extracted, x-source: *k}
      clock_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      boot_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      method: {enum: [endpoint_difference, source_value, evidence_bound, unavailable], x-status: extracted, x-source: *k}
      start: {$ref: "#/$defs/MaybeTimePoint", x-status: extracted, x-source: *k}
      end: {$ref: "#/$defs/MaybeTimePoint", x-status: extracted, x-source: *k}
      estimate: {$ref: "#/$defs/Estimate", x-status: extracted, x-source: *k}
      resolution:
        oneOf:
          - {type: number, minimum: 0}
          - $ref: "#/$defs/Missing"
        x-status: extracted
        x-source: *k
      censoring: {enum: [none, left, right, both, unavailable], x-status: extracted, x-source: *k}
      comparability_group: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *k}
    allOf:
      - if: {properties: {quantity: {const: duration}}}
        then:
          properties:
            unit: {const: ms}
            estimate:
              properties:
                value: {minimum: 0}
                lower_bound: {minimum: 0}
                upper_bound: {minimum: 0}
      - if: {properties: {estimate: {properties: {kind: {const: exact}}}}}
        then:
          properties:
            method: {enum: [endpoint_difference, source_value]}
            censoring: {const: none}
      - if: {properties: {estimate: {properties: {kind: {const: bounded}}}}}
        then:
          properties:
            method: {const: evidence_bound}
            censoring: {enum: [none, left, right, both]}
      - if: {properties: {estimate: {properties: {kind: {const: unavailable}}}}}
        then:
          properties:
            method: {const: unavailable}
            censoring: {const: unavailable}
      - if: {properties: {method: {const: endpoint_difference}}}
        then:
          properties:
            quantity: {const: duration}
            start: {$ref: "#/$defs/TimePoint"}
            end: {$ref: "#/$defs/TimePoint"}
            estimate: {properties: {kind: {const: exact}}}
    description: >-
      Endpoint arithmetic, bounds, registered clocks, origin agreement, and
      censoring semantics are checked under the kernel rules.
    x-status: extracted
    x-source: *k

  MeasurementEvidence:
    type: object
    additionalProperties: false
    required: [measurement, evidence_refs]
    properties:
      measurement: {$ref: "#/$defs/Measurement", x-status: extracted, x-source: *k}
      evidence_refs: {$ref: "#/$defs/SupportRefs", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  ComponentIdentity:
    type: object
    additionalProperties: false
    required: [component, reported_version, build_digest, configuration_digest]
    properties:
      component: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      reported_version: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *k}
      build_digest: {$ref: "#/$defs/MaybeDigest", x-status: extracted, x-source: *k}
      configuration_digest: {$ref: "#/$defs/MaybeDigest", x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  SubjectIdentity:
    type: object
    additionalProperties: false
    required: [subject_id, subject_version, revision_basis, native_revision, configured_mode, interface_surface, configuration_digest, stack]
    properties:
      subject_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      subject_version: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      revision_basis: {enum: [native_revision, source_digest, operator_attestation, unknown], x-status: extracted, x-source: *k}
      native_revision: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *k}
      configured_mode: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      interface_surface: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      configuration_digest: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
      stack:
        type: array
        items: {$ref: "#/$defs/ComponentIdentity"}
        x-status: extracted
        x-source: *k
    x-status: extracted
    x-source: *k

  AssistanceRecord:
    type: object
    additionalProperties: false
    required: [planning_owner, assistance_track, planner_identity, plan, online_replanning, description]
    properties:
      planning_owner: {enum: [subject, external_planner, operator, none], x-status: extracted, x-source: *k}
      assistance_track: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      planner_identity: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *k}
      plan: {$ref: "#/$defs/MaybeArtifact", x-status: extracted, x-source: *k}
      online_replanning: {type: boolean, x-status: extracted, x-source: *k}
      description: {type: string, minLength: 1, x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  ExecutionDescriptor:
    type: object
    additionalProperties: false
    required: [mode, subject, connector_version, binding_version, assistance]
    properties:
      mode: {enum: [manual, subject], x-status: extracted, x-source: *l}
      subject:
        oneOf:
          - $ref: "#/$defs/SubjectIdentity"
          - $ref: "#/$defs/Missing"
        x-status: extracted
        x-source: *l
      connector_version: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *l}
      binding_version: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *l}
      assistance: {$ref: "#/$defs/AssistanceRecord", x-status: extracted, x-source: *l}
    allOf:
      - if: {properties: {mode: {const: manual}}}
        then:
          properties:
            subject: {$ref: "#/$defs/Inapplicable"}
            connector_version: {$ref: "#/$defs/Inapplicable"}
            binding_version: {$ref: "#/$defs/Inapplicable"}
        else:
          properties:
            subject: {$ref: "#/$defs/SubjectIdentity"}
            connector_version: {$ref: "#/$defs/Identifier"}
            binding_version: {$ref: "#/$defs/Identifier"}
    x-status: extracted
    x-source: *l

  AttemptReference:
    type: object
    additionalProperties: false
    required: [attempt_id, kind]
    properties:
      attempt_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      kind: {enum: [practice, production], x-status: extracted, x-source: *h}
    x-status: extracted
    x-source: *k

  AttemptContext:
    type: object
    additionalProperties: false
    required: [attempt_id, kind, target_class, target_id, evaluation_partition, rehearsal_of, performance_of, derived_from]
    properties:
      attempt_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      kind: {enum: [practice, production], x-status: extracted, x-source: *h}
      target_class: {enum: [laboratory_fixture, employer_origin], x-status: extracted, x-source: *k}
      target_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      evaluation_partition: {enum: [held_in, held_out], x-status: extracted, x-source: *k}
      rehearsal_of:
        type: array
        uniqueItems: true
        items: {$ref: "#/$defs/AttemptReference"}
        x-status: extracted
        x-source: *k
      performance_of:
        type: array
        uniqueItems: true
        items: {$ref: "#/$defs/AttemptReference"}
        x-status: extracted
        x-source: *k
      derived_from:
        type: array
        uniqueItems: true
        items: {$ref: "#/$defs/AttemptReference"}
        x-status: extracted
        x-source: *k
    allOf:
      - if: {properties: {target_class: {const: laboratory_fixture}}}
        then:
          properties:
            kind: {const: practice}
            evaluation_partition: {const: held_in}
      - if: {properties: {target_class: {const: employer_origin}}}
        then:
          properties: {evaluation_partition: {const: held_out}}
      - if: {properties: {kind: {const: practice}}}
        then:
          properties:
            performance_of: {maxItems: 0}
            rehearsal_of: {items: {properties: {kind: {const: production}}}}
            derived_from: {items: {properties: {kind: {const: practice}}}}
        else:
          properties:
            target_class: {const: employer_origin}
            rehearsal_of: {maxItems: 0}
            performance_of: {items: {properties: {kind: {const: practice}}}}
            derived_from: {items: {properties: {kind: {const: production}}}}
    description: Resolved lineage identities must agree; derived_from is acyclic and same-kind.
    x-status: extracted
    x-source: *l

  JobEntityKey:
    type: object
    additionalProperties: false
    required: [entity_type, target, job_id]
    properties:
      entity_type: {const: job, x-status: proposed, x-source: *w}
      target: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *c}
      job_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *c}
    x-status: inferred
    x-source: *c

  AttemptEntityKey:
    type: object
    additionalProperties: false
    required: [entity_type, attempt_id, kind]
    properties:
      entity_type: {const: application_attempt, x-status: proposed, x-source: *w}
      attempt_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *l}
      kind: {enum: [practice, production], x-status: extracted, x-source: *l}
    x-status: proposed
    x-source: *w

