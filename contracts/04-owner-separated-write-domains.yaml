      diagnostic: {$ref: "#/$defs/MaybeArtifact", x-status: extracted, x-source: *l}
    allOf:
      - if: {properties: {comparisons: {contains: {properties: {result: {const: contradicted}}}}}}
        then: {properties: {state: {const: contradicted}}}
      - if: {properties: {state: {const: contradicted}}}
        then:
          properties:
            comparisons: {contains: {properties: {result: {const: contradicted}}}}
      - if: {properties: {state: {const: reconciled}}}
        then:
          properties:
            coverage: {const: complete}
            comparisons:
              minItems: 1
              items: {properties: {result: {enum: [consistent, not_comparable]}}}
      - if: {properties: {coverage: {const: complete}}}
        then:
          properties:
            state: {enum: [reconciled, contradicted]}
            comparisons:
              minItems: 1
              items: {properties: {result: {enum: [consistent, contradicted, not_comparable]}}}
      - if: {properties: {coverage: {const: not_applicable}}}
        then:
          properties:
            state: {$ref: "#/$defs/Inapplicable"}
            comparisons: {maxItems: 0}
      - if:
          properties:
            coverage: {const: incomplete}
            comparisons: {not: {contains: {properties: {result: {const: contradicted}}}}}
        then:
          properties:
            state:
              allOf:
