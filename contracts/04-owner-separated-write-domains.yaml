    x-status: proposed
    x-source: *w

  EntityKey:
    oneOf:
      - $ref: "#/$defs/JobEntityKey"
      - $ref: "#/$defs/AttemptEntityKey"
      - $ref: "#/$defs/SessionEntityKey"
    x-status: proposed
    x-source: *w

  DomainName:
    enum: [crawler, downstream, dispatch, observation, execution, application, report, diagnostic]
    x-status: proposed
    x-source: *w

  DomainOwner:
    type: object
    additionalProperties: false
    required: [role, source_id, writer_id, owner_domain, publication_policy]
    properties:
      role: {enum: [crawler, product, connector, subject, origin, reconciler, observer, analyzer], x-status: proposed, x-source: *w}
      source_id: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *l}
      writer_id: {$ref: "#/$defs/MaybeString", x-status: extracted, x-source: *l}
      owner_domain: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *l}
