    properties:
      state:
        oneOf:
          - enum: [reconciled, contradicted]
          - $ref: "#/$defs/Missing"
        x-status: extracted
        x-source: *l
      coverage: {enum: [complete, incomplete, not_applicable], x-status: extracted, x-source: *l}
      inputs: {$ref: "#/$defs/ReportInputPins", x-status: extracted, x-source: *l}
      evaluator: {$ref: "#/$defs/VersionPin", x-status: extracted, x-source: *l}
      comparisons:
