$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:job-application:contracts:suggested-fix-registry:0.1.0
title: Suggested-fix registry
description: >-
  Review draft for evidence-backed, scoped recommendations that turn recorded
  application and laboratory findings into actionable improvements. A suggestion
  is not an implemented change, a verification result, or permission to execute
  another application. This file specifies records and validation rules only.
x-status: proposed
x-source: "1-handoff-brief.txt, Parts VII–IX."

x-source-index:
  handoff: &h "1-handoff-brief.txt, Parts VI–IX"
  boundaries: &b "1-handoff-brief.txt, Parts III–V and X"
  diagnosis: &d "3-hellscape-blueprint.md, §§4, 6.6, and 7"
  history: &e "3-hellscape-blueprint.md, §§1.3, 4.3–4.6, and 7.1"
  replay: &r "3-hellscape-blueprint.md, §§6.5 and 10.7–10.8"
  storage: &s "2-state-bank-crawler-blueprint.json, §11 and Decision 8"
  native: &n "4-circus-tent-arch.md, §§5.6–5.8"
  qualification: &q "5-browser-qualification.md, Evidence discipline"
  product: &p "6-get-a-job.xml.txt, capability_profile.txt, job_search_queries.txt, and AGENTS.md"
  kernel: &k "contracts/00-evidence-kernel.yaml, evidence-kernel/0.1.0"
  lifecycle: &l "contracts/01-application-attempt-lifecycle.yaml, application-attempt-lifecycle/0.1.0"
  wire: &w >-
    Proposed Step 0 wire design implementing the handoff's suggested-fix
    registry. Record names, review revisions, evidence-check vocabulary,
    catalog structure, and verification receipts are proposals, not claims
    about existing registry software or verified repairs.

x-contract:
  name: suggested-fix-registry
  version: 0.1.0
  maturity: review_draft
  owner: contracts
  consumers: [Hellscape, Circus Tent, Ringmaster, crawler, job-hunter]
  conformance_suite: conformance/05-suggested-fix-registry.md
  validation_gate: structural_validation_and_FIX_rules
  implementation:
    step_0: Schemas_and_conformance_specification_only
    before_M3: Manually_authored_and_reviewed_records_may_be_cited
    M3: Reviewed_registry_matching_and_verification_workflow
    not_required_for:
      - Recording a real manual production application.
      - Producing a diagnostic with a reasoned null suggestion.
      - Hellscape M1 acceptance.
      - Independently shipping another conforming component.
  purpose: >-
    Preserve an actionable learning path from a diagnostic finding to a
    product-specific change proposal and a falsifiable verification plan,
    without making that learning machinery a prerequisite for applying to jobs.
  x-status: inferred
  x-source: "1-handoff-brief.txt Parts VII–IX; 3-hellscape-blueprint.md §§4.7 and 7."

x-compatibility:
  schema_references: All_$ref_values_are_local
  common_types: >-
    Identifiers, digests, Missing, evidence references, journal prefixes,
    artifact references, version pins, component identities, subject identities,
    and capability references preserve evidence-kernel/0.1.0 wire meanings.
  diagnostic_link: >-
    FixReference exactly preserves the kernel Finding.suggested_fix reference
    shape: registry, rule_instance_id, evidence_refs, and verification_plan.
    RegistrySnapshot supplies the artifact pinned by FixReference.registry.
  registry_pin: >-
    VersionPin.id equals RegistrySnapshot.registry_id; VersionPin.version equals
    registry_version; artifact_digest hashes the complete canonical snapshot.
    The snapshot contains no digest of itself.
  instance_lookup: >-
    A snapshot contains at most one revision of each rule_instance_id.
    Therefore the kernel reference resolves one exact immutable instance
    without adding an instance_revision field to the kernel wire shape.
  plan_lookup: >-
    FixReference.verification_plan must identify the same complete plan artifact
    as the selected RuleInstance.verification_plan.
  measurements: >-
    This contract stores no measured durations or measured numeric outcomes.
    Verification cites journaled kernel Measurements, diagnostics, and native
    evidence. Integer counts here declare required evidence or record revisions;
    they are not measured performance claims.
  canonicalization: >-
    Use kernel-jcs-sha256/1: UTF-8 RFC 8785 canonical JSON and SHA-256 encoded as
    sha256:<64 lowercase hexadecimal digits>. Artifact digests identify exact
    stored bytes. Redacted exports have new identities.
  x-status: proposed
  x-source: *k

x-ownership:
  rule_classes:
    writer: registry_curator
    authority: >-
      Defines a proposed intervention family, its evidence requirements,
      contraindications, and verification obligations. Model-authored material
      remains a recorded proposal until adopted by this authenticated writer.
  class_reviews:
    writer: authenticated_human_reviewer
    authority: >-
      Approves, rejects, or revokes one exact class version. The operator may
      occupy this role; a second human or separate service is not required.
      A model, connector, or subject cannot self-issue human approval.
  rule_instances:
    writer: registry_curator
    authority: >-
      Records a concrete proposal and its evidence assessments. It cannot
      rewrite the cited diagnostic, subject claim, origin fact, or capability.
  catalog:
    writer: registry_publisher
    authority: >-
      Publishes a complete immutable selection of class, review, and instance
      revisions. Publication is an owner-local effect, not a transaction over
      diagnostic or execution owners.
  recommendations:
    writer: consumer_assessor
    authority: >-
      Hellscape or another authorized diagnostic consumer decides whether a
      rule instance matches its evidence. A connector declares observations
      and capabilities; it does not assess its own qualification.
  verification:
    writer: verification_assessor
    authority: >-
      Assesses a pinned plan against independent retained evidence. Native
      product test output may be evidence, but is not self-certifying judgment.
  implementation:
    writer: target_product_owner
    authority: >-
      Changes source, configuration, or operating procedures under that
      product's authorization. No registry record performs this write.
  x-status: inferred
  x-source: "1-handoff-brief.txt Parts VI and IX; 3-hellscape-blueprint.md §§3.2, 4.7, and 6.6."

x-source-reconciliation:
  - decision: >-
      The handoff fixes the registry schema at Step 0 and defers implementation
      to M3. Hellscape's M3 registry milestone therefore supplies later matching,
      counterfactual, minimization, and verification implementation, not a
      reason to postpone the reference format.
    x-status: extracted
    x-source: "1-handoff-brief.txt Parts VII–VIII; 3-hellscape-blueprint.md §7."

  - decision: >-
      Human approval attaches to an exact rule class version, as specified by
      the handoff's outer loop. Instances still require their own diagnostic
      support, scope match, contraindication checks, and verification plan.
      Class approval is neither instance verification nor execution authority.
    x-status: inferred
    x-source: "1-handoff-brief.txt Part IX; 3-hellscape-blueprint.md §6.6."

  - decision: >-
      Native learn-run-heal cache changes remain execution-layer behavior.
      An immediate selector-cache update described by Circus Tent is not
      automatically a reviewed fix-registry instance or proof of improvement.
      Conversely, this registry does not impose human approval on every
      already-authorized native healing action.
    x-status: inferred
    x-source: "4-circus-tent-arch.md §5.6; 1-handoff-brief.txt Parts V and IX."

  - decision: >-
      Historical cancellation, timing, and isolation descriptions may inform
      rule proposals, but do not certify a current subject revision. In
      particular, the invalid isolation write control cannot support a
      confirmed non-isolation diagnosis or a remedy premised on that diagnosis.
    x-status: extracted
    x-source: *e

  - decision: >-
      A fix may target the subject, connector, planner, fixture, environment, or
      policy according to supported attribution. An adapter overclaim or a
      fixture defect must not be relabeled as a subject defect to fit a rule.
    x-status: extracted
    x-source: *d

  - decision: >-
      The registry does not contain a universal patch representation or a
      cross-browser primitive API. A class may describe a common problem, but
      Circus Tent and Ringmaster receive separate product-specific instances
      and verification evidence.
    x-status: inferred
    x-source: *b

  - decision: >-
      No handoff amendment is introduced. Review, catalog, and verification
      record shapes below are proposed mechanisms for its existing commitments.
    x-status: proposed
    x-source: *w

x-validation:
  requirements:
    - >-
      Decode YAML into JSON-compatible values. Reject duplicate keys, non-finite
      numbers, undeclared fields, unknown record versions, and unresolved local
      schema references. Enforce JSON Schema 2020-12.
    - >-
      Structural validity is necessary but insufficient. Enforce all applicable
      FIX rules, evidence-kernel rules, and lifecycle scope/authority rules.
      Caller-supplied writer IDs, evidence labels, or review decisions do not
      authenticate themselves.
    - >-
      Only Missing.value may contain serialized null. Required fields cannot
      disappear to evade missingness. Empty arrays mean an established empty
      collection, not unknown contents.
    - >-
      Resolve and hash-check every artifact and evidence reference. Verify
      copied diagnostic IDs, analysis revisions, input prefixes, finding IDs,
      subject identities, and capability scopes against their actual records.
    - >-
      Text predicates are reviewed declarative requirements, not executable
      expressions. Procedures and oracles are immutable referenced artifacts.
      This schema does not authorize loading code from a rule or executing a
      model-generated command.
  x-status: proposed
  x-source: *w

x-semantic-rules:
  - id: FIX-JOURNAL
    classification: invariant
    rule: >-
      Every citable class, review, instance, plan, catalog, and verification
      receipt is immutable and registered in the journal. Its evidence_prefix
      contains its support and locally journaled imports, not its own later
      artifact-registration event. Retain original source scope and provenance
      through imports.
    consequence: >-
      A finding citation resolves a published diagnostic and a finding within
      that diagnostic's pinned input prefix. Unjournaled notes, mutable source
      files, current web pages, or a plausible model explanation are not evidence.
    derivation: "Anything not journaled cannot be cited, and retroactive evidence destroys replay."
    x-status: extracted
    x-source: *h

  - id: FIX-VERSIONS
    classification: invariant
    rule: >-
      Record identities and revisions are immutable. Reusing an identity/version
      or identity/revision with different bytes is an integrity conflict.
      Revision chains start at 1 and advance by one. Supersession preserves
      previous bytes and resolves to the immediately preceding compatible record.
    consequence: >-
      A changed class definition requires a new class version and fresh human
      review. A new target revision, subject version, configured mode, interface,
      or applicability cell requires a new instance identity and its own
      evidence assessment. Prior verification cannot be inherited.
    derivation: "A prior-version finding must not become a current-version assumption."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VI; contracts/00-evidence-kernel.yaml EK-CAPABILITY."

  - id: FIX-CLASS-REVIEW
    classification: invariant
    rule: >-
      An eligible recommendation resolves to an approved review of the exact
      class artifact in its pinned registry snapshot. Verify the reviewer as an
      authenticated human under the pinned review policy. First reviews may
      approve or reject; revocation names a prior approved review chain.
    consequence: >-
      Model proposals, approvals of a different class version, and instance-only
      approvals do not satisfy this rule. A later rejection or revocation
      changes future catalog eligibility without editing historical diagnostics.
      Deliberately selecting an older catalog to evade a visible revocation is
      prohibited.
    derivation: "The reviewed outer loop approves rule classes; the judged component cannot approve itself."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part IX; 3-hellscape-blueprint.md §6.6."

  - id: FIX-CATALOG
    classification: invariant
    rule: >-
      A registry snapshot pins complete class, current review, and instance
      artifacts at a named prefix. Publish it only after all referenced bytes
      are durable and validated. Readers see one complete old or new snapshot,
      never partial entries.
    consequence: >-
      A catalog may contain pending or rejected proposals for inspection; their
      presence is not recommendation eligibility. A new diagnostic uses the
      catalog head evidenced at its selection boundary. Exact re-derivation
      uses the recorded snapshot, not today's head or review state.
    derivation: "Asynchronous publication and deterministic diagnostic replay require immutable input cuts."
    x-status: inferred
    x-source: "2-state-bank-crawler-blueprint.json Decision 8; contracts/00-evidence-kernel.yaml EK-DIAGNOSTIC."

  - id: FIX-SCOPE
    classification: invariant
    rule: >-
      An instance targets one product and one evidenced component version key.
      Every applicability cell pins task, environment, execution mode, subject
      identity when present, assistance, state policies, and attempt scope.
      A recommendation must name and match an existing cell; matching a symptom
      string alone is insufficient.
    consequence: >-
      A shared rule class does not share native implementation. A Circus Tent
      instance cannot supply a Ringmaster repair or vice versa. Native-binding
      remedies refer to the particular product's native surface without
      introducing a shared ElementHandle or primitive signature.
    derivation: "Cross-browser internal unification repeats the Stagehand-on-Juggler failure."
    x-status: inferred
    x-source: *b

  - id: FIX-REQUIRED-EVIDENCE
    classification: invariant
    rule: >-
      Instances reproduce every class evidence requirement unchanged and may add
      requirements. For each requirement and applicability cell, record exactly
      one EvidenceCheck. met requires the declared predicate, minimum distinct
      evidence units, allowed source scopes, and exact target/version support.
      Unsupported or missing observations remain indeterminate.
    consequence: >-
      Count independently identified attempts, artifacts, or fixture
      configurations, not duplicate callbacks, duplicate imports, or multiple
      findings from the same unit. Evidence labels are checked against ingestion,
      not trusted because a proposal supplies them.
    derivation: "Repeated delivery and documentary claims must not manufacture experimental support."
    x-status: inferred
    x-source: "3-hellscape-blueprint.md §§4.3–4.7 and 6.6; contracts/00-evidence-kernel.yaml."

  - id: FIX-ATTRIBUTION
    classification: invariant
    rule: >-
      Keep symptom, causal hypothesis, defect locus, and proposed intervention
      distinct. A concrete remedy requires confirmed or supported attribution
      at the scope it claims. Native absence, an observed violation, and an
      indeterminate result cannot substitute for one another.
    consequence: >-
      Unknown causes may be retained as suspected proposals for investigation,
      but do not produce an eligible suggested_fix. Invalid controls, unexposed
      work, missing dependencies, or an unmapped connector operation cannot
      establish the corresponding subject defect. Preserve contrary evidence.
    derivation: "Naming an internal selector or isolation defect without valid controls is unsupported attribution."
    x-status: extracted
    x-source: "3-hellscape-blueprint.md §§1.3, 4.1, 4.3–4.7; 5-browser-qualification.md."

  - id: FIX-CONTRAINDICATIONS
    classification: invariant
    rule: >-
      Instances reproduce every class contraindication unchanged and may add
      contraindications. Record exactly one check per contraindication and
      applicability cell. An eligible recommendation requires evidenced absence
      of each applicable contraindication.
    consequence: >-
      present and unknown both withhold the suggestion. Silence is not absence.
      A human class approval cannot waive missing controls, incompatible native
      surfaces, conflicting facts, or a contraindication named by the class.
    derivation: "Evidence-backed recommendations must state where their reasoning or intervention is unsafe."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VIII; 3-hellscape-blueprint.md §6.6."

  - id: FIX-RECOMMEND
    classification: invariant
    rule: >-
      Emit FixReference only when the exact class is approved, the target and
      cell match, required evidence checks are met, contraindications are absent,
      attribution is supported, and a complete falsifiable plan is registered.
      The consumer independently verifies these conditions rather than trusting
      a proposal's confidence label.
    consequence: >-
      No completed verification receipt is required to recommend an unimplemented
      change. Without an eligible rule, emit Missing with a kernel reason and
      useful detail. M1 may use not_enabled; insufficient evidence uses
      not_observed or observation_lost, not a new null-reason vocabulary.
    derivation: "A suggestion must be justified, but requiring a repair to be verified before suggesting it is circular."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VII; 3-hellscape-blueprint.md §§4.4, 4.7, and 6.6."

  - id: FIX-PRACTICE
    classification: invariant
    rule: >-
      Preserve practice/production and held_in/held_out in every application
      scope. Hellscape is practice and held_in; employer origins are held_out.
      Diagnostic and verification references retain their original attempt
      kinds. Historical and synthetic evidence remain explicitly labeled.
    consequence: >-
      A laboratory result can motivate an execution-layer improvement but cannot
      establish production commitment, origin representativeness, or held-out
      transfer. A production recommendation needs its declared production-scope
      support; a practice-only check remains practice-only.
    derivation: "Tuning against Hellscape is not qualification for a real employer's forms."
    x-status: extracted
    x-source: *b

  - id: FIX-PLAN
    classification: invariant
    rule: >-
      The plan names the baseline target, exact applicability cells, verification
      methods, immutable procedures and oracles, pass/fail predicates, evidence
      requirements, declared budgets, and stop conditions. It includes every
      class-required verification role and identifies controlled differences
      for comparisons.
    consequence: >-
      Candidate evaluation and regression checks are required by this proposed
      schema. A plan claiming improvement must include a defensible baseline;
      a plan claiming transfer must include that transfer scope. An absent or
      unresolved procedure cannot be replaced by "rerun until it works."
    derivation: "A recommendation without a falsifiable verification path is not actionable learning."
    x-status: inferred
    x-source: "1-handoff-brief.txt Part VIII; 3-hellscape-blueprint.md §§6.6 and 7.2."

  - id: FIX-VERIFY
    classification: invariant
    rule: >-
      Verification receipts identify the exact instance and plan, actual target
      revision, realized scopes, assessor, and evidence for every planned check.
      Preserve invalid controls, incomparability, skipped checks, and contrary
      results. A newly tested subject version requires its own capability
      descriptors and observations.
    consequence: >-
      criterion_met describes a plan oracle, not application success or native
      capability presence. Underlying diagnostic assessments retain capability,
      opportunity, and result separately. Missing required checks prevent a
      claim that the plan was satisfied. No portfolio-wide qualified flag exists.
    derivation: "A skipped required step is not a pass, and verification cannot inherit a predecessor's capability."
    x-status: inferred
    x-source: "5-browser-qualification.md; 1-handoff-brief.txt Part VI; 3-hellscape-blueprint.md §6.6."

  - id: FIX-NO-AUTO-PATCH
    classification: invariant
    rule: >-
      Class approval, recommendation, implementation, and verification are
      separate facts with separate authorities. No record here invokes a
      browser, patches a product, changes an active task, promotes a subject
      version, or commissions an application.
    consequence: >-
      The autonomous fixture-variant loop does not gain authority to activate
      execution-layer fixes. Implementation follows the product owner's change
      process. Production work still requires its own commission and permissions.
    derivation: "Hellscape diagnoses the framework; it does not silently repair the subject or become the job pipeline."
    x-status: extracted
    x-source: "1-handoff-brief.txt Parts III and IX; 3-hellscape-blueprint.md §§1.2 and 3.2."

  - id: FIX-SAFE-VERIFICATION
    classification: invariant
    rule: >-
      Offline fixture replay and diagnostic re-derivation invoke no subject,
      browser, or external mutation. They cannot by themselves demonstrate
      changed native execution behavior. Browser or origin observations are
      separately authorized new attempts, not exact replay.
    consequence: >-
      A plan cannot resolve uncertain delivery by resubmitting with a fresh key,
      switching executors, or forcing a second production application as an A/B
      control. Preserve lifecycle duplicate-risk review and same-kind lineage.
      A plan's mutation_policy is a restriction, never an authorization grant.
    derivation: "External commitment cannot be rolled back by local replay or observer termination."
    x-status: inferred
    x-source: "contracts/01-application-attempt-lifecycle.yaml LIFE-IDEMPOTENCY; 3-hellscape-blueprint.md §§6.5 and 10.8."

  - id: FIX-TIME-NULL
    classification: invariant
    rule: >-
      Measurements cited by evidence or verification retain the kernel's origin,
      clock_id, boot_id, exact/bounded/unavailable estimate, and censoring.
      Compare matching semantic intervals or defensible bounds; never subtract
      across clocks or boots, and never use UTC annotations as elapsed time.
    consequence: >-
      A subject-reported exact zero remains zero, not missing and not independent
      proof of fast execution. Missing native timing remains unavailable.
      manual_override missingness requires an authenticated journaled decision
      and cannot erase an original claim or fact.
    derivation: "The _elapsed() defect and ambiguous nulls are paid-for integration failures."
    x-status: extracted
    x-source: *k

  - id: FIX-RETENTION
    classification: invariant
    rule: >-
      Retained recommendations pin their registry, instance, class review, plan,
      diagnostic, and evidence dependencies transitively. Supersession or
      revocation does not permit deleting bytes needed by historical reports.
      Restrict artifacts containing candidate data, native bodies, or credentials.
    consequence: >-
      A public rule description contains no secret or unnecessary personal data.
      Artifact loss produces an integrity incident and honest missing evidence,
      never reconstruction of different bytes under the old digest.
    derivation: "A reproducible learning event requires durable evidence, not mutable links."
    x-status: inferred
    x-source: "contracts/00-evidence-kernel.yaml EK-ARTIFACTS; 6-get-a-job.xml.txt AGENTS.md."

x-reference-order:
  sequence:
    - Publish the source diagnostic with its original finding and reasoned null or earlier recommendation.
    - Register the class definition, its human review, and the change proposal artifacts.
    - Register the verification plan, naming the planned rule_instance_id but not the future instance digest.
    - Register the rule instance citing the already published diagnostic and plan.
    - Publish the immutable registry snapshot containing that instance.
    - A later diagnostic revision may cite the snapshot and instance through FixReference.
    - Later verification receipts cite the exact instance digest and newly collected evidence.
  constraints:
    - Never edit the source diagnostic to attach its newly created recommendation.
    - An instance cannot use the diagnostic that first introduces that same instance as its own causal support.
    - A plan does not contain the digest of the instance that contains the plan reference.
    - A verification receipt does not retroactively become evidence available when the proposal was made.
  x-status: proposed
  x-source: "contracts/00-evidence-kernel.yaml EK-DIAGNOSTIC; 3-hellscape-blueprint.md §§4.7 and 10.7."

x-provisionals:
  - decision: Exact applicability cells rather than an executable wildcard-matching language.
    rationale: >-
      Step 0 can validate scope and evidence without inventing a rule engine.
      Manual assessment and later deterministic matchers can consume the same
      records. Broad rule classes remain reusable; instances remain accountable.
    flip_condition: >-
      Add a versioned predicate language only when recurring reviewed instances
      demonstrate necessary matching semantics that finite cells cannot express
      economically, with equivalent evidence and scope conformance.
    x-status: proposed
    x-source: *w

  - decision: Verification receipts have per-check results and no aggregate repair-success status.
    rationale: >-
      This keeps regression, comparability, transfer, and missing checks visible.
      A read-side summary may be derived from the complete pinned plan and receipt.
    flip_condition: >-
      Add a derived summary in a new version only if consumers repeatedly
      implement inconsistent reductions and a common reduction preserves all
      scope, validity, and missing-evidence distinctions.
    x-status: proposed
    x-source: *w

x-open-evidence:
  - missing: No executable reviewed fix registry or complete rule catalog is supplied.
    resolution: >-
      Seed only manually reviewed classes backed by retained findings and
      verification procedures. Do not manufacture repairs, source locations,
      native primitive signatures, or confidence probabilities to populate it.
      An empty catalog is valid.
    x-status: uncertain
    x-source: "1-handoff-brief.txt Part VII; 3-hellscape-blueprint.md §§4.7 and 6.6."

  - missing: The raw historical cancellation, isolation, and timing artifacts are not included.
    resolution: >-
      Import originals when available with their source identities and hashes.
      Until then, the blueprint descriptions are documentary historical
      evidence, not executed current-version observations.
    x-status: uncertain
    x-source: *e

oneOf:
  - $ref: "#/$defs/RuleClass"
  - $ref: "#/$defs/ClassReview"
  - $ref: "#/$defs/RuleInstance"
  - $ref: "#/$defs/VerificationPlan"
  - $ref: "#/$defs/RegistrySnapshot"
  - $ref: "#/$defs/VerificationReceipt"

$defs:
  SchemaVersion:
    const: suggested-fix-registry/0.1.0
    x-status: proposed
    x-source: *w

  Identifier:
    type: string
    minLength: 1
    x-status: extracted
    x-source: *k

  Revision:
    type: integer
    minimum: 0
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  PositiveInteger:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    x-status: extracted
    x-source: *k

  Digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
    x-status: extracted
    x-source: *k

  Missing:
    type: object
    additionalProperties: false
    required: [value, reason]
    properties:
      value: {type: "null", x-status: extracted, x-source: *k}
      reason:
        enum: [not_enabled, not_applicable, not_observed, observation_lost, unsupported_by_subject, manual_override]
        x-status: extracted
        x-source: *h
      detail: {type: string, minLength: 1, x-status: extracted, x-source: *k}
    x-status: extracted
    x-source: *k

  Inapplicable:
    allOf:
      - $ref: "#/$defs/Missing"
      - properties: {reason: {const: not_applicable}}
    x-status: extracted
    x-source: *k

  MaybeString:
    oneOf:
      - $ref: "#/$defs/Identifier"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  MaybeDigest:
    oneOf:
      - $ref: "#/$defs/Digest"
      - $ref: "#/$defs/Missing"
    x-status: extracted
    x-source: *k

  EvidenceRef:
    type: object
    additionalProperties: false
    required: [journal_id, sequence, event_id, event_hash, pointer]
    properties:
      journal_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      sequence: {$ref: "#/$defs/PositiveInteger", x-status: extracted, x-source: *k}
      event_id: {$ref: "#/$defs/Identifier", x-status: extracted, x-source: *k}
      event_hash: {$ref: "#/$defs/Digest", x-status: extracted, x-source: *k}
      pointer:
        type: string
        pattern: '^(?:/(?:[^~/]|~[01])*)*$'
        x-status: extracted
        x-source: *k
    x-status: extracted
    x-source: *k

  EvidenceRefs:
    type: array
    uniqueItems: true
    items: {$ref: "#/$defs/EvidenceRef"}
    x-status: extracted
    x-source: *k

  SupportRefs:
    allOf:
      - $ref: "#/$defs/EvidenceRefs"
      - minItems: 1
    x-status: extracted
    x-source: *k

  MaybeEvidenceRef:
    oneOf:
      - $ref: "#/$defs/EvidenceRef"
      - $ref: "#/$defs/Missing"
    x-status: extracted
